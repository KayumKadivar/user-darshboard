<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instrument Workshop | GNFC E-Logbook</title>

  <!-- CSS Dependencies -->
  <link rel="stylesheet" href="../../../css/phosphor.css">
  <link rel="stylesheet" href="../../../css/theme-vars.css">
  <link rel="stylesheet" href="../../../css/utilities.css">
  <link rel="stylesheet" href="../../../css/common.css">
  <link rel="stylesheet" href="../../../css/modal-ui.css">
  <link rel="stylesheet" href="../../../css/pages/style.css">
  <link rel="stylesheet" href="../iso.css">

  <!-- JS Dependencies -->
  <script src="../../../js/vendor/jquery-3.7.1.min.js"></script>
  <script src="../../../js/vendor/sweetalert2.all.min.js"></script>
  <script src="../../../js/theme-control.js"></script>
  <script src="../../../js/sidebar.js" defer></script>
  <script src="../../../js/header.js" defer></script>

  <script>
    window.activePage = 'inst_ws';
  </script>

  <style>
    .inst-ws-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 24px;
      min-height: calc(100vh - 160px);
    }

    .inst-ws-container {
      width: 100%;
      max-width: 800px;
      background: var(--app-panel);
      border: 1px solid var(--app-border);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    }

    .inst-ws-header {
      border-bottom: 1px solid var(--app-border);
      padding-bottom: 20px;
      margin-bottom: 28px;
      text-align: center;
    }

    .inst-ws-header h2 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--typo-orange);
      letter-spacing: 0.05em;
      margin: 0;
    }

    .inst-ws-menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    /* Make the 5th item (JOB HISTORY) span full width for visual balance */
    .inst-ws-menu-grid a:nth-child(5) {
      grid-column: span 2;
    }

    .inst-ws-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--app-border);
      border-radius: 8px;
      color: var(--typo-primary);
      text-decoration: none !important;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
      transition: all 0.25s ease;
    }

    .inst-ws-menu-item i {
      font-size: 18px;
      color: var(--typo-secondary);
      transition: transform 0.25s ease, color 0.25s ease;
    }

    .inst-ws-menu-item:hover {
      background: rgba(255, 153, 0, 0.04);
      border-color: var(--typo-orange);
      color: var(--typo-orange);
    }

    .inst-ws-menu-item:hover i {
      color: var(--typo-orange);
      transform: translateX(4px);
    }
  </style>
</head>

<body class="dashboard-body">

  <!-- Sidebar Container -->
  <div class="sidebar-container"></div>

  <main class="main-wrapper">
    <!-- Header Container -->
    <div id="header-container" data-back="../iso.html"
      data-breadcrumb="ISO Dashboard:../iso.html,Instrument Workshop:active">
    </div>

    <!-- Page Content Area -->
    <div class="app-content-area">

      <div class="inst-ws-wrapper">
        <div class="inst-ws-container">
          <div class="inst-ws-header">
            <h2>INSTRUMENT WORK SHOP</h2>
          </div>

          <div class="inst-ws-menu-grid">
            <a href="cd_library.html" class="inst-ws-menu-item">
              <span>INST LAB CD LIBRARY</span>
              <i class="ph-bold ph-arrow-right"></i>
            </a>
            <a href="#" class="inst-ws-menu-item">
              <span>INST LAB TEST EQUIPMENT</span>
              <i class="ph-bold ph-arrow-right"></i>
            </a>
            <a href="book_library.html" class="inst-ws-menu-item">
              <span>INST LAB BOOK LIBRARY</span>
              <i class="ph-bold ph-arrow-right"></i>
            </a>
            <a href="#" class="inst-ws-menu-item">
              <span>INST LAB JOB REGISTER</span>
              <i class="ph-bold ph-arrow-right"></i>
            </a>
            <a href="#" class="inst-ws-menu-item">
              <span>JOB HISTORY</span>
              <i class="ph-bold ph-arrow-right"></i>
            </a>
          </div>
        </div>
      </div>

    </div>
  </main>

</body>

</html>
