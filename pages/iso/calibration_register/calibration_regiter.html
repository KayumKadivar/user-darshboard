<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPCB Calibration Register | GNFC E-Logbook</title>

  <!-- CSS Dependencies -->
  <link rel="stylesheet" href="../../../css/phosphor.css">
  <link rel="stylesheet" href="../../../css/theme-vars.css">
  <link rel="stylesheet" href="../../../css/utilities.css">
  <link rel="stylesheet" href="../../../css/common.css">
  <link rel="stylesheet" href="../../../css/pages/style.css">
  <link rel="stylesheet" href="../iso.css">

  <!-- JS Dependencies -->
  <script src="../../../js/vendor/jquery-3.7.1.min.js"></script>
  <script src="../../../js/theme-control.js"></script>
  <script src="../../../js/sidebar.js" defer></script>
  <script src="../../../js/header.js" defer></script>

  <script>
    window.activePage = 'iso';
  </script>
</head>

<body class="dashboard-body">

  <!-- Sidebar Container -->
  <div class="sidebar-container"></div>

  <main class="main-wrapper">
    <!-- Header Container -->
    <div id="header-container" data-back="../iso.html"
      data-breadcrumb="ISO Dashboard:../iso.html,CPCB Calibration Register:active">
    </div>

    <!-- Page Content Area -->
    <div class="iso-app-content">

      <!-- Calibration Register Unit Panel -->
      <div class="iso-calibration-grid">
        <div class="iso-calibration-unit">
          <div class="iso-calibration-unit-1" onclick="handleUnitClick('AA')">
            <span class="iso-calibration-unit-2">AA</span>
          </div>
          <div class="iso-calibration-unit-1" onclick="handleUnitClick('AAQM')">
            <span class="iso-calibration-unit-2">AAQM</span>
          </div>
          <div class="iso-calibration-unit-1" onclick="handleUnitClick('AMM')">
            <span class="iso-calibration-unit-2">AMM</span>
          </div>
          <div class="iso-calibration-unit-1" onclick="handleUnitClick('ANIPF')">
            <span class="iso-calibration-unit-2">ANIPF</span>
          </div>
          <div class="iso-calibration-unit-1" onclick="handleUnitClick('ANITDI')">
            <span class="iso-calibration-unit-2">ANITDI</span>
          </div>
          <div class="iso-calibration-unit-1" onclick="handleUnitClick('ASGP')">
            <span class="iso-calibration-unit-2">ASGP</span>
          </div>
          <div class="iso-calibration-unit-1" onclick="handleUnitClick('BAGG')">
            <span class="iso-calibration-unit-2">BAGG</span>
          </div>
          <div class="iso-calibration-unit-1" onclick="handleUnitClick('BOILER')">
            <span class="iso-calibration-unit-2">BOILER</span>
          </div>
          <div class="iso-calibration-unit-1" onclick="handleUnitClick('CMS')">
            <span class="iso-calibration-unit-2">CMS</span>
          </div>
          <div class="iso-calibration-unit-1" onclick="handleUnitClick('CPSU')">
            <span class="iso-calibration-unit-2">CPSU</span>
          </div>
          <div class="iso-calibration-unit-1" onclick="handleUnitClick('DM')">
            <span class="iso-calibration-unit-2">DM</span>
          </div>
          <div class="iso-calibration-unit-1" onclick="handleUnitClick('EA')">
            <span class="iso-calibration-unit-2">EA</span>
          </div>
          <div class="iso-calibration-unit-1" onclick="handleUnitClick('FA')">
            <span class="iso-calibration-unit-2">FA</span>
          </div>
          <div class="iso-calibration-unit-1" onclick="handleUnitClick('INSTWS')">
            <span class="iso-calibration-unit-2">INSTWS</span>
          </div>
          <div class="iso-calibration-unit-1" onclick="handleUnitClick('M1')">
            <span class="iso-calibration-unit-2">M1</span>
          </div>
          <div class="iso-calibration-unit-1" onclick="handleUnitClick('M2')">
            <span class="iso-calibration-unit-2">M2</span>
          </div>
          <div class="iso-calibration-unit-1" onclick="handleUnitClick('MINMAX')">
            <span class="iso-calibration-unit-2">MINMAX</span>
          </div>
          <div class="iso-calibration-unit-1" onclick="handleUnitClick('NPP')">
            <span class="iso-calibration-unit-2">NPP</span>
          </div>
          <div class="iso-calibration-unit-1" onclick="handleUnitClick('SPP')">
            <span class="iso-calibration-unit-2">SPP</span>
          </div>
          <div class="iso-calibration-unit-1" onclick="handleUnitClick('UREA')">
            <span class="iso-calibration-unit-2">UREA</span>
          </div>
        </div>
      </div>

      <!-- Filter Section (8 registers matching user screenshot) -->
      <div class="iso-calibration-filter-3">
        <!-- Row 1 Filter -->
        <div class="iso-calibration-filter">
          <label class="iso-calibration-filter-4">
            <input type="radio" name="calibrationFilter" class="iso-calibration-filter-2" value="CPCB Calibration Register" checked>
            <span>CPCB Calibration Register</span>
          </label>
          <label class="iso-calibration-filter-4">
            <input type="radio" name="calibrationFilter" class="iso-calibration-filter-2" value="Instrument Maintenance Register">
            <span>Instrument Maintenance Register</span>
          </label>
          <label class="iso-calibration-filter-4">
            <input type="radio" name="calibrationFilter" class="iso-calibration-filter-2" value="Radioactive Measurement Register">
            <span>Radioactive Measurement Register</span>
          </label>
          <label class="iso-calibration-filter-4">
            <input type="radio" name="calibrationFilter" class="iso-calibration-filter-2" value="Radioactive Source Replacement Records">
            <span>Radioactive Source Replacement Records</span>
          </label>
        </div>

        <div class="iso-calibration-filter-1"></div>

        <!-- Row 2 Filter -->
        <div class="iso-calibration-filter">
          <label class="iso-calibration-filter-4">
            <input type="radio" name="calibrationFilter" class="iso-calibration-filter-2" value="Lead Acid Batteries Maintenance Register">
            <span>Lead Acid Batteries Maintenance Register</span>
          </label>
          <label class="iso-calibration-filter-4">
            <input type="radio" name="calibrationFilter" class="iso-calibration-filter-2" value="Lead Acid Batteries Replacement Register">
            <span>Lead Acid Batteries Replacement Register</span>
          </label>
          <label class="iso-calibration-filter-4">
            <input type="radio" name="calibrationFilter" class="iso-calibration-filter-2" value="Test Equipment Calibration Register">
            <span>Test Equipment Calibration Register</span>
          </label>
          <label class="iso-calibration-filter-4">
            <input type="radio" name="calibrationFilter" class="iso-calibration-filter-2" value="Lifting/Logistic Equipment Checking Record">
            <span>LIFTING/LOGISTIC EQUIPMENT CHECKING RECORD</span>
          </label>
        </div>
      </div>

    </div>
  </main>

  <script>
    $(function() {
      // 1. Restore state from localStorage on page load
      const savedFilter = localStorage.getItem('calibration_selected_filter');
      if (savedFilter) {
        $(`input[name="calibrationFilter"][value="${savedFilter}"]`).prop('checked', true);
      }

      // 2. Save state to localStorage on change
      $('input[name="calibrationFilter"]').on('change', function() {
        localStorage.setItem('calibration_selected_filter', $(this).val());
      });

      window.handleUnitClick = function(unit) {
        // Check which radio button is selected
        const selectedFilter = $('input[name="calibrationFilter"]:checked').val();
        
        switch (selectedFilter) {
          case 'Radioactive Measurement Register':
            window.location.href = `radioactive_magereemnt.html?plant=${unit}`;
            break;
          case 'Radioactive Source Replacement Records':
            window.location.href = `radioactive_source_replacement.html?plant=${unit}`;
            break;
          case 'Lead Acid Batteries Maintenance Register':
            window.location.href = `lead_acid_batteries_maintenance.html?plant=${unit}`;
            break;
          case 'Lead Acid Batteries Replacement Register':
            window.location.href = `lead_acid_batteries_replacement.html?plant=${unit}`;
            break;
          case 'Test Equipment Calibration Register':
            window.location.href = `test_equipment_calibration.html?plant=${unit}`;
            break;
          case 'Lifting/Logistic Equipment Checking Record':
            window.location.href = `lifting_logistic_equipment.html?plant=${unit}`;
            break;
          case 'Instrument Maintenance Register':
            window.location.href = `instrument_maintenance_register.html?plant=${unit}`;
            break;
          default:
            window.location.href = `calibration_detail.html?plant=${unit}`;
            break;
        }
      };
    });
  </script>
</body>

</html>
