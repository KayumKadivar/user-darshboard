<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Consumption Parameters | GNFC E-Logbook</title>

  <!-- CSS Dependencies -->
  <link rel="stylesheet" href="../../../css/phosphor.css">
  <link rel="stylesheet" href="../../../css/theme-vars.css">
  <link rel="stylesheet" href="../../../css/utilities.css">
  <link rel="stylesheet" href="../../../css/common.css">
  <link rel="stylesheet" href="../../../css/modal-ui.css">
  <link rel="stylesheet" href="../../../css/pages/style.css">
  <link rel="stylesheet" href="../iso.css">

  <!-- JS Dependencies -->
  <script src="../../../js/vendor/jquery-3.7.1.min.js"></script>
  <script src="../../../js/vendor/sweetalert2.all.min.js"></script>
  <script src="../../../js/theme-control.js"></script>
  <script src="../../../js/sidebar.js" defer></script>
  <script src="../../../js/header.js" defer></script>

  <script>
    window.activePage = 'iso';
  </script>

  <style>
    .cons-view-content {
      min-height: calc(100vh - 120px);
    }

    .cons-view-card {
      background: var(--app-panel, #ffffff);
      border: 1px solid var(--app-border, #cbd5e1);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
      margin-top: 24px;
    }
    
    .cons-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--app-border, #cbd5e1);
      padding-bottom: 14px;
    }
    
    .cons-plant-label {
      color: var(--typo-orange, #ea580c) !important;
      font-family: 'Outfit', sans-serif;
      font-weight: 850;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .cons-center-title {
      color: var(--typo-primary) !important;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .pdr-table-input {
      width: 100%;
      height: 38px;
      padding: 8px 12px;
      border: 1px solid var(--app-border, #cbd5e1);
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--typo-primary);
      background: var(--app-panel, #ffffff);
      transition: all 0.2s ease;
    }
    
    .pdr-table-input:focus {
      outline: none;
      border-color: var(--typo-orange, #ea580c);
      box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.15);
    }
    
    /* Buttons */
    .cons-btn-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 24px;
    }

    .iso-btn-orange {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--typo-orange, #ea580c);
      color: #ffffff !important;
      border: none;
      border-radius: 6px;
      padding: 10px 24px;
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(234, 88, 12, 0.15);
    }

    .iso-btn-orange:hover {
      background: #f97316;
      transform: translateY(-1.5px);
    }

    .iso-btn-orange-1 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #ffffff;
      color: var(--typo-orange, #ea580c) !important;
      border: 1.5px solid var(--typo-orange, #ea580c) !important;
      border-radius: 6px;
      padding: 9px 22px;
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .iso-btn-orange-1:hover {
      background: #fff7ed;
      color: #c2410c !important;
      border-color: #c2410c !important;
      transform: translateY(-1.5px);
    }
  </style>
</head>

<body class="dashboard-body">

  <!-- Sidebar Container -->
  <div class="sidebar-container"></div>

  <main class="main-wrapper">
    <!-- Header Container -->
    <div id="header-container" data-back="consumption_register.html"
      data-breadcrumb="ISO Dashboard:../iso.html,Consumption Register:consumption_register.html,Add Static Parameters:active">
    </div>

    <!-- Page Content Area -->
    <div class="iso-app-content flex flex-col justify-between cons-view-content">

      <div>
        <!-- Action Bar -->
        <div class="iso-action-bar-3 iso-calib-action-5">
          <div class="iso-calib-action-12">
            <div class="iso-calib-action-8" style="background: rgba(234, 88, 12, 0.1); color: var(--typo-orange);">
              <i class="ph-fill ph-plus-circle"></i>
            </div>
            <div>
              <div class="iso-calib-action">
                <h2 class="iso-calib-action-10">Configure Consumption Parameters</h2>
                <span class="iso-calib-action-2" style="background: rgba(234, 88, 12, 0.1); color: var(--typo-orange);">IMS/F/INST/46</span>
              </div>
              <p class="iso-calib-action-1">Add static baseline values, target units, and measurement metrics for the registry</p>
            </div>
          </div>
        </div>

        <!-- Modern Card Wrapper -->
        <div class="cons-view-card">
          <div class="cons-header-bar">
            <div class="cons-plant-label">
              <i class="ph-bold ph-buildings"></i> Plant: <span id="cons-plant-name">ACETIC ACID</span>
            </div>
            <div class="cons-center-title">Add Parameter</div>
          </div>

          <form id="cons-static-form">
            <!-- Corporate Table system from style.css (class applied: user-table) -->
            <div class="user-table-wrapper">
              <table class="user-table">
                <thead>
                  <tr>
                    <th class="user-table-center w-80px">Sr No</th>
                    <th class="user-table-left">Parameter Name / Metric</th>
                    <th class="user-table-center w-120px">Unit</th>
                    <th class="user-table-center w-150px">Base Level</th>
                    <th class="user-table-center w-150px">Target Budget</th>
                  </tr>
                </thead>
                <tbody>
                  <tr class="user-table-row">
                    <td class="user-table-center font-14pxfw-600">1</td>
                    <td>
                      <input type="text" class="pdr-table-input" name="param_name" placeholder="e.g. Specific Steam Consumption" required>
                    </td>
                    <td class="user-table-center">
                      <input type="text" class="pdr-table-input" name="param_unit" placeholder="e.g. MT/MT" required>
                    </td>
                    <td class="user-table-center">
                      <input type="number" step="any" class="pdr-table-input" name="param_base" placeholder="e.g. 1.25" required>
                    </td>
                    <td class="user-table-center">
                      <input type="number" step="any" class="pdr-table-input" name="param_target" placeholder="e.g. 1.20" required>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="cons-btn-row">
              <button type="submit" class="iso-btn-orange">
                <i class="ph-bold ph-floppy-disk"></i> Save Parameter
              </button>
              <button type="button" class="iso-btn-orange-1" onclick="window.location.href='consumption_register.html'">
                <i class="ph-bold ph-x"></i> Cancel
              </button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </main>

  <script>
    $(function() {
      // 1. Read Plant from URL query parameters
      const urlParams = new URLSearchParams(window.location.search);
      const plant = urlParams.get('plant') || 'ACETIC ACID';
      $('#cons-plant-name').text(plant);

      // 2. Form Submit
      $('#cons-static-form').on('submit', function(e) {
        e.preventDefault();

        Swal.fire({
          title: 'Parameter Configured!',
          text: `Static parameters for Plant: ${plant} have been updated successfully.`,
          icon: 'success',
          confirmButtonColor: '#ea580c',
          confirmButtonText: 'Back to Register'
        }).then(() => {
          window.location.href = 'consumption_register.html';
        });
      });
    });
  </script>
</body>

</html>
