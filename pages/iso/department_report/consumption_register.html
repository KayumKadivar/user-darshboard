<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consumption Register | GNFC E-Logbook</title>

  <!-- CSS Dependencies -->
  <link rel="stylesheet" href="../../../css/phosphor.css">
  <link rel="stylesheet" href="../../../css/theme-vars.css">
  <link rel="stylesheet" href="../../../css/utilities.css">
  <link rel="stylesheet" href="../../../css/common.css">
  <link rel="stylesheet" href="../../../css/modal-ui.css">
  <link rel="stylesheet" href="../../../css/pages/style.css">
  <link rel="stylesheet" href="../iso.css">

  <!-- JS Dependencies -->
  <script src="../../../js/vendor/jquery-3.7.1.min.js"></script>
  <script src="../../../js/vendor/sweetalert2.all.min.js"></script>
  <script src="../../../js/theme-control.js"></script>
  <script src="../../../js/sidebar.js" defer></script>
  <script src="../../../js/header.js" defer></script>

  <script>
    window.activePage = 'iso';
  </script>
</head>

<body class="dashboard-body">

  <!-- Sidebar Container -->
  <div class="sidebar-container"></div>

  <main class="main-wrapper">
    <!-- Header Container -->
    <div id="header-container" data-back="../iso.html"
      data-breadcrumb="ISO Dashboard:../iso.html,Consumption Register:active">
    </div>

    <!-- Page Content Area -->
    <div class="app-content-area flex flex-col justify-between cons-dashboard-wrapper">

      <div>
        <div class="config-block">
          <div class="flex items-center justify-between flex-wrap gap-12px">
            <div class="flex items-center gap-8px">
              <i class="ph-bold ph-list-dashes font-20px header-title-icon"></i>
              <h3 class="header-title-text">CONSUMPTION REGISTER SETUP FLOW</h3>
            </div>
            
            <div class="flex items-center gap-12px">
              <label for="plant-select-cons" class="header-label">SELECT PLANT:</label>
              <select id="plant-select-cons" class="filter-select w-200px header-dropdown">
                <option value="ACETIC ACID" selected>ACETIC ACID</option>
                <option value="AAQM">AAQM</option>
                <option value="AMMONIA">AMMONIA</option>
                <option value="ANIP FILLING">ANIP FILLING</option>
                <option value="ANITDI">ANITDI</option>
                <option value="ASGP">ASGP</option>
                <option value="BAGGING">BAGGING</option>
                <option value="BOILER">BOILER</option>
                <option value="CMS">CMS</option>
                <option value="CPSU">CPSU</option>
                <option value="DM">DM</option>
                <option value="ETHYL ACETATE">ETHYL ACETATE</option>
                <option value="FORMIC ACID">FORMIC ACID</option>
                <option value="METHANOL-1">METHANOL-1</option>
                <option value="METHANOL-2">METHANOL-2</option>
                <option value="MINMAX">MINMAX</option>
                <option value="NITRO PHOSPHATE">NITRO PHOSPHATE</option>
                <option value="SPP">SPP</option>
                <option value="UREA">UREA</option>
              </select>
            </div>
          </div>

          <div class="config-grid">
            <!-- Card 1: Static Fields -->
            <div class="premium-config-card" style="min-height: auto; display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 24px;">
              <div style="display: flex; align-items: center; gap: 16px;">
                <div class="premium-card-icon" style="margin-bottom: 0;">
                  <i class="ph-bold ph-database"></i>
                </div>
                <h4 style="font-size: 15px; font-weight: 700; color: var(--typo-primary); text-transform: uppercase; margin: 0; font-family: 'Outfit', sans-serif;">CONSUMPTION STATIC FIELDS</h4>
              </div>
              <div class="premium-btn-group" style="display: flex; gap: 12px; margin-top: 0; padding-top: 0; border-top: none;">
                <button class="btn-orange-fill" onclick="handleConsumption('Static', 'Add')">
                  <i class="ph-bold ph-plus"></i> Add
                </button>
                <button class="btn-orange-outline" onclick="handleConsumption('Static', 'View', this)">
                  <i class="ph-bold ph-eye"></i> View
                </button>
              </div>
            </div>

            <!-- Card 2: Monthly Status -->
            <div class="premium-config-card" style="min-height: auto; display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 24px;">
              <div style="display: flex; align-items: center; gap: 16px;">
                <div class="premium-card-icon" style="margin-bottom: 0;">
                  <i class="ph-bold ph-calendar-blank"></i>
                </div>
                <h4 style="font-size: 15px; font-weight: 700; color: var(--typo-primary); text-transform: uppercase; margin: 0; font-family: 'Outfit', sans-serif;">CONSUMPTION MONTHLY STATUS</h4>
              </div>
              <div class="premium-btn-group" style="display: flex; gap: 12px; margin-top: 0; padding-top: 0; border-top: none;">
                <button class="btn-orange-fill" onclick="handleConsumption('Monthly', 'Add')">
                  <i class="ph-bold ph-plus"></i> Add
                </button>
                <button class="btn-orange-outline" onclick="handleConsumption('Monthly', 'View', this)">
                  <i class="ph-bold ph-eye"></i> View
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Inline view container for dynamic tables -->
        <div id="cons-inline-view-container" style="display: none; margin-top: 24px;"></div>
      </div>

    </div>
  </main>

  <!-- Add Static Parameters Modal -->
  <div id="add-static-modal" class="gnfc-modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="gnfc-modal-shell gnfc-modal-shell--medium">
      <div class="gnfc-modal-header">
        <div>
          <h3 class="gnfc-modal-title">Configure Static Parameters</h3>
          <p class="gnfc-modal-subtitle">Plant: <span id="modal-plant-name">ACETIC ACID</span></p>
        </div>
        <button type="button" onclick="setModalState('add-static-modal', false)" class="gnfc-modal-close">
          <i class="ph-bold ph-x"></i>
        </button>
      </div>
      <form id="static-parameter-form">
        <div class="gnfc-modal-body">
          <div style="margin-bottom: 20px;">
            <label class="gnfc-modal-label" for="param-objective">Objective *</label>
            <input type="text" id="param-objective" class="gnfc-modal-input" placeholder="e.g. Specific Steam Consumption" required>
          </div>
          
          <div class="form-flex-wrapper flex-cols-3">
            <div>
              <label class="gnfc-modal-label" for="param-base-level">Base Level *</label>
              <input type="number" step="any" id="param-base-level" class="gnfc-modal-input" placeholder="e.g. 1.25" required>
            </div>
            <div>
              <label class="gnfc-modal-label" for="param-target-value">Target Value *</label>
              <input type="number" step="any" id="param-target-value" class="gnfc-modal-input" placeholder="e.g. 1.20" required>
            </div>
            <div>
              <label class="gnfc-modal-label" for="param-unit">Unit *</label>
              <input type="text" id="param-unit" class="gnfc-modal-input" placeholder="e.g. MT/MT" required>
            </div>
          </div>
        </div>
        <div class="gnfc-modal-footer">
          <button type="submit" class="gnfc-modal-btn gnfc-modal-btn-primary">
            Save
          </button>
          <button type="button" onclick="setModalState('add-static-modal', false)" class="gnfc-modal-btn gnfc-modal-btn-secondary">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Monthly Status Modal -->
  <div id="add-monthly-modal" class="gnfc-modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="gnfc-modal-shell gnfc-modal-shell--narrow">
      <div class="gnfc-modal-header">
        <div>
          <h3 class="gnfc-modal-title">ADD MONTHLY VALUE</h3>
          <p class="gnfc-modal-subtitle">Plant: <span id="modal-monthly-plant-name">ACETIC ACID</span></p>
        </div>
        <button type="button" onclick="setModalState('add-monthly-modal', false)" class="gnfc-modal-close">
          <i class="ph-bold ph-x"></i>
        </button>
      </div>
      <form id="monthly-parameter-form">
        <div class="gnfc-modal-body">
          <div style="display: flex; flex-direction: column; gap: 16px; text-align: left;">
            <div>
              <label class="gnfc-modal-label" for="monthly-param-item">SELECT ITEM *</label>
              <select id="monthly-param-item" class="gnfc-modal-input">
                <!-- Will be populated dynamically -->
              </select>
            </div>
            <div>
              <label class="gnfc-modal-label" for="monthly-param-issued">ISSUED *</label>
              <input type="number" step="any" id="monthly-param-issued" class="gnfc-modal-input" placeholder="e.g. 150" required>
            </div>
            <div>
              <label class="gnfc-modal-label" for="monthly-param-consumed">CONSUMED *</label>
              <input type="number" step="any" id="monthly-param-consumed" class="gnfc-modal-input" placeholder="e.g. 120" required>
            </div>
          </div>
        </div>
        <div class="gnfc-modal-footer">
          <button type="submit" class="gnfc-modal-btn gnfc-modal-btn-primary">
            Save
          </button>
          <button type="button" onclick="setModalState('add-monthly-modal', false)" class="gnfc-modal-btn gnfc-modal-btn-secondary">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 1. Static flat databases that do not change dynamically per plant, behaving statically as per instructions
    let staticData = [
      { sr: '1', name: 'Action 99', base: '380', target: '368', unit: 'ltr' },
      { sr: '2', name: 'Canvas H/G', base: '470', target: '456', unit: 'Pairs' },
      { sr: '3', name: 'Cotton Waste', base: '390', target: '378', unit: 'Kgs' },
      { sr: '4', name: 'Maderpat', base: '495', target: '480', unit: 'meter' },
      { sr: '5', name: 'PVC Sheet', base: '350', target: '339', unit: 'Kgs' }
    ];

    let monthlyData = [
      { sr: '1', name: 'Action 99', base: '380', target: '368', unit: 'ltr', issued: 15, consumed: 12, balance: 3 },
      { sr: '2', name: 'Canvas H/G', base: '470', target: '456', unit: 'Pairs', issued: 50, consumed: 40, balance: 10 },
      { sr: '3', name: 'Cotton Waste', base: '390', target: '378', unit: 'Kgs', issued: 30, consumed: 25, balance: 5 },
      { sr: '4', name: 'Maderpat', base: '495', target: '480', unit: 'meter', issued: 20, consumed: 18, balance: 2 },
      { sr: '5', name: 'PVC Sheet', base: '350', target: '339', unit: 'Kgs', issued: 10, consumed: 8, balance: 2 }
    ];

    function setModalState(modalId, isOpen) {
      const $modal = $('#' + modalId);
      if (isOpen) {
        $modal.addClass('is-open').attr('aria-hidden', 'false');
      } else {
        $modal.removeClass('is-open').attr('aria-hidden', 'true');
      }
    }

    let currentActiveType = null;
    let currentInlineYear = '2026';

    function renderStaticTable() {
      const plant = $('#plant-select-cons').val();

      let html = `
        <div class="pdr-view-card">
          <div class="pdr-table-title-bar">
            <div class="pdr-plant-label">
              <i class="ph-bold ph-buildings"></i> Plant: <span id="cons-inline-plant-name">${plant}</span>
            </div>
            <div class="pdr-static-title">Static Parameters</div>
          </div>        

          <div class="user-table-wrapper" style="margin: 0; overflow-x: auto;">
            <table class="user-table" style="width: 100%; border-collapse: collapse;">
              <thead>
                <tr>
                  <th class="user-table-center w-80px">Sr No</th>
                  <th class="user-table-left" style="text-align: left; padding-left: 16px;">Objective</th>
                  <th class="user-table-center w-150px">Base Level</th>
                  <th class="user-table-center w-150px">Target Value</th>
                  <th class="user-table-center w-120px">Unit</th>
                  <th class="user-table-center w-100px">Action</th>
                </tr>
              </thead>
              <tbody>
      `;

      staticData.forEach(row => {
        html += `
          <tr class="user-table-row">
            <td class="user-table-center font-14px fw-600">${row.sr}</td>
            <td class="text-left font-14px fw-600" style="text-align: left; padding-left: 16px;">${row.name}</td>
            <td class="user-table-center font-14px">${row.base}</td>
            <td class="user-table-center font-14px">${row.target}</td>
            <td class="user-table-center font-14px">${row.unit}</td>
            <td class="user-table-center">
              <a href="#" class="edit-action-link edit-inline-static-btn" onclick="editSingleStaticRecord('${row.sr}'); return false;">
                <i class="ph-bold ph-pencil-simple"></i> Edit
              </a>
            </td>
          </tr>
        `;
      });

      html += `
              </tbody>
            </table>
          </div>
        </div>
      `;

      $('#cons-inline-view-container').html(html);
    }

    window.editSingleStaticRecord = function(sr) {
      const record = staticData.find(r => r.sr === sr);
      if (!record) return;

      const plant = $('#plant-select-cons').val();
      $('#modal-plant-name').text(plant);
      
      // Populate fields
      $('#param-objective').val(record.name);
      $('#param-base-level').val(record.base);
      $('#param-target-value').val(record.target);
      $('#param-unit').val(record.unit);
      
      // Set mode
      $('#static-parameter-form').attr('data-mode', 'edit');
      $('#static-parameter-form').attr('data-sr', sr);
      
      setModalState('add-static-modal', true);
    };

    function renderMonthlyTable(selectedYear = currentInlineYear) {
      currentInlineYear = selectedYear;
      const plant = $('#plant-select-cons').val();

      let html = `
        <div class="pdr-view-card">
          <div class="pdr-monthly-header-bar">
            <div class="pdr-plant-label">
              <i class="ph-bold ph-buildings"></i> Plant: <span id="cons-inline-plant-name">${plant}</span>
            </div>
            <div class="pdr-center-title">Monthly Status</div>
            
            <div class="pdr-inline-year-wrap">
              <label class="filter-label">Active Year:</label>
              <select id="cons-inline-year-select" class="filter-select pdr-header-select" onchange="renderMonthlyTable(this.value)">
                <option value="2026" ${selectedYear === '2026' ? 'selected' : ''}>2026</option>
                <option value="2025" ${selectedYear === '2025' ? 'selected' : ''}>2025</option>
                <option value="2024" ${selectedYear === '2024' ? 'selected' : ''}>2024</option>
              </select>
              <div class="pdr-date-label">May</div>
            </div>
          </div>

          <div class="user-table-wrapper" style="margin: 0; overflow-x: auto;">
            <table class="user-table" style="width: 100%; border-collapse: collapse;">
              <thead>
                <tr>
                  <th style="width: 50px;">Sr</th>
                  <th style="text-align: left; padding-left: 16px; min-width: 160px;">Item Description</th>
                  <th style="width: 100px;">Base Level</th>
                  <th style="width: 110px;">Target Value</th>
                  <th style="width: 80px;">Unit</th>
                  <th style="width: 80px;">Issued</th>
                  <th style="width: 80px;">Consumed</th>
                  <th style="width: 80px;">Balance</th>
                  <th style="width: 100px;">Action</th>
                </tr>
              </thead>
              <tbody>
      `;

      monthlyData.forEach(row => {
        html += `
          <tr class="user-table-row">
            <td>${row.sr}</td>
            <td class="text-left" style="text-align: left; padding-left: 16px;">${row.name}</td>
            <td>${row.base}</td>
            <td>${row.target}</td>
            <td>${row.unit}</td>
            <td>${row.issued}</td>
            <td>${row.consumed}</td>
            <td>${row.balance}</td>
            <td class="user-table-center">
              <a href="#" class="edit-action-link edit-inline-monthly-btn" onclick="editSingleMonthlyRecord('${row.sr}'); return false;">
                <i class="ph-bold ph-pencil-simple"></i> Edit
              </a>
            </td>
          </tr>
        `;
      });

      html += `
              </tbody>
            </table>
          </div>
        </div>
      `;

      $('#cons-inline-view-container').html(html);
    }

    window.editSingleMonthlyRecord = function(sr) {
      const record = monthlyData.find(r => r.sr === sr);
      if (!record) return;

      const plant = $('#plant-select-cons').val();
      $('#modal-monthly-plant-name').text(plant);
      
      populateMonthlyItemDropdown();
      $('#monthly-param-item').val(sr);
      $('#monthly-param-issued').val(record.issued);
      $('#monthly-param-consumed').val(record.consumed);
      
      // Set mode
      $('#monthly-parameter-form').attr('data-mode', 'edit');
      $('#monthly-parameter-form').attr('data-sr', sr);
      
      setModalState('add-monthly-modal', true);
    };

    function populateMonthlyItemDropdown() {
      const $dropdown = $('#monthly-param-item');
      $dropdown.empty();
      staticData.forEach(item => {
        $dropdown.append(`<option value="${item.sr}">${item.name}</option>`);
      });
    }

    function toggleInlineView(type, btnEl) {
      const $btn = $(btnEl);
      const $container = $('#cons-inline-view-container');
      
      if (currentActiveType === type) {
        $btn.removeClass('active-view-btn');
        $container.slideUp(300, function() {
          $container.empty();
        });
        currentActiveType = null;
        return;
      }
      
      $('.btn-orange-outline').removeClass('active-view-btn');
      $btn.addClass('active-view-btn');
      
      if (type === 'Static') {
        renderStaticTable();
      } else if (type === 'Monthly') {
        renderMonthlyTable();
      }
      
      if (currentActiveType === null) {
        $container.hide().slideDown(300);
      }
      currentActiveType = type;
    }

    function handleConsumption(section, action, btnEl) {
      const plant = $('#plant-select-cons').val();
      
      if (section === 'Static' && action === 'Add') {
        $('#modal-plant-name').text(plant);
        $('#static-parameter-form').attr('data-mode', 'add');
        $('#static-parameter-form')[0].reset();
        setModalState('add-static-modal', true);
      } else if (section === 'Static' && action === 'View') {
        toggleInlineView('Static', btnEl);
      } else if (section === 'Monthly' && action === 'Add') {
        $('#modal-monthly-plant-name').text(plant);
        populateMonthlyItemDropdown();
        $('#monthly-parameter-form').attr('data-mode', 'add');
        $('#monthly-parameter-form')[0].reset();
        setModalState('add-monthly-modal', true);
      } else if (section === 'Monthly' && action === 'View') {
        toggleInlineView('Monthly', btnEl);
      }
    }

    $(function() {
      // Auto-refresh active inline view when plant changes
      $('#plant-select-cons').on('change', function() {
        if (currentActiveType === 'Static') {
          renderStaticTable();
        } else if (currentActiveType === 'Monthly') {
          renderMonthlyTable();
        }
      });

      // Close modal on overlay click
      $('.gnfc-modal-overlay').on('click', function(e) {
        if (e.target === this) {
          setModalState($(this).attr('id'), false);
        }
      });

      // Handle Static form submission
      $('#static-parameter-form').on('submit', function(e) {
        e.preventDefault();
        const plant = $('#plant-select-cons').val();
        const name = $('#param-objective').val().trim();
        const base = $('#param-base-level').val().trim();
        const target = $('#param-target-value').val().trim();
        const unit = $('#param-unit').val().trim();
        
        const mode = $(this).attr('data-mode');
        if (mode === 'edit') {
          const sr = $(this).attr('data-sr');
          const record = staticData.find(r => r.sr === sr);
          if (record) {
            record.name = name;
            record.base = base;
            record.target = target;
            record.unit = unit;
          }
          if (currentActiveType === 'Static') {
            renderStaticTable();
          }
          setModalState('add-static-modal', false);
          Swal.fire({
            title: 'Updated!',
            text: 'Static Parameter updated successfully.',
            icon: 'success',
            timer: 1500,
            showConfirmButton: false
          });
        } else {
          const newSr = staticData.length ? String(Math.max(...staticData.map(r => parseInt(r.sr))) + 1) : '1';
          staticData.push({ sr: newSr, name: name, base: base, target: target, unit: unit });
          
          // Also sync with monthlyData so they match!
          monthlyData.push({ sr: newSr, name: name, base: base, target: target, unit: unit, issued: 0, consumed: 0, balance: 0 });
          
          if (currentActiveType === 'Static') {
            renderStaticTable();
          }
          setModalState('add-static-modal', false);
          Swal.fire({
            title: 'Saved!',
            text: `Static Parameter saved successfully for Plant: ${plant}.`,
            icon: 'success',
            timer: 1500,
            showConfirmButton: false
          });
        }
      });

      // Handle Monthly form submission
      $('#monthly-parameter-form').on('submit', function(e) {
        e.preventDefault();
        const plant = $('#plant-select-cons').val();
        const sr = $('#monthly-param-item').val();
        const issued = parseFloat($('#monthly-param-issued').val()) || 0;
        const consumed = parseFloat($('#monthly-param-consumed').val()) || 0;
        const balance = issued - consumed;
        
        const mode = $(this).attr('data-mode');
        if (mode === 'edit') {
          const editSr = $(this).attr('data-sr');
          const record = monthlyData.find(r => r.sr === editSr);
          if (record) {
            record.issued = issued;
            record.consumed = consumed;
            record.balance = balance;
          }
          if (currentActiveType === 'Monthly') {
            renderMonthlyTable();
          }
          setModalState('add-monthly-modal', false);
          Swal.fire({
            title: 'Updated!',
            text: 'Monthly values updated successfully.',
            icon: 'success',
            timer: 1500,
            showConfirmButton: false
          });
        } else {
          // Add mode
          const record = monthlyData.find(r => r.sr === sr);
          if (record) {
            record.issued = issued;
            record.consumed = consumed;
            record.balance = balance;
          }
          if (currentActiveType === 'Monthly') {
            renderMonthlyTable();
          }
          setModalState('add-monthly-modal', false);
          Swal.fire({
            title: 'Saved!',
            text: `Monthly values recorded successfully for Plant: ${plant}.`,
            icon: 'success',
            timer: 1500,
            showConfirmButton: false
          });
        }
      });
    });
  </script>
</body>

</html>
