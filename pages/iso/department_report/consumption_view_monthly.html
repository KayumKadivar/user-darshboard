<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Consumption Status | GNFC E-Logbook</title>

  <!-- CSS Dependencies -->
  <link rel="stylesheet" href="../../../css/phosphor.css">
  <link rel="stylesheet" href="../../../css/theme-vars.css">
  <link rel="stylesheet" href="../../../css/utilities.css">
  <link rel="stylesheet" href="../../../css/common.css">
  <link rel="stylesheet" href="../../../css/modal-ui.css">
  <link rel="stylesheet" href="../../../css/pages/style.css">
  <link rel="stylesheet" href="../iso.css">

  <!-- JS Dependencies -->
  <script src="../../../js/vendor/jquery-3.7.1.min.js"></script>
  <script src="../../../js/vendor/sweetalert2.all.min.js"></script>
  <script src="../../../js/theme-control.js"></script>
  <script src="../../../js/sidebar.js" defer></script>
  <script src="../../../js/header.js" defer></script>

  <script>
    window.activePage = 'iso';
  </script>

  <style>
    .cons-view-content {
      min-height: calc(100vh - 120px);
    }

    .cons-view-card {
      background: var(--app-panel, #ffffff);
      border: 1px solid var(--app-border, #cbd5e1);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
      margin-top: 24px;
    }

    .cons-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--app-border, #cbd5e1);
      padding-bottom: 14px;
    }

    .cons-plant-label {
      color: var(--typo-orange, #ea580c) !important;
      font-family: 'Outfit', sans-serif;
      font-weight: 850;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cons-center-title {
      color: var(--typo-primary) !important;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .mini-nav-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mini-nav-btn {
      width: 28px;
      height: 28px;
      background-color: var(--typo-orange, #ea580c);
      color: #ffffff;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 4px rgba(234, 88, 12, 0.15);
    }

    .mini-nav-btn:hover {
      background-color: #f97316;
      transform: scale(1.08);
    }

    /* Buttons */
    .btn-orange-fill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--typo-orange, #ea580c);
      color: #ffffff !important;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(234, 88, 12, 0.15);
    }

    .btn-orange-fill:hover {
      background: #f97316;
      transform: translateY(-1px);
    }

    /* Table styles overrides to match standard grey-blue header style */
    .user-table th {
      border: 1px solid var(--app-border, #cbd5e1) !important;
      background: var(--app-panel-alt, #edf2f8) !important;
      color: var(--typo-primary, #1e293b) !important;
      font-weight: 700 !important;
      font-size: 11.5px !important;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 12px 6px !important;
      text-align: center;
      white-space: nowrap;
      font-family: 'Outfit', sans-serif;
    }

    .user-table td {
      border: 1px solid var(--app-border, #cbd5e1) !important;
      vertical-align: middle !important;
      font-size: 12.5px !important;
      color: #334155;
      padding: 12px 6px !important;
      text-align: center;
      font-family: 'Outfit', sans-serif;
    }

    .user-table td.text-left {
      text-align: left;
      font-weight: 600;
      color: var(--typo-orange, #ea580c);
    }

    .user-table tbody tr:hover {
      background-color: #f8fafc;
    }
  </style>
</head>

<body class="dashboard-body">

  <!-- Sidebar Container -->
  <div class="sidebar-container"></div>

  <main class="main-wrapper">
    <!-- Header Container -->
    <div id="header-container" data-back="consumption_register.html"
      data-breadcrumb="ISO Dashboard:../iso.html,Consumption Register:consumption_register.html,Monthly Status:active">
    </div>

    <!-- Page Content Area -->
    <div class="app-content-area flex flex-col justify-between cons-view-content">

      <div>
        <!-- Action Bar -->
        <div class="action-bar-panel calib-action-bar" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 24px;">
          <div class="calib-action-left" style="flex: 1; min-width: 250px;">
            <div class="calib-action-icon-box" style="background: rgba(234, 88, 12, 0.1); color: var(--typo-orange);">
              <i class="ph-fill ph-calendar-check"></i>
            </div>
            <div>
              <div class="calib-action-title-group">
                <h2 class="calib-action-title">Monthly Consumption Status</h2>
                <span class="calib-action-badge" style="background: rgba(234, 88, 12, 0.1); color: var(--typo-orange);">Year: <span id="cons-active-year">2025 - 2026</span></span>
              </div>
              <p class="calib-action-subtitle">Log, track and export monthly parameter consumption records</p>
            </div>
          </div>
          
          <div style="display: flex; align-items: center; gap: 24px;">
            <!-- Timeline navigation -->
            <div class="mini-nav-row">
              <span style="font-size: 11px; font-weight: 700; color: var(--typo-orange); text-transform: uppercase; margin-right: 8px; letter-spacing: 0.05em; font-family: 'Outfit', sans-serif;">Timeline:</span>
              <button class="mini-nav-btn" onclick="changeTimeline('prev')"><i class="ph-bold ph-caret-left"></i></button>
              <button class="mini-nav-btn" onclick="changeTimeline('reset')"><i class="ph-bold ph-circle"></i></button>
              <button class="mini-nav-btn" onclick="changeTimeline('next')"><i class="ph-bold ph-caret-right"></i></button>
            </div>

            <button class="btn-orange-fill" onclick="editMonthlyData()">
              <i class="ph-bold ph-pencil-simple"></i> Edit Data
            </button>
          </div>
        </div>

        <!-- Modern Card Wrapper -->
        <div class="cons-view-card">
          <div class="cons-header-bar" style="display: flex; justify-content: space-between; align-items: center;">
            <div class="cons-plant-label">
              <i class="ph-bold ph-buildings"></i> Plant: <span id="cons-plant-name">ACETIC ACID</span>
            </div>
            <div style="font-family: 'Outfit', sans-serif; font-weight: 850; font-size: 16px; color: var(--typo-orange, #ea580c);">
              May 2026
            </div>
          </div>

          <div class="user-table-wrapper" style="margin: 0; overflow-x: auto;">
            <table class="user-table" style="width: 100%; border-collapse: collapse;">
              <thead>
                <tr>
                  <th style="width: 50px;">Sr</th>
                  <th style="text-align: left; min-width: 160px;">Item Description</th>
                  <th style="width: 100px;">Base Level</th>
                  <th style="width: 110px;">Target Value</th>
                  <th style="width: 80px;">Unit</th>
                  <th style="width: 80px;">Issued</th>
                  <th style="width: 80px;">Consumed</th>
                  <th style="width: 80px;">Balance</th>
                </tr>
              </thead>
              <tbody id="cons-monthly-tbody">
                <!-- Dynamically populated -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    $(function() {
      // 1. Read Plant from URL query parameters
      const urlParams = new URLSearchParams(window.location.search);
      const plant = urlParams.get('plant') || 'ACETIC ACID';
      $('#cons-plant-name').text(plant);

      // 2. Timeline data arrays
      const years = ["2024 - 2025", "2025 - 2026", "2026 - 2027"];
      let activeIndex = 1;

      window.changeTimeline = function(direction) {
        if (direction === 'prev') {
          if (activeIndex > 0) activeIndex--;
        } else if (direction === 'next') {
          if (activeIndex < years.length - 1) activeIndex++;
        } else if (direction === 'reset') {
          activeIndex = 1;
        }
        $('#cons-active-year').text(years[activeIndex]);

        Swal.fire({
          icon: 'success',
          title: `Timeline Changed`,
          text: `Displaying records for Year ${years[activeIndex]}`,
          timer: 1200,
          showConfirmButton: false,
          toast: true,
          position: 'top-end'
        });
      };

      // 3. Mock Data
      const mockDatabase = {
        'ACETIC ACID': [
          { sr: 1, name: 'Action 99', base: '380', target: '368', unit: 'ltr', issued: 0, consumed: 0, balance: 0 },
          { sr: 2, name: 'Canvas H/G', base: '470', target: '456', unit: 'Pairs', issued: 0, consumed: 0, balance: 0 },
          { sr: 3, name: 'Cotton Waste', base: '390', target: '378', unit: 'Kgs', issued: 0, consumed: 0, balance: 0 },
          { sr: 4, name: 'Maderpat', base: '495', target: '480', unit: 'meter', issued: 0, consumed: 0, balance: 0 },
          { sr: 5, name: 'PVC Sheet', base: '350', target: '339', unit: 'Kgs', issued: 0, consumed: 0, balance: 0 }
        ],
        'BOILER': [
          { sr: 1, name: 'Action 99', base: '380', target: '368', unit: 'ltr', issued: 0, consumed: 0, balance: 0 },
          { sr: 2, name: 'Canvas H/G', base: '470', target: '456', unit: 'Pairs', issued: 0, consumed: 0, balance: 0 },
          { sr: 3, name: 'Cotton Waste', base: '390', target: '378', unit: 'Kgs', issued: 0, consumed: 0, balance: 0 },
          { sr: 4, name: 'Maderpat', base: '495', target: '480', unit: 'meter', issued: 0, consumed: 0, balance: 0 },
          { sr: 5, name: 'PVC Sheet', base: '350', target: '339', unit: 'Kgs', issued: 0, consumed: 0, balance: 0 }
        ],
        'CPP': [
          { sr: 1, name: 'Action 99', base: '380', target: '368', unit: 'ltr', issued: 0, consumed: 0, balance: 0 },
          { sr: 2, name: 'Canvas H/G', base: '470', target: '456', unit: 'Pairs', issued: 0, consumed: 0, balance: 0 },
          { sr: 3, name: 'Cotton Waste', base: '390', target: '378', unit: 'Kgs', issued: 0, consumed: 0, balance: 0 },
          { sr: 4, name: 'Maderpat', base: '495', target: '480', unit: 'meter', issued: 0, consumed: 0, balance: 0 },
          { sr: 5, name: 'PVC Sheet', base: '350', target: '339', unit: 'Kgs', issued: 0, consumed: 0, balance: 0 }
        ]
      };

      const defaultData = [
        { sr: 1, name: 'Action 99', base: '380', target: '368', unit: 'ltr', issued: 0, consumed: 0, balance: 0 },
        { sr: 2, name: 'Canvas H/G', base: '470', target: '456', unit: 'Pairs', issued: 0, consumed: 0, balance: 0 },
        { sr: 3, name: 'Cotton Waste', base: '390', target: '378', unit: 'Kgs', issued: 0, consumed: 0, balance: 0 },
        { sr: 4, name: 'Maderpat', base: '495', target: '480', unit: 'meter', issued: 0, consumed: 0, balance: 0 },
        { sr: 5, name: 'PVC Sheet', base: '350', target: '339', unit: 'Kgs', issued: 0, consumed: 0, balance: 0 }
      ];

      const records = mockDatabase[plant] || defaultData;
      const $tbody = $('#cons-monthly-tbody');

      function renderTable() {
        $tbody.empty();
        records.forEach(row => {
          $tbody.append(`
            <tr class="user-table-row">
              <td>${row.sr}</td>
              <td class="text-left">${row.name}</td>
              <td>${row.base}</td>
              <td>${row.target}</td>
              <td>${row.unit}</td>
              <td>${row.issued}</td>
              <td>${row.consumed}</td>
              <td>${row.balance}</td>
            </tr>
          `);
        });
      }

      renderTable();

      window.editMonthlyData = function() {
        Swal.fire({
          title: 'Edit Consumption Values',
          html: `
            <div style="text-align: left; font-family: 'Outfit', sans-serif;">
              <label style="display: block; margin-bottom: 6px; font-weight: 700; font-size: 13px;">Select Item</label>
              <select id="swal-item" class="swal2-input" style="margin: 0 0 16px 0; width: 100%; box-sizing: border-box; height: 38px; font-size: 14px;">
                ${records.map(r => `<option value="${r.sr}">${r.name}</option>`).join('')}
              </select>
              <label style="display: block; margin-bottom: 6px; font-weight: 700; font-size: 13px;">Issued</label>
              <input type="number" id="swal-issued" class="swal2-input" style="margin: 0 0 16px 0; width: 100%; box-sizing: border-box; height: 38px; font-size: 14px;" value="0">
              <label style="display: block; margin-bottom: 6px; font-weight: 700; font-size: 13px;">Consumed</label>
              <input type="number" id="swal-consumed" class="swal2-input" style="margin: 0; width: 100%; box-sizing: border-box; height: 38px; font-size: 14px;" value="0">
            </div>
          `,
          focusConfirm: false,
          showCancelButton: true,
          confirmButtonColor: '#ea580c',
          preConfirm: () => {
            return {
              sr: parseInt(document.getElementById('swal-item').value),
              issued: parseFloat(document.getElementById('swal-issued').value) || 0,
              consumed: parseFloat(document.getElementById('swal-consumed').value) || 0
            }
          }
        }).then((result) => {
          if (result.isConfirmed) {
            const data = result.value;
            const item = records.find(r => r.sr === data.sr);
            if (item) {
              item.issued = data.issued;
              item.consumed = data.consumed;
              item.balance = data.issued - data.consumed;
              renderTable();
            }

            Swal.fire({
              title: 'Saved!',
              text: 'Consumption values updated successfully.',
              icon: 'success',
              timer: 1200,
              showConfirmButton: false
            });
          }
        });
      };
    });
  </script>
</body>

</html>
