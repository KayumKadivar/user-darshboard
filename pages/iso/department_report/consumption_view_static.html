<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Consumption Parameters | GNFC E-Logbook</title>

  <!-- CSS Dependencies -->
  <link rel="stylesheet" href="../../../css/phosphor.css">
  <link rel="stylesheet" href="../../../css/theme-vars.css">
  <link rel="stylesheet" href="../../../css/utilities.css">
  <link rel="stylesheet" href="../../../css/common.css">
  <link rel="stylesheet" href="../../../css/modal-ui.css">
  <link rel="stylesheet" href="../../../css/pages/style.css">
  <link rel="stylesheet" href="../iso.css">

  <!-- JS Dependencies -->
  <script src="../../../js/vendor/jquery-3.7.1.min.js"></script>
  <script src="../../../js/vendor/sweetalert2.all.min.js"></script>
  <script src="../../../js/theme-control.js"></script>
  <script src="../../../js/sidebar.js" defer></script>
  <script src="../../../js/header.js" defer></script>

  <script>
    window.activePage = 'iso';
  </script>

  <style>
    .cons-view-card {
      background: var(--app-panel, #ffffff);
      border: 1px solid var(--app-border, #cbd5e1);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
    }

    .cons-table-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 2px solid var(--app-border);
      padding-bottom: 14px;
    }
    
    .cons-plant-label {
      color: var(--typo-orange) !important;
      font-weight: 850;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Outfit', sans-serif;
    }
    
    .cons-static-title {
      color: var(--typo-secondary) !important;
      font-weight: 750;
      font-size: 12px;
      letter-spacing: 0.05em;
      background: var(--app-bg);
      padding: 4px 12px;
      border-radius: 6px;
      border: 1px solid var(--app-border);
      font-family: 'Outfit', sans-serif;
      text-transform: uppercase;
    }

    .edit-action-link {
      color: var(--typo-orange, #ea580c) !important;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.05em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      text-transform: uppercase;
    }

    .edit-action-link:hover {
      color: #f97316 !important;
      transform: scale(1.05);
    }
  </style>
</head>

<body class="dashboard-body">

  <!-- Sidebar Container -->
  <div class="sidebar-container"></div>

  <main class="main-wrapper">
    <!-- Header Container -->
    <div id="header-container" data-back="consumption_register.html"
      data-breadcrumb="ISO Dashboard:../iso.html,Consumption Register:consumption_register.html,View Parameters:active">
    </div>

    <!-- Page Content Area -->
    <div class="iso-app-content">
      <!-- Modern Card Wrapper -->
      <div class="cons-view-card">
        <div class="cons-table-title-bar">
          <div class="cons-plant-label">
            <i class="ph-bold ph-buildings"></i> Plant: <span id="cons-plant-name">ACETIC ACID</span>
          </div>
          <div class="cons-static-title">Static Parameters</div>
        </div>        

        <div class="user-table-wrapper">
          <table class="user-table">
            <thead>
              <tr>
                <th class="user-table-center w-80px">Sr</th>
                <th class="user-table-left">Objective</th>
                <th class="user-table-center w-150px">Base Level</th>
                <th class="user-table-center w-150px">Target Value</th>
                <th class="user-table-center w-120px">Unit</th>
              </tr>
            </thead>
            <tbody id="cons-static-table-body">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Modal Overlay -->
    <div class="gnfc-modal-overlay" id="cons-static-modal">
      <!-- Modal Shell -->
      <div class="gnfc-modal-shell gnfc-modal-shell--narrow">
        
        <!-- Modal Header -->
        <div class="gnfc-modal-header">
          <div>
            <h3 class="gnfc-modal-title">Edit Parameter</h3>
            <p class="gnfc-modal-subtitle" style="font-size: 11px; margin-top: 4px; color: var(--typo-orange);">Plant: <span id="cons-modal-plant-name">ACETIC ACID</span></p>
          </div>
          <button class="gnfc-modal-close" id="btn-close-modal" type="button">
            <i class="ph ph-x" style="font-size: 18px;"></i>
          </button>
        </div>

        <!-- Modal Body -->
        <div class="gnfc-modal-body">
          <form id="cons-static-form">
            <input type="hidden" id="cons-edit-sr" value="">
            
            <div style="display: flex; flex-direction: column; margin-bottom: 16px; text-align: left;">
              <label class="gnfc-modal-label" for="cons-param-name">Parameter Name</label>
              <input type="text" id="cons-param-name" class="gnfc-modal-input" placeholder="e.g. Specific Steam Consumption" required>
            </div>

            <div style="display: flex; flex-direction: column; margin-bottom: 16px; text-align: left;">
              <label class="gnfc-modal-label" for="cons-param-unit">Unit</label>
              <input type="text" id="cons-param-unit" class="gnfc-modal-input" placeholder="e.g. MT/MT" required>
            </div>

            <div style="display: flex; flex-direction: column; margin-bottom: 16px; text-align: left;">
              <label class="gnfc-modal-label" for="cons-param-base">Base Level</label>
              <input type="number" step="any" id="cons-param-base" class="gnfc-modal-input" placeholder="e.g. 1.25" required>
            </div>

            <div style="display: flex; flex-direction: column; margin-bottom: 16px; text-align: left;">
              <label class="gnfc-modal-label" for="cons-param-target">Target Budget</label>
              <input type="number" step="any" id="cons-param-target" class="gnfc-modal-input" placeholder="e.g. 1.20" required>
            </div>
          </form>
        </div>

        <!-- Modal Footer -->
        <div class="gnfc-modal-footer">
          <button type="button" class="gnfc-modal-btn gnfc-modal-btn-secondary" id="btn-cancel-modal">Cancel</button>
          <button type="submit" form="cons-static-form" class="gnfc-modal-btn gnfc-modal-btn-primary">Save</button>
        </div>

      </div>
    </div>
  </main>

  <script>
    $(function() {
      // 1. Read Plant from URL query parameters
      const urlParams = new URLSearchParams(window.location.search);
      const plant = urlParams.get('plant') || 'ACETIC ACID';
      $('#cons-plant-name').text(plant);
      $('#cons-modal-plant-name').text(plant);

      // 2. Mock records matching plant
      const mockDatabase = {
        'ACETIC ACID': [
          { sr: '1', name: 'Action 99', base: '380', target: '368', unit: 'ltr' },
          { sr: '2', name: 'Canvas H/G', base: '470', target: '456', unit: 'Pairs' },
          { sr: '3', name: 'Cotton Waste', base: '390', target: '378', unit: 'Kgs' },
          { sr: '4', name: 'Maderpat', base: '495', target: '480', unit: 'meter' },
          { sr: '5', name: 'PVC Sheet', base: '350', target: '339', unit: 'Kgs' }
        ],
        'BOILER': [
          { sr: '1', name: 'Action 99', base: '380', target: '368', unit: 'ltr' },
          { sr: '2', name: 'Canvas H/G', base: '470', target: '456', unit: 'Pairs' },
          { sr: '3', name: 'Cotton Waste', base: '390', target: '378', unit: 'Kgs' },
          { sr: '4', name: 'Maderpat', base: '495', target: '480', unit: 'meter' },
          { sr: '5', name: 'PVC Sheet', base: '350', target: '339', unit: 'Kgs' }
        ],
        'CPP': [
          { sr: '1', name: 'Action 99', base: '380', target: '368', unit: 'ltr' },
          { sr: '2', name: 'Canvas H/G', base: '470', target: '456', unit: 'Pairs' },
          { sr: '3', name: 'Cotton Waste', base: '390', target: '378', unit: 'Kgs' },
          { sr: '4', name: 'Maderpat', base: '495', target: '480', unit: 'meter' },
          { sr: '5', name: 'PVC Sheet', base: '350', target: '339', unit: 'Kgs' }
        ],
        'AMMONIA': [
          { sr: '1', name: 'Action 99', base: '380', target: '368', unit: 'ltr' },
          { sr: '2', name: 'Canvas H/G', base: '470', target: '456', unit: 'Pairs' },
          { sr: '3', name: 'Cotton Waste', base: '390', target: '378', unit: 'Kgs' },
          { sr: '4', name: 'Maderpat', base: '495', target: '480', unit: 'meter' },
          { sr: '5', name: 'PVC Sheet', base: '350', target: '339', unit: 'Kgs' }
        ]
      };

      const defaultRecords = [
        { sr: '1', name: 'Action 99', base: '380', target: '368', unit: 'ltr' },
        { sr: '2', name: 'Canvas H/G', base: '470', target: '456', unit: 'Pairs' },
        { sr: '3', name: 'Cotton Waste', base: '390', target: '378', unit: 'Kgs' },
        { sr: '4', name: 'Maderpat', base: '495', target: '480', unit: 'meter' },
        { sr: '5', name: 'PVC Sheet', base: '350', target: '339', unit: 'Kgs' }
      ];

      const records = mockDatabase[plant] || defaultRecords;
      const $tbody = $('#cons-static-table-body');
      $tbody.empty();

      function renderTable() {
        $tbody.empty();
        records.forEach(row => {
          $tbody.append(`
            <tr class="user-table-row">
              <td class="user-table-center font-14pxfw-600">${row.sr}</td>
              <td class="text-left font-14pxfw-600">${row.name}</td>
              <td class="user-table-center ">${row.base}</td>
              <td class="user-table-center ">${row.target}</td>
              <td class="user-table-center ">${row.unit}</td>
            </tr>
          `);
        });
      }

      renderTable();

      // Modal helpers
      function openModal(data) {
        $('#cons-edit-sr').val(data.sr);
        $('#cons-param-name').val(data.name);
        $('#cons-param-unit').val(data.unit);
        $('#cons-param-base').val(data.base);
        $('#cons-param-target').val(data.target);
        $('#cons-static-modal').addClass('is-open');
        $('body').css('overflow', 'hidden');
      }

      function closeModal() {
        $('#cons-static-modal').removeClass('is-open');
        $('body').css('overflow', '');
      }

      $('#btn-close-modal, #btn-cancel-modal').on('click', function() {
        closeModal();
      });

      $('#cons-static-modal').on('click', function(e) {
        if ($(e.target).hasClass('gnfc-modal-overlay')) {
          closeModal();
        }
      });

      // Handle form submit
      $('#cons-static-form').on('submit', function(e) {
        e.preventDefault();
        const sr = $('#cons-edit-sr').val();
        const name = $('#cons-param-name').val().trim();
        const unit = $('#cons-param-unit').val().trim();
        const base = $('#cons-param-base').val();
        const target = $('#cons-param-target').val();

        const match = records.find(r => r.sr === sr);
        if (match) {
          match.name = name;
          match.unit = unit;
          match.base = base;
          match.target = target;
        }

        renderTable();
        closeModal();

        Swal.fire({
          title: 'Updated!',
          text: 'Parameter configuration updated successfully.',
          icon: 'success',
          timer: 1500,
          showConfirmButton: false
        });
      });
    });
  </script>
</body>

</html>
