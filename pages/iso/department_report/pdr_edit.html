<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedure Deviation Register (PDR) - Edit | GNFC E-Logbook</title>

  <!-- CSS Dependencies -->
  <link rel="stylesheet" href="../../../css/phosphor.css">
  <link rel="stylesheet" href="../../../css/theme-vars.css">
  <link rel="stylesheet" href="../../../css/utilities.css">
  <link rel="stylesheet" href="../../../css/common.css">
  <link rel="stylesheet" href="../../../css/modal-ui.css">
  <link rel="stylesheet" href="../../../css/pages/style.css">
  <link rel="stylesheet" href="../iso.css">

  <!-- JS Dependencies -->
  <script src="../../../js/vendor/jquery-3.7.1.min.js"></script>
  <script src="../../../js/vendor/sweetalert2.all.min.js"></script>
  <script src="../../../js/theme-control.js"></script>
  <script src="../../../js/sidebar.js" defer></script>
  <script src="../../../js/header.js" defer></script>

  <script>
    window.activePage = 'iso';
  </script>


</head>

<body class="dashboard-body">

  <!-- Sidebar Container -->
  <div class="sidebar-container"></div>

  <main class="main-wrapper">
    <!-- Header Container -->
    <div id="header-container" data-back="../iso.html"
      data-breadcrumb="ISO Dashboard:../iso.html,Edit PDR:active">
    </div>

    <!-- Page Content Area -->
    <div class="app-content-area flex flex-col justify-between pdr-app-content">

      <div>
    

        <!-- Section 1: Procedure Deviation Register (PDR) Edit -->
        <div class="config-block">
          <div class="flex items-center justify-between flex-wrap gap-12px" >
            <div class="flex items-center gap-8px">
              <i class="ph-bold ph-list-dashes font-20px" style="color: var(--typo-orange);"></i>
              <h3 style="font-size: 15px; font-weight: 800; color: var(--typo-primary); margin: 0; text-transform: uppercase; letter-spacing: 0.02em;">Procedure Deviation Register (PDR) Edit Flow</h3>
            </div>

             <div class="flex items-center gap-12px">
            <label for="pdr-plant-select" class="filter-label" style="margin-bottom: 0 !important;">Select plant:</label>
            <select id="pdr-plant-select" class="filter-select w-200px">
              <option value="ACETIC ACID" selected>ACETIC ACID</option>
              <option value="AAQM">AAQM</option>
              <option value="AMMONIA">AMMONIA</option>
              <option value="ANIP FILLING">ANIP FILLING</option>
              <option value="ANITDI">ANITDI</option>
              <option value="ASGP">ASGP</option>
              <option value="BAGGING">BAGGING</option>
              <option value="BOILER">BOILER</option>
              <option value="CMS">CMS</option>
              <option value="CPSU">CPSU</option>
              <option value="DM">DM</option>
              <option value="ETHYL ACETATE">ETHYL ACETATE</option>
              <option value="FORMIC ACID">FORMIC ACID</option>
              <option value="METHANOL-1">METHANOL-1</option>
              <option value="METHANOL-2">METHANOL-2</option>
              <option value="MINMAX">MINMAX</option>
              <option value="NITRO PHOSPHATE">NITRO PHOSPHATE</option>
              <option value="SPP">SPP</option>
              <option value="UREA">UREA</option>
            </select>
          </div>
          </div>

          <div class="config-grid">
            <!-- Card: Static Fields -->
            <div class="premium-config-card" style="min-height: auto; display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 24px;">
              <div style="display: flex; align-items: center; gap: 16px;">
                <div class="premium-card-icon" style="margin-bottom: 0;">
                  <i class="ph-bold ph-database"></i>
                </div>
                <h4 style="font-size: 15px; font-weight: 700; color: var(--typo-primary); text-transform: uppercase; margin: 0;">PDR Static Fields</h4>
              </div>
              <div class="premium-btn-group" style="display: flex; gap: 12px; margin-top: 0; padding-top: 0; border-top: none;">
                <button class="btn-orange-fill" onclick="handleAction('Static', 'Add')">
                  <i class="ph-bold ph-plus"></i> Add
                </button>
                <button class="btn-orange-outline" onclick="handleAction('Static', 'View', this)">
                  <i class="ph-bold ph-eye"></i> View
                </button>
              </div>
            </div>

            <!-- Card: Monthly Status -->
            <div class="premium-config-card" style="min-height: auto; display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 24px;">
              <div style="display: flex; align-items: center; gap: 16px;">
                <div class="premium-card-icon" style="margin-bottom: 0;">
                  <i class="ph-bold ph-calendar-blank"></i>
                </div>
                <h4 style="font-size: 15px; font-weight: 700; color: var(--typo-primary); text-transform: uppercase; margin: 0;">PDR Monthly Status</h4>
              </div>
              <div class="premium-btn-group" style="display: flex; gap: 12px; margin-top: 0; padding-top: 0; border-top: none;">
                <button class="btn-orange-fill" onclick="handleAction('Monthly', 'Add')">
                  <i class="ph-bold ph-plus"></i> Add
                </button>
                <button class="btn-orange-outline" onclick="handleAction('Monthly', 'View', this)">
                  <i class="ph-bold ph-eye"></i> View
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Inline view container for dynamic tables -->
        <div id="pdr-inline-view-container" style="display: none; margin-top: 24px;"></div>
      </div>

    </div>
  </main>

  <!-- ─── ADD SOP DEVIATION LOG MODAL ─── -->
  <div id="add-sop-modal" class="gnfc-modal-overlay">
    <div class="gnfc-modal-shell gnfc-modal-shell--narrow">
      <div class="gnfc-modal-header">
        <h2 class="gnfc-modal-title">ADD SOP DEVIATION LOG</h2>
        <button id="close-sop-modal" class="gnfc-modal-close" title="Close">
          <i class="ph ph-x"></i>
        </button>
      </div>
      <div class="gnfc-modal-body">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; text-align: left;">
          <div>
            <label class="gnfc-modal-label">SOP NO *</label>
            <input id="swal-sop-no" class="gnfc-modal-input" placeholder="Type SOP No...">
          </div>
          <div>
            <label class="gnfc-modal-label">SOP PURPOSE *</label>
            <input id="swal-sop-purpose" class="gnfc-modal-input" placeholder="Purpose of SOP...">
          </div>
          <div style="grid-column: span 2;">
            <label class="gnfc-modal-label">DETAILS OF DEVIATION *</label>
            <textarea id="swal-sop-deviation" class="gnfc-modal-input" placeholder="Detail any deviations..." style="height: 90px; resize: vertical;"></textarea>
          </div>
        </div>
      </div>
      <div class="gnfc-modal-footer">
        <button class="gnfc-modal-btn gnfc-modal-btn-secondary" id="cancel-sop-modal">Cancel</button>
        <button class="gnfc-modal-btn gnfc-modal-btn-primary" id="save-sop-modal">Save</button>
      </div>
    </div>
  </div>

  <!-- ─── ADD PDR STATIC PARAMETER MODAL ─── -->
  <div id="add-pdr-static-modal" class="gnfc-modal-overlay">
    <div class="gnfc-modal-shell gnfc-modal-shell--narrow">
      <div class="gnfc-modal-header">
        <h2 class="gnfc-modal-title">ADD PDR STATIC PARAMETER</h2>
        <button id="close-pdr-static-modal" class="gnfc-modal-close" title="Close">
          <i class="ph ph-x"></i>
        </button>
      </div>
      <div class="gnfc-modal-body">
        <div style="display: flex; flex-direction: column; gap: 16px; text-align: left;">
          <div>
            <label class="gnfc-modal-label">OCP NO *</label>
            <input id="swal-static-ocp-no" class="gnfc-modal-input" placeholder="e.g. 9">
          </div>
          <div>
            <label class="gnfc-modal-label">OCP PURPOSE *</label>
            <textarea id="swal-static-purpose" class="gnfc-modal-input" placeholder="e.g. Safe disposal of used cotton waste..." style="height: 80px; resize: vertical;"></textarea>
          </div>
          <div>
            <label class="gnfc-modal-label">PERFORMANCE CRITERIA *</label>
            <textarea id="swal-static-criteria" class="gnfc-modal-input" placeholder="e.g. To reduce land, water and air pollution" style="height: 80px; resize: vertical;"></textarea>
          </div>
        </div>
      </div>
      <div class="gnfc-modal-footer">
        <button class="gnfc-modal-btn gnfc-modal-btn-secondary" id="cancel-pdr-static-modal">Cancel</button>
        <button class="gnfc-modal-btn gnfc-modal-btn-primary" id="save-pdr-static-modal">Save</button>
      </div>
    </div>
  </div>

  <!-- ─── ADD PDR MONTHLY STATUS MODAL ─── -->
  <div id="add-pdr-monthly-modal" class="gnfc-modal-overlay">
    <div class="gnfc-modal-shell gnfc-modal-shell--narrow">
      <div class="gnfc-modal-header">
        <h2 class="gnfc-modal-title">ADD PDR MONTHLY STATUS</h2>
        <button id="close-pdr-monthly-modal" class="gnfc-modal-close" title="Close">
          <i class="ph ph-x"></i>
        </button>
      </div>
      <div class="gnfc-modal-body">
        <div style="display: flex; flex-direction: column; gap: 16px; text-align: left;">
          <div>
            <label class="gnfc-modal-label">OCP NO *</label>
            <select id="swal-monthly-ocp-no" class="gnfc-modal-input">
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
              <option value="11">11</option>
            </select>
          </div>
          <div>
            <label class="gnfc-modal-label">DETAILS OF DEVIATION *</label>
            <textarea id="swal-monthly-deviation" class="gnfc-modal-input" placeholder="Details of deviation..." style="height: 80px; resize: vertical;"></textarea>
          </div>
          <div>
            <label class="gnfc-modal-label">CORRECTING ACTION *</label>
            <textarea id="swal-monthly-corrective" class="gnfc-modal-input" placeholder="Corrective action taken..." style="height: 80px; resize: vertical;"></textarea>
          </div>
          <div>
            <label class="gnfc-modal-label">PREVENTIVE ACTION TAKEN *</label>
            <textarea id="swal-monthly-preventive" class="gnfc-modal-input" placeholder="Preventive action taken..." style="height: 80px; resize: vertical;"></textarea>
          </div>
          <div>
            <label class="gnfc-modal-label">REMARKS</label>
            <textarea id="swal-monthly-remarks" class="gnfc-modal-input" placeholder="Remarks..." style="height: 60px; resize: vertical;"></textarea>
          </div>
        </div>
      </div>
      <div class="gnfc-modal-footer">
        <button class="gnfc-modal-btn gnfc-modal-btn-secondary" id="cancel-pdr-monthly-modal">Cancel</button>
        <button class="gnfc-modal-btn gnfc-modal-btn-primary" id="save-pdr-monthly-modal">Save</button>
      </div>
    </div>
  </div>

  <script>
    $(function() {
      // Close SOP modal
      const closeSopModal = () => {
        $('#add-sop-modal').removeClass('is-open');
        $('body').css('overflow', '');
      };
      
      $('#close-sop-modal, #cancel-sop-modal').on('click', closeSopModal);
      
      $('#add-sop-modal').on('click', function(e) {
        if ($(e.target).hasClass('gnfc-modal-overlay')) closeSopModal();
      });

      // Close Static modal
      const closePdrStaticModal = () => {
        $('#add-pdr-static-modal').removeClass('is-open');
        $('body').css('overflow', '');
      };
      
      $('#close-pdr-static-modal, #cancel-pdr-static-modal').on('click', closePdrStaticModal);
      $('#add-pdr-static-modal').on('click', function(e) {
        if ($(e.target).hasClass('gnfc-modal-overlay')) closePdrStaticModal();
      });

      // Close Monthly modal
      const closePdrMonthlyModal = () => {
        $('#add-pdr-monthly-modal').removeClass('is-open');
        $('body').css('overflow', '');
      };
      
      $('#close-pdr-monthly-modal, #cancel-pdr-monthly-modal').on('click', closePdrMonthlyModal);
      $('#add-pdr-monthly-modal').on('click', function(e) {
        if ($(e.target).hasClass('gnfc-modal-overlay')) closePdrMonthlyModal();
      });
      
      $(document).on('keydown', function(e) {
        if (e.key === 'Escape') {
          if ($('#add-sop-modal').hasClass('is-open')) closeSopModal();
          if ($('#add-pdr-static-modal').hasClass('is-open')) closePdrStaticModal();
          if ($('#add-pdr-monthly-modal').hasClass('is-open')) closePdrMonthlyModal();
        }
      });

      // Save SOP Deviation Log
      $('#save-sop-modal').on('click', function() {
        const plant = $('#add-sop-modal').attr('data-plant') || '';
        const sopNo = $('#swal-sop-no').val().trim();
        const purpose = $('#swal-sop-purpose').val().trim();
        const deviation = $('#swal-sop-deviation').val().trim();
        
        if (!sopNo || !purpose || !deviation) {
          Swal.fire({
            title: 'Error',
            text: 'Please fill all required fields.',
            icon: 'error',
            confirmButtonColor: '#ea580c'
          });
          return;
        }
        
        closeSopModal();
        
        Swal.fire({
          title: 'Saved!',
          text: `SOP Deviation Log recorded successfully for Plant: ${plant}.`,
          icon: 'success',
          confirmButtonColor: '#ea580c'
        });
      });

      // Mock Databases
      let staticData = [
        { sr: 1, ocp: "1", purpose: "Operation control validation standards for process parameters.", criteria: "To ensure optimum operational stability" },
        { sr: 2, ocp: "2", purpose: "Environment compliance standards check and record keeping.", criteria: "To minimize overall emission levels" }
      ];

      let monthlyData = [
        { ocp: "9", purpose: "Safe disposal of used cotton waste, hand gloves, teflon/asbestos gaskets and S.S./M.S. scrap.", criteria: "To reduce land, water and air pollution", deviation: "Minor steam leak in auxiliary bypass line observed during shift.", corrective: "Isolated the bypass line and replaced gasket seals.", preventive: "Scheduled bi-weekly physical inspection audits for auxiliary lines.", remarks: "Bypass line returned to normal operation." },
        { ocp: "1", purpose: "Safe startup sequence checks for auxiliary steam condenser systems.", criteria: "Avoid condensate contamination and ensure pressure limits", deviation: "Condensate conductivity briefly spiked above 0.3 uS/cm limit.", corrective: "Switched to primary polishers unit and blew down excess boiler steam.", preventive: "Configured automated alarms for alarm limit pre-warnings.", remarks: "Polishing unit returned conductivity back to safe levels." },
        { ocp: "3", purpose: "Catalyst reduction phase steam temperature tracking and limit validation.", criteria: "Optimal reduction rate and prevention of high temp stress", deviation: "Temp controller TC-403 experienced output oscillation.", corrective: "Re-tuned controller PID variables in control room DCS.", preventive: "Scheduled maintenance check of the feedback positioner.", remarks: "Loop stabilized and temperature tracked successfully." },
        { ocp: "5", purpose: "Exhaust gas sensor functional checks using standard calibrating gas mixtures.", criteria: "Emission reading drift compliance verification", deviation: "CO sensor experienced drift of 2.1 ppm.", corrective: "Recalibrated primary CO analyzer with certified span gas.", preventive: "Replaced gas filter membrane to prevent sensor poisoning.", remarks: "Calibrations certified and readings accurate." }
      ];

      // Save PDR Static Parameter
      $('#save-pdr-static-modal').on('click', function() {
        const plant = $('#add-pdr-static-modal').attr('data-plant') || '';
        const ocpNo = $('#swal-static-ocp-no').val().trim();
        const purpose = $('#swal-static-purpose').val().trim();
        const criteria = $('#swal-static-criteria').val().trim();
        
        if (!ocpNo || !purpose || !criteria) {
          Swal.fire({
            title: 'Error',
            text: 'Please fill all required fields.',
            icon: 'error',
            confirmButtonColor: '#ea580c'
          });
          return;
        }
        
        const mode = $('#add-pdr-static-modal').attr('data-mode');
        if (mode === 'edit') {
          const sr = parseInt($('#add-pdr-static-modal').attr('data-sr'));
          const record = staticData.find(r => r.sr === sr);
          if (record) {
            record.ocp = ocpNo;
            record.purpose = purpose;
            record.criteria = criteria;
          }
          if ($('.btn-orange-outline[onclick*="Static"]').hasClass('active-view-btn')) {
            renderStaticTable();
          }
          closePdrStaticModal();
          Swal.fire({
            title: 'Updated!',
            text: `Static Parameter updated successfully.`,
            icon: 'success',
            confirmButtonColor: '#ea580c',
            timer: 1500,
            showConfirmButton: false
          });
        } else {
          const newSr = staticData.length ? Math.max(...staticData.map(r => r.sr)) + 1 : 1;
          staticData.push({ sr: newSr, ocp: ocpNo, purpose: purpose, criteria: criteria });
          if ($('.btn-orange-outline[onclick*="Static"]').hasClass('active-view-btn')) {
            renderStaticTable();
          }
          closePdrStaticModal();
          Swal.fire({
            title: 'Saved!',
            text: `Static Parameter saved successfully for Plant: ${plant}.`,
            icon: 'success',
            confirmButtonColor: '#ea580c',
            timer: 1500,
            showConfirmButton: false
          });
        }
      });

      // Save PDR Monthly Status
      $('#save-pdr-monthly-modal').on('click', function() {
        const plant = $('#add-pdr-monthly-modal').attr('data-plant') || '';
        const ocpNo = $('#swal-monthly-ocp-no').val();
        const deviation = $('#swal-monthly-deviation').val().trim();
        const corrective = $('#swal-monthly-corrective').val().trim();
        const preventive = $('#swal-monthly-preventive').val().trim();
        const remarks = $('#swal-monthly-remarks').val().trim();
        
        if (!deviation || !corrective || !preventive) {
          Swal.fire({
            title: 'Error',
            text: 'Please fill all required fields.',
            icon: 'error',
            confirmButtonColor: '#ea580c'
          });
          return;
        }
        
        const mode = $('#add-pdr-monthly-modal').attr('data-mode');
        if (mode === 'edit') {
          const oldOcp = $('#add-pdr-monthly-modal').attr('data-ocp');
          const record = monthlyData.find(r => r.ocp === oldOcp);
          if (record) {
            record.ocp = ocpNo;
            record.deviation = deviation;
            record.corrective = corrective;
            record.preventive = preventive;
            record.remarks = remarks;
            
            const staticRecord = staticData.find(r => r.ocp === ocpNo);
            record.purpose = staticRecord ? staticRecord.purpose : "Purpose of OCP " + ocpNo;
            record.criteria = staticRecord ? staticRecord.criteria : "Criteria of OCP " + ocpNo;
          }
          if ($('.btn-orange-outline[onclick*="Monthly"]').hasClass('active-view-btn')) {
            renderMonthlyTable();
          }
          closePdrMonthlyModal();
          Swal.fire({
            title: 'Updated!',
            text: `Monthly PDR Deviation Log updated successfully.`,
            icon: 'success',
            confirmButtonColor: '#ea580c',
            timer: 1500,
            showConfirmButton: false
          });
        } else {
          const staticRecord = staticData.find(r => r.ocp === ocpNo);
          const purpose = staticRecord ? staticRecord.purpose : "Purpose of OCP " + ocpNo;
          const criteria = staticRecord ? staticRecord.criteria : "Criteria of OCP " + ocpNo;
          
          monthlyData.push({
            ocp: ocpNo,
            purpose: purpose,
            criteria: criteria,
            deviation: deviation,
            corrective: corrective,
            preventive: preventive,
            remarks: remarks
          });
          if ($('.btn-orange-outline[onclick*="Monthly"]').hasClass('active-view-btn')) {
            renderMonthlyTable();
          }
          closePdrMonthlyModal();
          Swal.fire({
            title: 'Saved!',
            text: `Monthly PDR Deviation Log recorded successfully for Plant: ${plant} (OCP No: ${ocpNo}).`,
            icon: 'success',
            confirmButtonColor: '#ea580c',
            timer: 1500,
            showConfirmButton: false
          });
        }
      });

      // View Rendering Functions
      function renderStaticTable() {
        const plant = $('#pdr-plant-select').val();
        let html = `
          <div class="pdr-view-card">
            <div class="pdr-table-title-bar">
              <div class="pdr-plant-label">
                <i class="ph-bold ph-buildings"></i> Plant: <span id="pdr-inline-plant-name">${plant}</span>
              </div>
              <div class="pdr-static-title">PDR Static Data</div>
            </div>        

            <div class="user-table-wrapper" style="margin: 0;">
              <table class="user-table">
                <thead>
                  <tr>
                    <th class="user-table-center w-80px">Sr No</th>
                    <th class="user-table-center w-120px">OCP NO</th>
                    <th class="user-table-left">OCP Purpose</th>
                    <th class="user-table-left">Performance criteria</th>
                    <th class="user-table-center w-100px">Action</th>
                  </tr>
                </thead>
                <tbody>
        `;
        
        staticData.forEach(row => {
          html += `
            <tr class="user-table-row">
              <td class="user-table-center font-14px fw-600">${row.sr}</td>
              <td class="user-table-center font-14px">${row.ocp}</td>
              <td>${row.purpose}</td>
              <td>${row.criteria}</td>
              <td class="user-table-center">
                <a href="#" class="edit-action-link edit-inline-static-btn" data-sr="${row.sr}">
                  <i class="ph-bold ph-pencil-simple"></i> Edit
                </a>
              </td>
            </tr>
          `;
        });
        
        html += `
                </tbody>
              </table>
            </div>
          </div>
        `;
        
        $('#pdr-inline-view-container').html(html);
      }

      let currentInlineYear = '2026';

      function renderMonthlyTable(selectedYear = currentInlineYear) {
        currentInlineYear = selectedYear;
        const plant = $('#pdr-plant-select').val();
        let html = `
          <div class="pdr-view-card">
            <div class="pdr-monthly-header-bar">
              <div class="pdr-plant-label">
                <i class="ph-bold ph-buildings"></i> Plant: <span id="pdr-inline-plant-name">${plant}</span>
              </div>
              <div class="pdr-center-title">Procedure Deviation Register</div>
              
              <!-- Premium dynamic Year dropdown select on the right side of header -->
              <div class="pdr-inline-year-wrap">
                <label class="filter-label">Active Year:</label>
                <select id="pdr-inline-year-select" class="filter-select pdr-header-select">
                  <option value="2026" ${selectedYear === '2026' ? 'selected' : ''}>2026</option>
                  <option value="2025" ${selectedYear === '2025' ? 'selected' : ''}>2025</option>
                  <option value="2024" ${selectedYear === '2024' ? 'selected' : ''}>2024</option>
                  <option value="2023" ${selectedYear === '2023' ? 'selected' : ''}>2023</option>
                </select>
                <div class="pdr-date-label">May</div>
              </div>
            </div>

            <div class="user-table-wrapper" style="margin: 0;">
              <table class="user-table">
                <thead>
                  <tr>
                    <th class="user-table-center w-80px">OCP NO</th>
                    <th class="user-table-left w-300px">Purpose</th>
                    <th class="user-table-left w-250px">Performance Criteria</th>
                    <th class="user-table-left">Details Of Deviation<br><span class="font-11px fw-normal opacity-75">(To procedure or performance criteria)</span></th>
                    <th class="user-table-left">Correcting Action<br><span class="font-11px fw-normal opacity-75">Corrective action taken</span></th>
                    <th class="user-table-left">Preventive action taken</th>
                    <th class="user-table-left">Remarks</th>
                    <th class="user-table-center w-100px">Action</th>
                  </tr>
                </thead>
                <tbody>
        `;
        
        monthlyData.forEach(row => {
          html += `
            <tr class="user-table-row">
              <td class="user-table-center font-14px fw-600">${row.ocp}</td>
              <td class="fw-500">${row.purpose}</td>
              <td>${row.criteria}</td>
              <td>${row.deviation}</td>
              <td>${row.corrective}</td>
              <td>${row.preventive}</td>
              <td>${row.remarks}</td>
              <td class="user-table-center">
                <a href="#" class="edit-action-link edit-inline-monthly-btn" data-ocp="${row.ocp}">
                  <i class="ph-bold ph-pencil-simple"></i> Edit
                </a>
              </td>
            </tr>
          `;
        });
        
        html += `
                </tbody>
              </table>
            </div>
          </div>
        `;
        
        $('#pdr-inline-view-container').html(html);
      }

      // Inline Edit Click Handlers
      $(document).on('click', '.edit-inline-static-btn', function(e) {
        e.preventDefault();
        const sr = parseInt($(this).attr('data-sr'));
        const record = staticData.find(r => r.sr === sr);
        if (record) {
          $('#swal-static-ocp-no').val(record.ocp);
          $('#swal-static-purpose').val(record.purpose);
          $('#swal-static-criteria').val(record.criteria);
          
          $('#add-pdr-static-modal')
            .attr('data-mode', 'edit')
            .attr('data-sr', sr)
            .find('.gnfc-modal-title').text('EDIT PDR STATIC PARAMETER');
          
          $('#add-pdr-static-modal').addClass('is-open');
          $('body').css('overflow', 'hidden');
        }
      });

      $(document).on('click', '.edit-inline-monthly-btn', function(e) {
        e.preventDefault();
        const ocp = $(this).attr('data-ocp');
        const record = monthlyData.find(r => r.ocp === ocp);
        if (record) {
          $('#swal-monthly-ocp-no').val(record.ocp);
          $('#swal-monthly-deviation').val(record.deviation);
          $('#swal-monthly-corrective').val(record.corrective);
          $('#swal-monthly-preventive').val(record.preventive);
          $('#swal-monthly-remarks').val(record.remarks);
          
          $('#add-pdr-monthly-modal')
            .attr('data-mode', 'edit')
            .attr('data-ocp', ocp)
            .find('.gnfc-modal-title').text('EDIT PDR MONTHLY STATUS');
          
          $('#add-pdr-monthly-modal').addClass('is-open');
          $('body').css('overflow', 'hidden');
        }
      });

      // View Button Toggling Logic
      let currentActiveType = null;

      function toggleInlineView(type, btnEl) {
        const $btn = $(btnEl);
        const $container = $('#pdr-inline-view-container');
        
        if (currentActiveType === type) {
          $btn.removeClass('active-view-btn');
          $container.slideUp(300, function() {
            $container.empty();
          });
          currentActiveType = null;
          return;
        }
        
        $('.btn-orange-outline').removeClass('active-view-btn');
        $btn.addClass('active-view-btn');
        
        if (type === 'Static') {
          renderStaticTable();
        } else if (type === 'Monthly') {
          renderMonthlyTable();
        }
        
        if (currentActiveType === null) {
          $container.hide().slideDown(300);
        }
        currentActiveType = type;
      }

      // Dropdown interaction updates
      $('#pdr-plant-select').on('change', function() {
        const plantName = $(this).val();
        $('#pdr-inline-plant-name').text(plantName);
        if (currentActiveType === 'Static') {
          renderStaticTable();
        } else if (currentActiveType === 'Monthly') {
          renderMonthlyTable();
        }
      });

      window.handleAction = function(section, type, btnEl) {
        const selectedPlant = $('#pdr-plant-select').val();
        
        if (section === 'Static' && type === 'Add') {
          $('#swal-static-ocp-no').val('');
          $('#swal-static-purpose').val('');
          $('#swal-static-criteria').val('');
          
          $('#add-pdr-static-modal')
            .removeAttr('data-mode')
            .removeAttr('data-sr')
            .find('.gnfc-modal-title').text('ADD PDR STATIC PARAMETER');

          $('#add-pdr-static-modal').attr('data-plant', selectedPlant);
          $('#add-pdr-static-modal').addClass('is-open');
          $('body').css('overflow', 'hidden');
          return;
        }
        if (section === 'Static' && type === 'View') {
          // ORIGINAL REDIRECT PRESERVED AS REQUESTED:
          // window.location.href = `pdr_view_static.html?plant=${encodeURIComponent(selectedPlant)}`;
          
          toggleInlineView('Static', btnEl);
          return;
        }
        if (section === 'Monthly' && type === 'Add') {
          $('#swal-monthly-deviation').val('');
          $('#swal-monthly-corrective').val('');
          $('#swal-monthly-preventive').val('');
          $('#swal-monthly-remarks').val('');
          
          $('#add-pdr-monthly-modal')
            .removeAttr('data-mode')
            .removeAttr('data-ocp')
            .find('.gnfc-modal-title').text('ADD PDR MONTHLY STATUS');

          $('#add-pdr-monthly-modal').attr('data-plant', selectedPlant);
          $('#add-pdr-monthly-modal').addClass('is-open');
          $('body').css('overflow', 'hidden');
          return;
        }
        if (section === 'Monthly' && type === 'View') {
          // ORIGINAL REDIRECT PRESERVED AS REQUESTED:
          // window.location.href = `pdr_view_monthly.html?plant=${encodeURIComponent(selectedPlant)}`;
          
          toggleInlineView('Monthly', btnEl);
          return;
        }
      };

      window.handleSopEditAction = function(action) {
        const plant = $('#pdr-plant-select').val();
        if (action === 'Add') {
          $('#swal-sop-no').val('');
          $('#swal-sop-purpose').val('');
          $('#swal-sop-deviation').val('');
          $('#add-sop-modal').attr('data-plant', plant);
          $('#add-sop-modal').addClass('is-open');
          $('body').css('overflow', 'hidden');
        } else {
          Swal.fire({
            title: 'SOP Registers List',
            text: `Opening deviation register logs list for SOPs under plant "${plant}"`,
            icon: 'info',
            confirmButtonColor: '#ea580c'
          });
        }
      };

      // Inline Year dropdown change listener
      $(document).on('change', '#pdr-inline-year-select', function() {
        const selectedYear = $(this).val();
        renderMonthlyTable(selectedYear);
      });
    });
  </script>
</body>

</html>
