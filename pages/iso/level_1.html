<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISO Level 1 Documents | GNFC E-Logbook</title>

  <!-- CSS Dependencies -->
  <link rel="stylesheet" href="../../css/phosphor.css">
  <link rel="stylesheet" href="../../css/theme-vars.css">
  <link rel="stylesheet" href="../../css/utilities.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/pages/style.css">
  <link rel="stylesheet" href="iso.css">

  <!-- JS Dependencies -->
  <script src="../../js/vendor/jquery-3.7.1.min.js"></script>
  <script src="../../js/theme-control.js"></script>
  <script src="../../js/sidebar.js" defer></script>
  <script src="../../js/header.js" defer></script>

  <script>
    window.activePage = 'iso';
  </script>
</head>

<body class="dashboard-body">

  <!-- Sidebar Container -->
  <div class="sidebar-container"></div>

  <main class="main-wrapper">
    <!-- Header Container -->
    <div id="header-container" data-back="iso.html"
      data-breadcrumb="Dashboard:../../dashboard.html,ISO Dashboard:iso.html,LEVEL-1:active">
    </div>

    <!-- Page Content Area -->
    <div class="app-content-area">

  

      <!-- Document Management System Card -->
      <div class="dms-container">
        <!-- Badge & Path Info Row -->
        <div class="dms-meta-row">
          <div class="dms-code-badge">
            ISO14000 DMS CODE: IMS/F/INST/10
          </div>
          <div class="dms-path-badge">
            <i class="ph-fill ph-folder-open"></i>
            <span>ISO/DOC/LEVEL-1/</span>
          </div>
        </div>

        <!-- Toolbar controls -->
        <div class="dms-toolbar">
          <button class="dms-toolbar-btn" onclick="history.back()" title="Up one folder">
            <i class="ph ph-arrow-up"></i>
          </button>
          <button class="dms-toolbar-btn" title="Upload document">
            <i class="ph ph-upload-simple"></i>
          </button>
          <button class="dms-toolbar-btn" title="Save current list">
            <i class="ph ph-floppy-disk"></i>
          </button>
        </div>

        <!-- Corporate Table system from style.css -->
        <div class="user-table-wrapper">
          <table class="user-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Type</th>
                <th>Size</th>
                <th>Last Modified</th>
                <th style="width: 120px;">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>
                  <div class="file-name-cell">
                    <i class="ph-fill ph-file-doc file-icon-doc"></i>
                    <span>ems.doc</span>
                  </div>
                </td>
                <td>Microsoft Word Document</td>
                <td>441Kb</td>
                <td>05/07/2014</td>
                <td>
                  <div class="file-actions">
                    <a href="#" class="file-action-link" title="View Document"><i class="ph ph-eye"></i></a>
                    <a href="#" class="file-action-link" title="Download Document"><i class="ph ph-download-simple"></i></a>
                    <a href="#" class="file-action-link file-action-delete" title="Delete Document"><i class="ph ph-x"></i></a>
                  </div>
                </td>
              </tr>
              <tr>
                <td>
                  <div class="file-name-cell">
                    <i class="ph-fill ph-file file-icon-doc"></i>
                    <span>ems.lwp</span>
                  </div>
                </td>
                <td>LWP File</td>
                <td>1085Kb</td>
                <td>07/10/2009</td>
                <td>
                  <div class="file-actions">
                    <a href="#" class="file-action-link" title="View Document"><i class="ph ph-eye"></i></a>
                    <a href="#" class="file-action-link" title="Download Document"><i class="ph ph-download-simple"></i></a>
                    <a href="#" class="file-action-link file-action-delete" title="Delete Document"><i class="ph ph-x"></i></a>
                  </div>
                </td>
              </tr>
              <tr>
                <td>
                  <div class="file-name-cell">
                    <i class="ph-fill ph-file-pdf file-icon-pdf"></i>
                    <span>gnfc-msm-level-1.pdf</span>
                  </div>
                </td>
                <td>PDF File</td>
                <td>511Kb</td>
                <td>27/07/2010</td>
                <td>
                  <div class="file-actions">
                    <a href="#" class="file-action-link" title="View Document"><i class="ph ph-eye"></i></a>
                    <a href="#" class="file-action-link" title="Download Document"><i class="ph ph-download-simple"></i></a>
                    <a href="#" class="file-action-link file-action-delete" title="Delete Document"><i class="ph ph-x"></i></a>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</body>

</html>
