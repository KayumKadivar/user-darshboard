<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job List | GNFC E-Logbook</title>

  <!-- CSS Dependencies -->
  <link rel="stylesheet" href="../../css/phosphor.css">
  <link rel="stylesheet" href="../../css/theme-vars.css">
  <link rel="stylesheet" href="../../css/utilities.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/modal-ui.css">
  <link rel="stylesheet" href="../../css/pages/style.css">
  <link rel="stylesheet" href="joblist.css">

  <!-- JS Dependencies -->
  <script src="../../js/vendor/jquery-3.7.1.min.js"></script>
  <script src="../../js/vendor/sweetalert2.all.min.js"></script>
  <script src="../../js/theme-control.js"></script>
  <script src="../../js/sidebar.js" defer></script>
  <script src="../../js/header.js" defer></script>

  <script>
    window.activePage = 'job_list';
  </script>
</head>

<body class="dashboard-body">
  <!-- Sidebar Container -->
  <div class="sidebar-container"></div>

  <main class="main-wrapper">
    <!-- Header Container -->
    <div id="header-container" data-title="Job List" data-back="../../dashboard.html" data-breadcrumb="Job List:active">
    </div>

    <!-- Page Content -->
    <div class="app-content-area">

      <!-- Job Units Panel -->
      <div class="job-panel">
        <div class="job-unit-grid" id="job-grid">
          <div class="job-unit-card" onclick="handleUnitClick('AA')">
            <span class="job-unit-name">AA</span>
          </div>
          <div class="job-unit-card" onclick="handleUnitClick('AAQM')">
            <span class="job-unit-name">AAQM</span>
          </div>
          <div class="job-unit-card" onclick="handleUnitClick('AMM')">
            <span class="job-unit-name">AMM</span>
          </div>
          <div class="job-unit-card" onclick="handleUnitClick('ANIPF')">
            <span class="job-unit-name">ANIPF</span>
          </div>
          <div class="job-unit-card" onclick="handleUnitClick('ANITDI')">
            <span class="job-unit-name">ANITDI</span>
          </div>
          <div class="job-unit-card" onclick="handleUnitClick('ASGP')">
            <span class="job-unit-name">ASGP</span>
          </div>
          <div class="job-unit-card" onclick="handleUnitClick('BAGG')">
            <span class="job-unit-name">BAGG</span>
          </div>
          <div class="job-unit-card" onclick="handleUnitClick('BOILER')">
            <span class="job-unit-name">BOILER</span>
          </div>
          <div class="job-unit-card" onclick="handleUnitClick('CMS')">
            <span class="job-unit-name">CMS</span>
          </div>
          <div class="job-unit-card" onclick="handleUnitClick('CPSU')">
            <span class="job-unit-name">CPSU</span>
          </div>
          <div class="job-unit-card" onclick="handleUnitClick('DM')">
            <span class="job-unit-name">DM</span>
          </div>
          <div class="job-unit-card" onclick="handleUnitClick('EA')">
            <span class="job-unit-name">EA</span>
          </div>
          <div class="job-unit-card" onclick="handleUnitClick('FA')">
            <span class="job-unit-name">FA</span>
          </div>
          <div class="job-unit-card" onclick="handleUnitClick('INSTWS')">
            <span class="job-unit-name">INSTWS</span>
          </div>
          <div class="job-unit-card" onclick="handleUnitClick('M1')">
            <span class="job-unit-name">M1</span>
          </div>
          <div class="job-unit-card" onclick="handleUnitClick('M2')">
            <span class="job-unit-name">M2</span>
          </div>
          <div class="job-unit-card" onclick="handleUnitClick('MINMAX')">
            <span class="job-unit-name">MINMAX</span>
          </div>
          <div class="job-unit-card" onclick="handleUnitClick('NPP')">
            <span class="job-unit-name">NPP</span>
          </div>
          <div class="job-unit-card" onclick="handleUnitClick('SPP')">
            <span class="job-unit-name">SPP</span>
          </div>
          <div class="job-unit-card" onclick="handleUnitClick('UREA')">
            <span class="job-unit-name">UREA</span>
          </div>
        </div>
      </div>

      <!-- Filter Section -->
      <div class="filter-panel">
        <div class="filter-row">
          <label class="filter-option">
            <input type="radio" name="jobFilter" class="filter-radio" value="Current Joblist" checked>
            <span>Current Joblist</span>
          </label>
          <label class="filter-option">
            <input type="radio" name="jobFilter" class="filter-radio" value="S/D Joblist">
            <span>S/D Joblist</span>
          </label>
          <label class="filter-option">
            <input type="radio" name="jobFilter" class="filter-radio" value="Revamp Joblist">
            <span>Revamp Joblist</span>
          </label>
          <label class="filter-option">
            <input type="radio" name="jobFilter" class="filter-radio" value="Completed Joblist">
            <span>Completed Joblist</span>
          </label>
          <label class="filter-option">
            <input type="radio" name="jobFilter" class="filter-radio" value="JOB Planner">
            <span>JOB Planner</span>
          </label>
     
          <label class="filter-option">
            <input type="radio" name="jobFilter" class="filter-radio" value="Weekly Planner">
            <span>Weekly Planner</span>
          </label>

          <label class="filter-option">
            <input type="radio" name="jobFilter" class="filter-radio" value="Objective">
            <span>Objective</span>
          </label>
        </div>
      </div>
    </div>
  </main>

  <script>
    $(function () {
      const savedFilter = localStorage.getItem('selectedJobFilter');
      if (savedFilter) {
        $(`input[name="jobFilter"][value="${savedFilter}"]`).prop('checked', true);
      }

      $('input[name="jobFilter"]').on('change', function() {
        localStorage.setItem('selectedJobFilter', $(this).val());
      });

      window.handleUnitClick = function (unit) {
        const selectedFilter = $('input[name="jobFilter"]:checked').val() || "Unknown";
        console.log(`Clicked Unit: ${unit}, Mode: ${selectedFilter}`);

        let url = "";
        if (selectedFilter === "S/D Joblist") {
          url = `sdjoblist.html`;
        } else if (selectedFilter === "Revamp Joblist") {
          url = `Revamp.html`;
        } else if (selectedFilter === "Completed Joblist") {
          url = `complatedjoblist.html`;
        } else if (selectedFilter === "Weekly Planner") {
          url = `weeklyplanner.html`;
        } else if (selectedFilter === "JOB Planner") {
          url = `jobplaner.html`;
        } else if (selectedFilter === "Objective") {
          url = `objactive_joblist.html`;
        } else {
          url = `currentjoblist.html`;
        }
        window.location.href = url;
      };
    });
  </script>
</body>

</html>
