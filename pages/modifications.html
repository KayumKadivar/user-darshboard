<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modifications Suggested | GNFC</title>
  <meta name="description" content="GNFC Suggestions for Modification Report">

  <!-- CSS -->
  <link rel="stylesheet" href="../css/phosphor.css">
  <link rel="stylesheet" href="../css/theme-vars.css">
  <link rel="stylesheet" href="../css/utilities.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/modal-ui.css">
  <link rel="stylesheet" href="../css/pages/style.css">

  <!-- JS Vendors -->
  <script src="../js/vendor/jquery-3.7.1.min.js"></script>
  <script src="../js/theme-control.js"></script>
  <script src="../js/sidebar.js" defer></script>
  <script src="../js/header.js" defer></script>
  <script src="../js/plant-nav.js" defer></script>

  <script>
    window.activePage = 'modifications';
  </script>
</head>

<body class="dashboard-body">

  <!-- Sidebar -->
  <div class="sidebar-container"></div>

  <!-- Main -->
  <main class="main-wrapper">

    <!-- Header -->
    <div id="header-container" data-title="Modifications Suggested" data-back="plant_detail.html"></div>

    <!-- Page Content -->
    <section class="jt-page-content">

      <!-- Plant Navigation -->
      <div id="plant-nav-container"></div>

      <!-- ── FILTER CARD ── -->
      <div class="jt-filter-card" style="margin-bottom: 24px;">
        <div class="jt-filter-header">
          <h3 class="jt-filter-title">
            <i class="ph-bold ph-funnel"></i>
            SEARCH CRITERIA
          </h3>
        </div>
        <div class="jt-filter-body" style="grid-template-columns: 320px auto;">
          
          <!-- Tag Input -->
          <div class="jt-filter-group">
            <label class="jt-filter-label">Search Tag / Description</label>
            <div class="jt-input-icon-wrap" style="position: relative; width: 100%;">
              <i class="ph-bold ph-magnifying-glass" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--typo-label); font-size: 14px; pointer-events: none; z-index: 2;"></i>
              <input type="text" id="modSearch" class="jt-input" placeholder="Enter Tag No..." style="padding-left: 36px;">
            </div>
          </div>

          <!-- Actions -->
          <div class="jt-filter-group" style="display: flex; align-items: flex-end; gap: 12px;">
            <button onclick="renderModTable()" class="jt-btn-primary">
              <i class="ph-bold ph-lightning"></i> APPLY
            </button>
            <button onclick="location.reload()" class="jt-btn-reset">
              <i class="ph-bold ph-arrow-counter-clockwise"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- ── TABLE CARD ── -->
      <div class="jt-table-card">

        <div class="jt-report-header">
          <div class="jt-report-title">
            <i class="ph-fill ph-gear-six"></i>
            <div class="jt-title-stack">
              <h3 class="jt-main-title">Modifications Suggested</h3>
              <p style="font-size: 13px; color: var(--brand-primary); font-weight: 600; margin-top: 2px;">Plant Unit: Acetic Acid</p>
            </div>
          </div>
          <div class="jt-report-actions">
            <div class="flex gap-4 items-center">
              <button class="jt-btn-primary">
                <i class="ph-bold ph-export"></i> EXPORT PDF
              </button>
            </div>
          </div>
        </div>

        <div class="user-table-wrapper">
          <table class="user-table">
            <thead>
              <tr>
                <th class="user-table-center" style="width: 64px;">Sr</th>
                <th class="user-table-center" style="width: 140px;">Tag No</th>
                <th style="min-width: 450px;">Description</th>
                <th class="user-table-center" style="width: 80px;">By</th>
                <th class="user-table-center" style="width: 100px;">Status</th>
                <th style="min-width: 300px;">Remarks</th>
                <th class="user-table-center" style="width: 64px;">Verify</th>
              </tr>
            </thead>
            <tbody id="mod-table-body">
            </tbody>
          </table>
        </div>

      </div>
    </section>

  </main>

  <script>
    const modData = [
      {
        sr: 1,
        tag: '2PT1544',
        desc: 'Zero checked found ok. Manifold and nipple required. Same informed to IE.',
        tech: 'DSU',
        status: 'OVER',
        remarks: 'ok [written by: MMD Date: 17/03/2017]'
      },
      {
        sr: 2,
        tag: '4PCV1631B',
        desc: 'As per process report its valve is not operate below 30 per due to valve stuck-up, then inform to process the output of PRCA1605 is look at 3.5 kg/cm2 lower limit due to this valve is not operate. After that as per IOM PROM 605 valve is change from 3.5 to 3.2 and trial taken HCPCV working normal. HELP page graphics modification required. Now showing PRCA1631B for HO and PRCA1531B for NC lower limit and higher limit lock value, but need to provide PRCA1605 for both HO and NO control loop output lower limit lock and higher limit lock this is help to process for smooth operation.',
        tech: 'RMK',
        status: 'OVER',
        remarks: 'ok [written by: RMP Date: 19/08/2017]'
      },
      {
        sr: 3,
        tag: 'BDV-8420B',
        desc: 'Its close limit switch not coming. Be checked in field and adjusted. Now its coming Tagging required in field.',
        tech: 'BBU',
        status: 'OVER',
        remarks: 'ok [written by: MMD Date: 01/04/2017]'
      },
      {
        sr: 4,
        tag: 'SDV-9',
        desc: 'Close Limit switch indication some time not coming so Proximity switch adjusted after that operation checked found ok. Proximity mounting required changes because of its not sensing target proper(For this modification show ASP-1 Discharge valve LS)',
        tech: 'VVM',
        status: 'OVER',
        remarks: 'Good. [written by: AMD Date: 19/08/2017]\nE(MMD) Do needful. [written by: NTD Date: 21/04/2017]'
      },
      {
        sr: 5,
        tag: 'Aa-7',
        desc: 'Vessel pressure low not coming so checked found that line block filter feel with ASH and Impulse line too. Both clean and operation checked found ok. Line block Impulse BS tube modification required.',
        tech: 'VVM',
        status: 'OVER',
        remarks: 'What is your suggestion? [written by: AMD Date: 16/08/2018]\nCan we provide air flushing? [written by: NTD Date: 16/08/2018]'
      },
      {
        sr: 6,
        tag: 'PV-8420A',
        desc: 'Control valve PM job done. Cleaning, Greasing done. Fitting Leakage checked and found ok. Diaphragm passing checked and found ok. Stroke checked found ok. -Start opening checked and found its 4.12 mA, its AFR replace with spare, tubing modification require, stroke check from control room.',
        tech: 'JDB',
        status: 'OVER',
        remarks: 'ok [written by: RMP Date: 25/04/2018]'
      },
      {
        sr: 7,
        tag: 'PV-8420C',
        desc: 'Control valve PM job done. Cleaning, Greasing done. Fitting Leakage checked and found ok. Diaphragm passing checked and found ok. Stroke checked found ok. -Start opening checked and found its 18.95 mA, its AFR replace with spare, tubing modification require, stroke check from control room.',
        tech: 'JDB',
        status: 'OVER',
        remarks: 'ok by: RBL Date: 25/04/2018'
      },
      {
        sr: 8,
        tag: 'LT-2',
        desc: 'Process require Slurry sump level High bypass for HP pump start so its LT cover try to open but its much more jam so LT remove with base and put on open atmosphere for HP pump start. -After Process clearance LT keep it on original place. -LT mounting base found totally corrode so its require proper base mounting.',
        tech: 'MSA',
        status: 'OVER',
        remarks: 'ok [written by: RMP Date: 19/11/2018]'
      }
    ];

    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[m];
      });
    }

    function renderTable() {
      const tbody = document.getElementById('mod-table-body');
      let html = '';
      
      for (let i = 0; i < modData.length; i++) {
        const row = modData[i];
        const badgeClass = row.status === 'OVER' ? 'ui-badge--success' : 'ui-badge--warning';
        
        html += '<tr class="user-table-row">' +
          '<td class="user-table-center user-table-secondary user-table-bold">' + row.sr + '</td>' +
          '<td class="user-table-center user-table-bold user-table-blue">' + escapeHTML(row.tag) + '</td>' +
          '<td class="user-table-primary" style="line-height: 1.5; font-size: 0.8125rem;">' + escapeHTML(row.desc) + '</td>' +
          '<td class="user-table-center user-table-bold user-table-secondary">' + escapeHTML(row.tech) + '</td>' +
          '<td class="user-table-center">' +
            '<span class="ui-badge ' + badgeClass + '">' + row.status + '</span>' +
          '</td>' +
          '<td class="user-table-secondary" style="font-style: italic; font-size: 0.85rem;">' + 
            escapeHTML(row.remarks).replace(/\n/g, '<br>') + 
          '</td>' +
          '<td class="user-table-center">' +
            '<input type="checkbox" class="jt-verify-check" />' +
          '</td>' +
        '</tr>';
      }
      
      tbody.innerHTML = html;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const plant = urlParams.get('plant') || 'BOILER';
    document.getElementById('plant-id-display').textContent = plant;
    renderTable();
  </script>
</body>

</html>
