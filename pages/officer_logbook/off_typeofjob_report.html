<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Of Job Report | GNFC</title>
  
  <link rel="stylesheet" href="../../css/phosphor.css">
  <link rel="stylesheet" href="../../css/theme-vars.css">
  <link rel="stylesheet" href="../../css/utilities.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/modal-ui.css">
  <link rel="stylesheet" href="../../css/pages/style.css">

  <script src="../../js/vendor/jquery-3.7.1.min.js"></script>
  <script src="../../js/theme-control.js"></script>
  <script src="../../js/sidebar.js" defer></script>
  <script src="../../js/header.js" defer></script>

  <script>
    window.activeSidebar = 'officer_logbook';
    window.activePage = 'off_typeofjob_report';
  </script>
</head>
<body class="dashboard-body plant-page">
  <div class="sidebar-container"></div>

  <main class="main-wrapper plant-page__main">
    <div id="header-container" data-title="Type Of Job Report" data-breadcrumb="Officer Logbook:index.html,Plant Detail:plant_detail.html,Type Of Job Report:active" data-back="plant_detail.html"></div>

    <div class="assign-content p-24px custom-scroll">
      <div class="assign-full-container flex flex-col gap-16px mx-auto">
        
        <!-- Filter Card -->
        <div class="assign-form-card">
          <div class="assign-form-header flex justify-between items-center">
            <div class="flex items-center gap-8px">
              <i class="ph-duotone ph-funnel color-blue font-16px"></i>
              <span class="fw-700 color-primary font-14px uppercase">FILTER CRITERIA</span>
            </div>
            <div class="fw-700 color-blue font-16px uppercase">
              PLANT: BOILER
            </div>
          </div>

          <div class="form-grid grid-cols-12 p-16px gap-24px">
            <div class="form-field-wrapper col-span-4">
              <label class="assign-field-label">START DATE</label>
              <input type="date" class="gnfc-modal-input w-full" value="2026-05-23">
            </div>
            
            <div class="form-field-wrapper col-span-4">
              <label class="assign-field-label">END DATE</label>
              <input type="date" class="gnfc-modal-input w-full" value="2026-06-23">
            </div>

            <div class="form-field-wrapper col-span-4">
              <label class="assign-field-label">SELECT TYPE OF JOB :</label>
              <select class="gnfc-modal-input w-full">
                <option value="ALL">ALL</option>
                <option value="DOCUMENTATION">DOCUMENTATION</option>
                <option value="HOUSE KEEPING">HOUSE KEEPING</option>
                <option value="ABNORMALITY">ABNORMALITY</option>
                <option value="MODIFICATION">MODIFICATION</option>
                <option value="ISO14000">ISO14000</option>
                <option value="JOB REVIEW">JOB REVIEW</option>
                <option value="EMAIL AND LOGBOOK REVIEW">EMAIL AND LOGBOOK REVIEW</option>
                <option value="JOB DISTRIBUTION">JOB DISTRIBUTION</option>
                <option value="CONFIGURATION">CONFIGURATION</option>
                <option value="MEETING">MEETING</option>
                <option value="DETAIL ENGINEERING">DETAIL ENGINEERING</option>
                <option value="VENDOR FOLLOWUP">VENDOR FOLLOWUP</option>
                <option value="TRAINING">TRAINING</option>
                <option value="HAZOP">HAZOP</option>
                <option value="PROCUREMENT">PROCUREMENT</option>
                <option value="INSPECTION">INSPECTION</option>
                <option value="FIELD ROUND">FIELD ROUND</option>
                <option value="CASH PURCHASE">CASH PURCHASE</option>
                <option value="MAINTENANCE">MAINTENANCE</option>
                <option value="N.A.">N.A.</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Report Table Card -->
        <div class="assign-form-card">
          <div class="assign-form-header justify-center" style="text-align: center;">
            <span class="fw-700 color-primary font-16px uppercase" style="color: #000;">Type OF Job Report</span>
          </div>

          <div class="user-table-wrapper">
            <table class="user-table w-full">
              <thead>
                <!-- Row 1 of Header -->
                <tr>
                  <th rowspan="2" class="user-table-center w-50px">Sr</th>
                  <th class="user-table-center w-80px">Shift</th>
                  <th class="user-table-center w-120px">TagNo</th>
                  <th rowspan="2" class="user-table-center">Description</th>
                  <th class="user-table-center w-100px">Off. Name</th>
                  <th rowspan="2" class="user-table-center w-80px">Status</th>
                  <th rowspan="2" class="user-table-center w-150px">Remarks</th>
                </tr>
                <!-- Row 2 of Header -->
                <tr>
                  <th class="user-table-center">Time</th>
                  <th class="user-table-center">TypeOfJob</th>
                  <th class="user-table-center">Tech</th>
                </tr>
              </thead>
              <tbody class="user-table-center">
                <!-- Example Empty Row -->
                <tr>
                  <td colspan="7" class="py-24px color-hint font-14px text-center">No records found for selected type of job.</td>
                </tr>
              </tbody>
            </table>
          </div>
          
        </div>

      </div>
    </div>
  </main>
</body>
</html>
