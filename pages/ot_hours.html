<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OT Hours Report | GNFC</title>
  <meta name="description" content="GNFC OT Hours Report - Acetic Acid Logbook">

  <!-- CSS -->
  <link rel="stylesheet" href="../css/phosphor.css">
  <link rel="stylesheet" href="../css/theme-vars.css">
  <link rel="stylesheet" href="../css/utilities.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/modal-ui.css">
  <link rel="stylesheet" href="../css/pages/style.css">

  <!-- JS Vendors -->
  <script src="../js/vendor/jquery-3.7.1.min.js"></script>
  <script src="../js/theme-control.js"></script>
  <script src="../js/sidebar.js" defer></script>
  <script src="../js/header.js" defer></script>
  <script src="../js/plant-nav.js" defer></script>

  <script>
    window.activePage = 'ot_hours';
  </script>

</head>

<body class="dashboard-body">

  <!-- Sidebar -->
  <div class="sidebar-container"></div>

  <!-- Main -->
  <main class="main-wrapper">

    <!-- Header -->
    <div id="header-container" data-title="Acetic Acid Logbook" data-back="plant_detail.html"></div>

    <!-- Page Content -->
    <section class="dashboard-content jt-page-content">

      <!-- Plant Navigation -->
      <div id="plant-nav-container"></div>

      <!-- ── FILTER CARD ── -->
      <div class="jt-filter-card">
        <div class="jt-filter-header">
          <h3 class="jt-filter-title">
            <i class="ph-bold ph-clock"></i>
            OT Report Criteria
          </h3>
        </div>

        <div class="jt-filter-body" style="grid-template-columns: repeat(4, 1fr);">
          <!-- Start Date -->
          <div class="jt-filter-group">
            <label class="jt-filter-label" for="startDate">Start Date</label>
            <input type="date" id="startDate" class="jt-input jt-date-input" value="2026-02-01" onchange="renderTable()">
          </div>

          <!-- End Date -->
          <div class="jt-filter-group">
            <label class="jt-filter-label" for="endDate">End Date</label>
            <input type="date" id="endDate" class="jt-input jt-date-input" value="2026-02-28" onchange="renderTable()">
          </div>

          <!-- Select Name -->
          <div class="jt-filter-group">
            <label class="jt-filter-label" for="techSelect">Select Name</label>
            <div class="jt-select-wrap">
              <select id="techSelect" class="jt-select" onchange="renderTable()">
                <option value="ALL">ALL</option>
                <option value="DVP">DVP</option>
                <option value="JKP">JKP</option>
                <option value="RKM">RKM</option>
                <option value="NND">NND</option>
              </select>
              <i class="ph-bold ph-caret-down jt-select-caret"></i>
            </div>
          </div>

          <!-- Action -->
          <div class="jt-filter-group" style="justify-content: flex-end;">
            <button type="button" class="jt-btn-primary" onclick="renderTable()" style="width: 100%;">
              <i class="ph-bold ph-lightning"></i> GENERATE REPORT
            </button>
          </div>
        </div>
      </div>
      <!-- /FILTER CARD -->

      <!-- ── TABLE CARD ── -->
        <div class="user-table-toolbar">
          <div class="user-table-toolbar-left">
            <h3 class="user-table-title">
              <i class="ph-fill ph-file-text"></i>
              Report Data
            </h3>
          </div>
          <div class="user-table-toolbar-right">
            <span class="user-table-info" id="totalHoursIndicator">Total Hours: 0</span>
          </div>
        </div>

        <div class="user-table-wrapper">
          <table class="user-table" id="ot-main-table" style="min-width: 1000px;">
            <thead>
              <tr>
                <th class="user-table-center" style="width: 120px;">Date</th>
                <th class="user-table-center" style="width: 100px;">Tech</th>
                <th class="user-table-center" style="width: 150px;">Tag No</th>
                <th class="user-table-center" style="width: 150px;">Type Of Job</th>
                <th style="min-width: 400px;">Description</th>
                <th class="user-table-center" style="width: 80px;">OT Hour</th>
              </tr>
            </thead>
            <tbody id="reportTableBody">
            </tbody>
          </table>
        </div>
      <!-- /TABLE CARD -->

    </section>
  </main>

  <script>
    // Sample Data
    var dataset = [
      { date: '2026-02-04', tech: 'DVP', tag: 'DCS-YOKOGAWA', jobType: 'PM', desc: 'C/r ESD console-32 checked all switch resistance and defective micro switch as per availability and requirement replaced (resistance noted down). Also PVC truff provided for cable support. For console-32 job completed. For 2 more console job started and job u/p.', hours: 7.0 },
      { date: '2026-02-05', tech: 'JKP', tag: 'FV-101', jobType: 'BD', desc: 'Valve stuck at 50%. Free movement checked. Positioner calibration done. Found OK.', hours: 2.5 },
      { date: '2026-02-06', tech: 'RKM', tag: 'PT-202', jobType: 'PM', desc: 'Routine preventative maintenance check. Transmitter zero check done. Connections tightened.', hours: 1.5 },
      { date: '2026-02-08', tech: 'DVP', tag: 'DCS-FOXBORO', jobType: 'PM', desc: 'System health check up. Backup of configuration files initiated.', hours: 4.0 },
      { date: '2026-02-08', tech: 'NND', tag: 'HV-303', jobType: 'CM', desc: 'Leakage attended. Gland packing replaced. Stroke check done from field and DCS.', hours: 3.0 }
    ];

    function renderTable() {
      var tbody = document.getElementById('reportTableBody');
      var techFilter = document.getElementById('techSelect').value;
      var startVal = document.getElementById('startDate').value;
      var endVal = document.getElementById('endDate').value;
      var totalHoursEl = document.getElementById('totalHoursIndicator');

      tbody.innerHTML = '';
      var total = 0;
      var hasData = false;

      // Use standard for loop (no filter/map/forEach)
      for (var i = 0; i < dataset.length; i++) {
        var item = dataset[i];
        var show = true;

        // Tech Filter
        if (techFilter !== 'ALL' && item.tech !== techFilter) {
          show = false;
        }

        // Date Filter
        if (show && (startVal || endVal)) {
          var itemDate = new Date(item.date);
          if (startVal) {
            var start = new Date(startVal);
            start.setHours(0, 0, 0, 0);
            if (itemDate < start) show = false;
          }
          if (show && endVal) {
            var end = new Date(endVal);
            end.setHours(23, 59, 59, 999);
            if (itemDate > end) show = false;
          }
        }

        if (show) {
          hasData = true;
          total += item.hours;
          var rowHtml = '<tr class="user-table-row">' +
            '<td class="user-table-center user-table-secondary">' + formatDateDisplay(item.date) + '</td>' +
            '<td class="user-table-center user-table-bold user-table-blue">' + item.tech + '</td>' +
            '<td class="user-table-center user-table-secondary">' + item.tag + '</td>' +
            '<td class="user-table-center user-table-bold user-table-orange" style="font-size: 0.75rem;">' + item.jobType + '</td>' +
            '<td class="user-table-primary" style="line-height: 1.5; font-size: 0.8125rem;">' + item.desc + '</td>' +
            '<td class="user-table-center user-table-bold user-table-primary">' + item.hours.toFixed(1) + '</td>' +
            '</tr>';
          tbody.innerHTML += rowHtml;
        }
      }

      if (!hasData) {
        tbody.innerHTML = '<tr class="jt-empty-row"><td colspan="6">No records found for selected criteria</td></tr>';
      }

      totalHoursEl.textContent = 'Total Hours: ' + total.toFixed(1);
    }

    function formatDateDisplay(isoDate) {
      if (!isoDate) return '';
      var d = new Date(isoDate);
      var day = String(d.getDate()).padStart(2, '0');
      var month = String(d.getMonth() + 1).padStart(2, '0');
      var year = d.getFullYear();
      return day + '/' + month + '/' + year;
    }

    // Initial load
    document.addEventListener('DOMContentLoaded', function() {
      renderTable();
    });
  </script>

</body>

</html>
