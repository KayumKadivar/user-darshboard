<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boiler Dashboard | GNFC</title>
    <link rel="stylesheet" href="../../css/phosphor.css">
    <link rel="stylesheet" href="../../css/theme-vars.css">
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/pages/style.css">
    <link rel="stylesheet" href="../../css/pages/plant.css">
    <link rel="stylesheet" href="../../css/utilities.css">

    <script src="../../js/vendor/jquery-3.7.1.min.js"></script>
    <script src="../../js/theme-control.js"></script>
    <script src="../../js/sidebar.js" defer></script>
    <script src="../../js/header.js" defer></script>

    <script>window.activePage = 'plants';</script>
</head>

<body class="dashboard-body">

    <div class="sidebar-container"></div>

    <main class="main-wrapper">

        <div id="header-container" data-title="Boiler Dashboard" data-back="plant.html"></div>

        <div class="dashboard-content dashboard-scroll">

            <!-- ─── Unified Header Card (Matching Image) ─── -->
            <div class="boiler-header-card">
                <div class="boiler-user-info">
                    <div class="boiler-user-avatar">
                        <i class="ph-fill ph-user-circle"></i>
                    </div>
                    <div class="boiler-user-text">
                        <span class="welcome-back">Welcome Back</span>
                        <h2 class="user-role">Engineer</h2>
                    </div>
                </div>

                <div class="boiler-area-filter">
                    <span class="boiler-area-label">Area :</span>
                    <select class="boiler-area-select" id="boiler-area-dropdown">
                        <option value="ALL">ALL</option>
                        <option value="BOILER-1">BOILER-1</option>
                        <option value="BOILER-2">BOILER-2</option>
                        <option value="BOILER-3">BOILER-3</option>
                        <option value="BOILER-4">BOILER-4</option>
                    </select>
                </div>
            </div>

            <!-- ─── Actions Grid (2-Column Match) ─── -->
            <div class="boiler-action-grid">
                <a href="boiler_inst_data.html" class="boiler-action-card">
                    <div class="boiler-action-icon"><i class="ph-fill ph-database"></i></div>
                    <span class="boiler-action-label">Inst Data</span>
                </a>
                
                <a href="boiler_loop_data.html" class="boiler-action-card">
                    <div class="boiler-action-icon"><i class="ph-fill ph-arrows-clockwise"></i></div>
                    <span class="boiler-action-label">Loop Data</span>
                </a>

                <a href="#" class="boiler-action-card">
                    <div class="boiler-action-icon"><i class="ph-fill ph-wrench"></i></div>
                    <span class="boiler-action-label">PM Master</span>
                </a>

                <a href="#" class="boiler-action-card">
                    <div class="boiler-action-icon"><i class="ph-fill ph-tree-structure"></i></div>
                    <span class="boiler-action-label">Logic Diagram</span>
                </a>

                <a href="#" class="boiler-action-card">
                    <div class="boiler-action-icon"><i class="ph-fill ph-list-dashes"></i></div>
                    <span class="boiler-action-label">Junction Box Detail</span>
                </a>

                <a href="#" class="boiler-action-card">
                    <div class="boiler-action-icon"><i class="ph-fill ph-folder-open"></i></div>
                    <span class="boiler-action-label">Document Management System</span>
                </a>

                <a href="#" class="boiler-action-card">
                    <div class="boiler-action-icon"><i class="ph-fill ph-clock-counter-clockwise"></i></div>
                    <span class="boiler-action-label">General Job History</span>
                </a>

                <a href="#" class="boiler-action-card">
                    <div class="boiler-action-icon"><i class="ph-fill ph-warning-circle"></i></div>
                    <span class="boiler-action-label">Alarm Trip Setting Report</span>
                </a>

                <a href="#" class="boiler-action-card">
                    <div class="boiler-action-icon"><i class="ph-fill ph-desktop"></i></div>
                    <span class="boiler-action-label">System Job History</span>
                </a>

                <a href="#" class="boiler-action-card">
                    <div class="boiler-action-icon"><i class="ph-fill ph-calendar-plus"></i></div>
                    <span class="boiler-action-label">Mail Scheduler</span>
                </a>

                <a href="#" class="boiler-action-card boiler-full-width">
                    <div class="boiler-action-icon"><i class="ph-fill ph-file-dashed"></i></div>
                    <span class="boiler-action-label">Circular Log File</span>
                </a>
            </div>

        </div>
    </main>

    <script>
        $(document).ready(function() {
            const $areaDropdown = $('#boiler-area-dropdown');
            const savedArea = localStorage.getItem('gnfc_selected_area');
            if(savedArea) $areaDropdown.val(savedArea);

            $areaDropdown.on('change', function() {
                localStorage.setItem('gnfc_selected_area', $(this).val());
            });
        });
    </script>
</body>

</html>
