<body class="dashboard-body">

    <main class="main-wrapper">

        <div id="header-container" data-title="Instrument Data" data-breadcrumb="Plant:plant.html,Boiler:boiler_dashboard.html,Inst Data:active" data-back="boiler_dashboard.html"></div>

        <div class="dashboard-content dashboard-scroll">

                            <div><label class="input-label">CalPrim</label><input type="text" id="f-pe_calc" class="gnfc-modal-input" readonly></div>

                    <!-- ─── Secondary Element ─── -->

                            <div><label class="input-label">DrgSec</label><input type="text" id="f-se_drawing" class="gnfc-modal-input" readonly></div>

                            <div><label class="input-label">Spec</label><input type="text" id="f-se_datasheet" class="gnfc-modal-input" readonly></div>

                    <!-- ─── Metadata ─── -->

                            <div><label class="input-label">Ec No</label><input type="text" id="f-ecno" class="gnfc-modal-input" readonly></div>
                        </div>

    <script>
        $(document).ready(function() {
            // --- Elements ---
            const $searchInput = $('#tag-search-input');
            const $tagSelect = $('#tag-select-dropdown');
            const $areaDropdown = $('#boiler-area-dropdown');
            
            const $viewForm = $('#view-mode-form');
            const $scrollContainer = $('.dashboard-scroll');

            // --- Area Persistence Sync ---
            const savedArea = localStorage.getItem('gnfc_selected_area');
            if(savedArea) $areaDropdown.val(savedArea);

            $areaDropdown.on('change', function() {
                localStorage.setItem('gnfc_selected_area', $(this).val());
            });

            // --- Smart Tag Autocomplete Helper ---
            function initTagAutocomplete(inputSelector, selectSelector, onMatch) {
              const $input = $(inputSelector);
              const $select = $(selectSelector);
              let snapBackTimeout = null;
              let snapBackInterval = null;
              let isAutoRemoving = false;

              function getAvailableTags() {
                let tags = [];
                $select.find('option').each(function () {
                  if ($(this).val()) tags.push($(this).val());
                });
                return tags;
              }

              function stopAutoRemove() {
                clearTimeout(snapBackTimeout);
                clearInterval(snapBackInterval);
                isAutoRemoving = false;
              }

              const tags = getAvailableTags();

              $input.on('input', function (e) {
                const cursorStart = this.selectionStart;
                const cursorEnd = this.selectionEnd;
                const rawVal = $(this).val();
                const upperVal = rawVal.toUpperCase();
                if (rawVal !== upperVal) {
                  $(this).val(upperVal);
                  this.setSelectionRange(cursorStart, cursorEnd);
                }

                const inputType = e.originalEvent ? e.originalEvent.inputType : '';
                const isDeleting = inputType && inputType.startsWith('delete');

                if (isDeleting) stopAutoRemove();

                let inputVal = $(this).val().toUpperCase();

                if (isDeleting) {
                  let hasMatch = inputVal.length === 0 || tags.some(tag => tag.toUpperCase().startsWith(inputVal));
                  if (hasMatch) $(this).removeClass('is-invalid-tag');
                  else $(this).addClass('is-invalid-tag');

                  let exactMatch = tags.find(tag => tag.toUpperCase() === inputVal);
                  $select.val(exactMatch || '');
                  if (onMatch) onMatch(exactMatch || '');
                  return;
                }

                let longestValidPrefix = "";
                for (let i = inputVal.length; i >= 0; i--) {
                  let sub = inputVal.substring(0, i);
                  if (tags.some(tag => tag.toUpperCase().startsWith(sub))) {
                    longestValidPrefix = sub;
                    break;
                  }
                }

                if (inputVal.length > longestValidPrefix.length + 3) {
                  inputVal = inputVal.substring(0, longestValidPrefix.length + 3);
                  $(this).val(inputVal);
                }

                if (inputVal.length > longestValidPrefix.length) {
                  $(this).addClass('is-invalid-tag');
                  $select.val('');
                  if (onMatch) onMatch('');
                  stopAutoRemove();

                  const self = this;
                  const targetPrefix = longestValidPrefix;
                  snapBackTimeout = setTimeout(() => {
                    isAutoRemoving = true;
                    snapBackInterval = setInterval(() => {
                      let currentVal = $input.val();
                      if (currentVal.length > targetPrefix.length) {
                        currentVal = currentVal.substring(0, currentVal.length - 1);
                        $input.val(currentVal);
                      } else {
                        clearInterval(snapBackInterval);
                        isAutoRemoving = false;
                        $input.removeClass('is-invalid-tag');
                        let val = $input.val().toUpperCase();
                        if (val.length > 0) {
                          let firstMatch = tags.find(tag => tag.toUpperCase().startsWith(val));
                          if (firstMatch) {
                            $input.val(firstMatch);
                            self.setSelectionRange(val.length, firstMatch.length);
                            $select.val(firstMatch);
                            if (onMatch) onMatch(firstMatch);
                          }
                        } else {
                          $select.val('');
                          if (onMatch) onMatch('');
                        }
                      }
                    }, 150);
                  }, 800);
                  return;
                }

                stopAutoRemove();
                $(this).removeClass('is-invalid-tag');

                if (inputVal.length > 0) {
                  let firstMatch = tags.find(tag => tag.toUpperCase().startsWith(inputVal));
                  if (firstMatch) {
                    $(this).val(firstMatch);
                    this.setSelectionRange(inputVal.length, firstMatch.length);
                    $select.val(firstMatch);
                    if (onMatch) onMatch(firstMatch);
                  }
                } else {
                  $select.val('');
                  if (onMatch) onMatch('');
                }
              });

              $input.on('keydown', function (e) {
                if (isAutoRemoving && e.key !== 'Enter') stopAutoRemove();
                if (e.key === 'Enter') {
                  stopAutoRemove();
                  const currentVal = $(this).val();
                  if (currentVal && !$(this).hasClass('is-invalid-tag')) {
                    e.preventDefault();
                    $(this).val(currentVal);
                    this.setSelectionRange(currentVal.length, currentVal.length);
                    $(this).addClass('tag-confirmed');
                    setTimeout(() => $(this).removeClass('tag-confirmed'), 500);
                  }
                }
              });

              $select.on('change', function () {
                stopAutoRemove();
                let val = $(this).val();
                $input.val(val);
                if (onMatch) onMatch(val);
              });
            }

            // Initialize Tag search
            initTagAutocomplete('#tag-search-input', '#tag-select-dropdown', (val) => {
                if(val) loadTagData(val);
                else cancelForm();
            });

            // --- Form Handlers ---
            function loadTagData(tagId) {
                $viewForm.removeClass('hidden');
                $('#f-tag_no').val(tagId);
                $scrollContainer.scrollTop(0);
            }

            function cancelForm() {
                $viewForm.addClass('hidden');
                $scrollContainer.scrollTop(0);
            }

            function deleteTag() {
                const tag = $('#f-tag_no').val();
                if(!tag) {
                    Swal.fire({
                        title: 'Tag Not Selected',
                        text: 'First Search or Find a Tag No, then click Delete.',
                        icon: 'warning',
                        confirmButtonColor: '#2563eb',
                        confirmButtonText: 'OK'
                    });
                    return;
                }
                Swal.fire({
                    title: 'Are you sure to delete this tag?',
                    html: `Delete tag <b style="color:#ef4444">${tag}</b>?`,
                    icon: 'warning', 
                    showCancelButton: true, 
                    confirmButtonColor: '#ef4444', 
                    confirmButtonText: 'Yes, Delete',
                    cancelButtonText: 'Cancel'
                }).then(r => {
                    if(r.isConfirmed) {
                        $('#f-tag_no').val('');
                        $searchInput.val('');
                        $tagSelect.val('');
                        cancelForm();
                        Swal.fire({ 
                            icon:'success', 
                            title:'Deleted!', 
                            text: `Tag ${tag} has been Deleted.`,
                            timer:1500, 
                            showConfirmButton:false 
                        });
                    }
                });
            }

            // --- Event Bindings ---
            $('#btn-job-history').on('click', () => {
                const tag = $('#f-tag_no').val();
                if(!tag) {
                    Swal.fire({
                        title: 'Tag Not Selected',
                        text: 'First Search or Find a Tag No, then click Job History.',
                        icon: 'warning',
                        confirmButtonColor: '#2563eb',
                        confirmButtonText: 'OK'
                    });
                    return;
                }
                window.location.href = 'boiler_job_history.html';
            });

            $('#btn-jb-detail').on('click', () => window.location.href = 'boiler_jb_detail.html');
            $('#btn-add').on('click', () => window.location.href = 'boiler_inst_data_add.html');
            $('#btn-edit').on('click', () => {
                const tag = $('#f-tag_no').val();
                if(!tag) {
                    Swal.fire({
                        title: 'Tag Not Selected',
                        text: 'First Search or Find a Tag No, then click Edit.',
                        icon: 'warning',
                        confirmButtonColor: '#2563eb',
                        confirmButtonText: 'OK'
                    });
                    return;
                }
                window.location.href = 'boiler_inst_data_edit.html';
            });
            $('#btn-delete').on('click', deleteTag);
            $('#btn-loop-data').on('click', () => window.location.href='boiler_loop_data.html');
            $('#btn-search-tag').on('click', () => window.location.href='boiler_search_tag.html');
        });
    </script>
</body>
