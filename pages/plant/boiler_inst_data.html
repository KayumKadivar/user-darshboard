<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instrument Data | GNFC</title>
    <link rel="stylesheet" href="../../css/phosphor.css">
    <link rel="stylesheet" href="../../css/theme-vars.css">
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/pages/style.css">
    <link rel="stylesheet" href="../../css/pages/plant.css">
    <link rel="stylesheet" href="../../css/modal-ui.css">
    <link rel="stylesheet" href="../../css/utilities.css">

    <script src="../../js/vendor/jquery-3.7.1.min.js"></script>
    <script src="../../js/theme-control.js"></script>
    <script src="../../js/sidebar.js" defer></script>
    <script src="../../js/header.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>window.activePage = 'plants';</script>
</head>

<body class="dashboard-body">

    <div class="sidebar-container"></div>

    <main class="main-wrapper">

        <div id="header-container" data-title="Instrument Data" data-back="boiler_dashboard.html"></div>

        <div class="dashboard-content dashboard-scroll">
            <div>

                <!-- ─── Action Toolbar ─── -->
                <div class="action-toolbar">
                    <button class="toolbar-btn" id="btn-job-history">
                        <i class="ph-bold ph-clock-counter-clockwise"></i> Job History
                    </button>
                    <button class="toolbar-btn" id="btn-jb-detail">
                        <i class="ph-bold ph-list-dashes"></i> Junction Box Detail
                    </button>
                    
                    <div class="toolbar-vr"></div>
                    
                    <button class="toolbar-btn btn-emerald" id="btn-add">
                        <i class="ph-bold ph-plus"></i> Add
                    </button>
                    <button class="toolbar-btn btn-amber" id="btn-edit">
                        <i class="ph-bold ph-pencil-simple"></i> Edit
                    </button>
                    <button class="toolbar-btn btn-red" id="btn-delete">
                        <i class="ph-bold ph-trash"></i> Delete
                    </button>
                    
                    <div class="toolbar-vr"></div>
                    
                    <button class="toolbar-btn" id="btn-loop-data">
                        <i class="ph-bold ph-arrows-clockwise"></i> Loop Data
                    </button>
                    <button class="toolbar-btn" id="btn-search-tag">
                        <i class="ph-bold ph-magnifying-glass"></i> Search Tag
                    </button>
                </div>

                <!-- ─── Search & Filters ─── -->
                <div class="search-filter-area">
                    <div class="search-field-group" id="tag-search-container">
                        <label class="input-label">Find Tag No</label>
                        <div class="autocomplete-container">
                            <i class="ph-bold ph-magnifying-glass search-icon-inside"></i>
                            <input type="text" id="tag-search-input" class="input-control search-input-px" placeholder="Enter Tag No..." autocomplete="off">
                            <button id="tag-dropdown-btn" class="dropdown-trigger-btn">
                                <i class="ph-bold ph-caret-down"></i>
                            </button>
                        </div>
                        <!-- Dropdown List -->
                        <div id="tag-dropdown-list" class="autocomplete-list hidden">
                            <div class="autocomplete-item" data-tag="10-PT-101A">10-PT-101A</div>
                            <div class="autocomplete-item" data-tag="ZSH177906">ZSH177906</div>
                            <div class="autocomplete-item" data-tag="XLGDFGV1D">XLGDFGV1D</div>
                            <div class="autocomplete-item" data-tag="XV177901">XV177901</div>
                            <div class="autocomplete-item" data-tag="ZT177707A">ZT177707A</div>
                            <div class="autocomplete-item" data-tag="ZSL191801">ZSL191801</div>
                        </div>
                    </div>

                    <div class="w-200px">
                        <label class="input-label">Area</label>
                        <div id="area-display" class="input-control flex align-anchor-center">ALL</div>
                    </div>
                </div>

                <!-- ─── Main Form Area (Hidden by Default) ─── -->
                <div id="view-mode-form" class="inst-data-view-wrapper hidden">
                    <!-- General Information -->
                    <div class="form-section">
                        <div class="section-title"><i class="ph-fill ph-tag"></i> General Information</div>
                        <div class="form-grid grid-cols-5">
                            <div>
                                <label class="input-label">Tag No</label>
                                <input type="text" id="f-tag_no" class="input-control " value="" readonly>
                            </div>
                            <div class="col-span-2">
                                <label class="input-label">Description</label>
                                <input type="text" id="f-description" class="input-control " value="" readonly>
                            </div>
                            <div>
                                <label class="input-label">Host</label>
                                <input type="text" id="f-host" class="input-control " value="" readonly>
                            </div>
                        </div>
                    </div>

                    <div class="dashboard-grid">
                        <!-- Controller & IO Module -->
                        <div class="form-section">
                            <div class="section-title"><i class="ph-fill ph-cpu"></i> Controller & IO Module</div>
                            <div class="form-grid grid-cols-2">
                                <div><label class="input-label">Controller Type</label><input type="text" id="f-ctrl_type" class="input-control " value="DPU 4F" readonly></div>
                                <div><label class="input-label">Controller No</label><input type="text" id="f-ctrl_no" class="input-control" value="GN01" readonly></div>
                            </div>
                            <div class="form-grid grid-cols-3">
                                <div><label class="input-label">IO Type</label><input type="text" id="f-io_type" class="input-control" value="IQF304 (CH:16)" readonly></div>
                                <div><label class="input-label">SW ID</label><input type="text" id="f-sw_id" class="input-control" value="F2M5" readonly></div>
                                <div><label class="input-label">Location</label><input type="text" id="f-io_loc" class="input-control" value="R3M5" readonly></div>
                            </div>
                        </div>
                        <!-- Calibration & Range -->
                        <div class="form-section">
                            <div class="section-title"><i class="ph-fill ph-sliders-horizontal"></i> Calibration & Range</div>
                            <div class="form-grid grid-cols-2">
                                <div><label class="input-label">CH</label><input type="text" id="f-CH" class="input-control " value="9" readonly></div>
                                <div><label class="input-label">ESD Sheet</label><input type="text" id="f-esd" class="input-control" value="ESD-04" readonly></div>
                                <div><label class="input-label">Eng Range</label><input type="text" id="f-eng_range" class="input-control" value="" readonly></div>
                                <div><label class="input-label">Cal Range</label><input type="text" id="f-cal_range" class="input-control" value="" readonly></div>
                            </div>
                        </div>
                    </div>

                    <div class="dashboard-grid">
                        <!-- Trip Settings -->
                        <div class="form-section">
                            <div class="section-title"><i class="ph-fill ph-warning-circle"></i> Trip Settings</div>
                            <div class="form-grid grid-cols-2">
                                <div><label class="input-label">Trip H/HH</label><input type="text" id="f-trip_h" class="input-control" value="" readonly></div>
                                <div><label class="input-label">Function</label><input type="text" id="f-func_h" class="input-control" value="" readonly></div>
                                <div><label class="input-label">Trip L/LL</label><input type="text" id="f-trip_l" class="input-control" value="" readonly></div>
                                <div><label class="input-label">Function</label><input type="text" id="f-func_l" class="input-control" value="" readonly></div>
                            </div>
                        </div>
                        <!-- Specifications -->
                        <div class="form-section">
                            <div class="section-title"><i class="ph-fill ph-wrench"></i> Specifications</div>
                            <div class="form-grid grid-cols-3">
                                <div><label class="input-label">Loop Function</label><input type="text" id="f-loop_func" class="input-control " value="BLOCK VALVE POSITION" readonly></div>
                                <div><label class="input-label">Inst Type</label><input type="text" id="f-inst_type" class="input-control " value="SWITCH" readonly></div>
                                <div><label class="input-label">Make</label><input type="text" id="f-make" class="input-control " value="MAGO" readonly></div>
                                <div><label class="input-label">Model</label><input type="text" id="f-model" class="input-control " value="LS06200" readonly></div>
                                <div><label class="input-label">SRNO</label><input type="text" id="f-srno" class="input-control " value="12345" readonly></div>
                                <div><label class="input-label">Location</label><input type="text" id="f-location" class="input-control " value="FIELD" readonly></div>
                            </div>
                        </div>
                    </div>

                    <div class="dashboard-grid">
                        <!-- Primary Element -->
                        <div class="form-section">
                            <div class="section-title"><i class="ph-fill ph-atom"></i> Primary Element</div>
                            <div class="form-grid grid-cols-5">
                                <div><label class="input-label">Data Sheet</label><input type="text" id="f-pe_datasheet" class="input-control" value="" readonly></div>
                                <div><label class="input-label">Calculation</label><input type="text" id="f-pe_calc" class="input-control" value="" readonly></div>
                                <div><label class="input-label">Drawing</label><input type="text" id="f-pe_drawing" class="input-control" value="" readonly></div>
                                <div><label class="input-label">Cal. Report</label><input type="text" id="f-pe_calreport" class="input-control" value="" readonly></div>
                                <div><label class="input-label">Insp. Report</label><input type="text" id="f-pe_inspreport" class="input-control" value="" readonly></div>
                            </div>
                        </div>
                        <!-- Other Links -->
                        <div class="form-section">
                            <div class="section-title"><i class="ph-fill ph-link"></i> Other Links</div>
                            <div class="form-grid grid-cols-3">
                                <div><label class="input-label">Logic</label><input type="text" id="f-logic" class="input-control" value="" readonly></div>
                                <div><label class="input-label">Loop Sheet</label><input type="text" id="f-loop_sheet" class="input-control" value="" readonly></div>
                                <div><label class="input-label">Helping Hand</label><input type="text" id="f-helping" class="input-control" value="" readonly></div>
                            </div>
                        </div>
                    </div>

                    <div class="dashboard-grid">
                        <!-- Secondary Element -->
                        <div class="form-section">
                            <div class="section-title"><i class="ph-fill ph-stack"></i> Secondary Element</div>
                            <div class="form-grid grid-cols-5">
                                <div><label class="input-label">Calculations</label><input type="text" id="f-se_calc" class="input-control" value="" readonly></div>
                                <div><label class="input-label">Drawing</label><input type="text" id="f-se_drawing" class="input-control" value="" readonly></div>
                                <div><label class="input-label">Insp. Report</label><input type="text" id="f-se_inspreport" class="input-control" value="" readonly></div>
                                <div><label class="input-label">Data Sheet</label><input type="text" id="f-se_datasheet" class="input-control" value="" readonly></div>
                                <div><label class="input-label">Accessory</label><input type="text" id="f-se_accessory" class="input-control" value="" readonly></div>
                            </div>
                        </div>
                        <!-- Damping -->
                        <div class="form-section">
                            <div class="section-title"><i class="ph-fill ph-gauge"></i> Damping</div>
                            <div class="form-grid grid-cols-5">
                                <div><label class="input-label">TX</label><input type="text" id="f-damp_tx" class="input-control" value="" readonly></div>
                                <div><label class="input-label">DCS</label><input type="text" id="f-damp_dcs" class="input-control" value="" readonly></div>
                                <div><label class="input-label">AFRSet</label><input type="text" id="f-afrset" class="input-control" value="" readonly></div>
                                <div><label class="input-label">Air Lock</label><input type="text" id="f-airlock" class="input-control" value="" readonly></div>
                                <div><label class="input-label">Other</label><input type="text" id="f-damp_other" class="input-control" value="" readonly></div>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <div class="section-title"><i class="ph-fill ph-files"></i> Additional Information</div>
                        <div class="form-grid grid-cols-5 mb-3">
                            <div><label class="input-label">Bypass Module</label><input type="text" id="f-bypass" class="input-control " value="YES" readonly></div>
                            <div><label class="input-label">Ref. No</label><input type="text" id="f-ref_no" class="input-control" readonly></div>
                            <div><label class="input-label">Meas. Tech</label><input type="text" id="f-meas_tech" class="input-control" readonly></div>
                            <div><label class="input-label">Ana. Working</label><input type="text" id="f-ana_working" class="input-control" readonly></div>
                            <div><label class="input-label">CPCB</label><input type="text" id="f-cpcb" class="input-control " value="NO" readonly></div>
                        </div>
                        <label class="input-label">Special Comment</label>
                        <textarea id="f-comment" class="input-control textarea-h-80" readonly></textarea>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script>
        $(document).ready(function() {
            // --- Elements ---
            const $searchInput = $('#tag-search-input');
            const $dropdownBtn = $('#tag-dropdown-btn');
            const $dropdownList = $('#tag-dropdown-list');
            const $tagItems = $('.autocomplete-item');
            
            const $viewForm = $('#view-mode-form');
            const $editForm = $('#edit-mode-form');
            const $scrollContainer = $('.dashboard-scroll');
            const $areaDisplay = $('#area-display');

            // --- Area Persistence Sync ---
            const savedArea = localStorage.getItem('gnfc_selected_area');
            if(savedArea) $areaDisplay.text(savedArea);


            // --- Dropdown Logic ---
            function syncDropdownIcon() {
                const isHidden = $dropdownList.hasClass('hidden');
                $dropdownBtn.find('i').toggleClass('ph-caret-down', isHidden).toggleClass('ph-caret-up', !isHidden);
            }

            function renderDropdown(filter) {
                const f = (filter || "").toLowerCase();
                let count = 0;
                
                $tagItems.each(function() {
                    const tag = $(this).data('tag').toLowerCase();
                    if (tag.includes(f)) {
                        $(this).show();
                        count++;
                    } else {
                        $(this).hide();
                    }
                });

                if (count === 0) $dropdownList.addClass('hidden');
                else $dropdownList.removeClass('hidden');

                syncDropdownIcon();
            }

            $tagItems.on('click', function() {
                const tag = $(this).data('tag');
                $searchInput.val(tag);
                $dropdownList.addClass('hidden');
                syncDropdownIcon();
                loadTagData(tag);
            });

            $searchInput.on('input', function() { 
                $dropdownList.removeClass('hidden'); 
                renderDropdown($(this).val()); 
            }).on('focus', function() { 
                $dropdownList.removeClass('hidden'); 
                renderDropdown($(this).val()); 
            });

            $dropdownBtn.on('click', function(e) { 
                e.stopPropagation(); 
                $dropdownList.toggleClass('hidden'); 
                if(!$dropdownList.hasClass('hidden')) renderDropdown(""); 
                syncDropdownIcon();
            });

            $(document).on('click', function(e) { 
                if(!$(e.target).closest('#tag-search-container').length) {
                    $dropdownList.addClass('hidden'); 
                    syncDropdownIcon();
                }
            });

            // --- Form Handlers ---
            function loadTagData(tagId) {
                $viewForm.removeClass('hidden');
                $editForm.addClass('hidden');
                $('#f-tag_no').val(tagId);
                $scrollContainer.scrollTop(0);
            }

            function clearAllFields() {
                const mainFields = ['area', 'tag_no', 'description', 'host'];
                $.each(mainFields, function(i, k) {
                    $('#f-' + k + ', #ef-' + k).val('');
                });
            }

            function showEditForm() {
                const tag = $('#f-tag_no').val();
                if(!tag) {
                    Swal.fire({
                        title: 'Tag Not Selected',
                        text: 'First Search or Find a Tag No, then click Edit.',
                        icon: 'warning',
                        confirmButtonColor: '#2563eb',
                        confirmButtonText: 'OK'
                    });
                    return;
                }
                window.location.href = 'boiler_inst_data_edit.html';
            }


            function cancelForm() {
                $viewForm.addClass('hidden');
                $searchInput.val('');
                $scrollContainer.scrollTop(0);
            }

            function deleteTag() {
                const tag = $('#f-tag_no').val();
                if(!tag) {
                    Swal.fire({
                        title: 'Tag Not Selected',
                        text: 'First Search or Find a Tag No, then click Delete.',
                        icon: 'warning',
                        confirmButtonColor: '#2563eb',
                        confirmButtonText: 'OK'
                    });
                    return;
                }
                Swal.fire({
                    title: 'Are you sure to delete this tag?',
                    html: `Delete tag <b style="color:#ef4444">${tag}</b>?`,
                    icon: 'warning', 
                    showCancelButton: true, 
                    confirmButtonColor: '#ef4444', 
                    confirmButtonText: 'Yes, Delete',
                    cancelButtonText: 'Cancel'
                }).then(r => {
                    if(r.isConfirmed) {
                        $('#f-tag_no').val('');
                        clearAllFields();
                        cancelForm();
                        Swal.fire({ 
                            icon:'success', 
                            title:'Deleted!', 
                            text: `Tag ${tag} has been Deleted.`,
                            timer:1500, 
                            showConfirmButton:false 
                        });
                    }
                });
            }

            // --- Modal Handlers ---
            function openModal(id, tagSelector, subtitleId) {
                const tag = $('#f-tag_no').val() || 'BOILER PLANT';
                $(subtitleId).text(tag);
                $(id).addClass('is-open');
            }

            // --- Event Bindings ---
            $('#btn-job-history').on('click', () => {
                const tag = $('#f-tag_no').val();
                if(!tag) {
                    Swal.fire({
                        title: 'Tag Not Selected',
                        text: 'First Search or Find a Tag No, then click Job History.',
                        icon: 'warning',
                        confirmButtonColor: '#2563eb',
                        confirmButtonText: 'OK'
                    });
                    return;
                }
                window.location.href = 'boiler_job_history.html?tag=' + tag;
            });

            // $('#btn-jb-detail').on('click', () => openModal('#modal-jb-container', null, '#jb-modal-subtitle'));
            $('#btn-add').on('click', () => {
                window.location.href = 'boiler_inst_data_add.html';
            });
            $('#btn-edit').on('click', showEditForm);
            $('#btn-delete').on('click', deleteTag);

            $searchInput.on('keydown', function(e) {
                if(e.key === 'Enter') {
                    const val = $(this).val().trim();
                    if(val) loadTagData(val);
                }
            });
            $('#btn-save-record').hide();
            $('#btn-cancel-edit').hide();
            
            $('.j-close-modal').on('click', function() { $($(this).data('target')).removeClass('is-open'); });
            $('#btn-print-jh').on('click', () => window.print());

            
            $('#btn-loop-data').on('click', () => window.location.href='boiler_loop_data.html');
            $('#btn-search-tag').on('click', () => window.location.href='boiler_search_tag.html');

        });
    </script>
</body>
</html>
