<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Instrument | GNFC</title>
    <link rel="stylesheet" href="../../css/phosphor.css">
    <link rel="stylesheet" href="../../css/theme-vars.css">
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/pages/style.css">
    <link rel="stylesheet" href="../../css/pages/plant.css">
    <link rel="stylesheet" href="../../css/modal-ui.css">
    <link rel="stylesheet" href="../../css/utilities.css">


    <script src="../../js/vendor/jquery-3.7.1.min.js"></script>
    <script src="../../js/theme-control.js"></script>
    <script src="../../js/sidebar.js" defer></script>
    <script src="../../js/header.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>window.activePage = 'plants';</script>
</head>

<body class="dashboard-body">

    <div class="sidebar-container"></div>

    <main class="main-wrapper">

        <div id="header-container" data-title="Add New Instrument"
            data-breadcrumb="Plant:plant.html,Boiler:boiler_dashboard.html,Inst Data:boiler_inst_data.html,Add:active"
            data-back="boiler_inst_data.html"></div>

        <div class="dashboard-content dashboard-scroll">
            <div class="plant-container">

                <!-- ─── Add Mode Toolbar ─── -->
                <!-- <div class="user-toolbar mb-4">
                    <div class="user-toolbar-left">
                        <h2 class="section-title m-0"><i class="ph-bold ph-plus-circle color-emerald mr-2"></i> Create New Record</h2>
                    </div>
                    <div class="user-toolbar-right gap-12px">
                        <button class="btn btn-emerald h-40px px-24px" id="btn-save-new">
                            <i class="ph-bold ph-floppy-disk"></i> Save Instrument
                        </button>
                        <button class="btn btn-secondary h-40px px-24px" onclick="window.location.href='boiler_inst_data.html'">
                            <i class="ph-bold ph-x"></i> Cancel
                        </button>
                    </div>
                </div> -->

                <!-- ─── Main Entry Form ─── -->
                <div class="inst-data-view-wrapper">

                    <!-- ─── General Information ─── -->
                    <div class="form-section">
                        <div class="section-title"><i class="ph-fill ph-tag"></i> General Information</div>
                        <div class="form-grid grid-cols-4">
                            <div>
                                <label class="input-label">PLANT AREA</label>
                                <div class="gnfc-select-group">
                                    <select id="nf-area" class="gnfc-modal-input">
                                        <option>Select Area</option>
                                        <option>BOILER-1</option>
                                        <option>BOILER-2</option>
                                        <option>BOILER-3</option>
                                        <option>BOILER-4</option>
                                    </select>
                                    <i class="ph-bold ph-caret-down"></i>
                                </div>
                            </div>
                            <div>
                                <label class="input-label">TAG NO</label>
                                <input type="text" id="nf-tag_no" class="gnfc-modal-input" placeholder="Enter Tag No">
                            </div>
                            <div>
                                <label class="input-label">DESCRIPTION</label>
                                <input type="text" id="nf-description" class="gnfc-modal-input"
                                    placeholder="Instrument Description">
                            </div>
                            <div>
                                <label class="input-label">HOST</label>
                                <div class="gnfc-select-group">
                                    <select id="nf-host" class="gnfc-modal-input">
                                        <option>DCS</option>
                                        <option>PLC</option>
                                        <option>LOCAL</option>
                                    </select>
                                    <i class="ph-bold ph-caret-down"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ─── Controller & IO Module ─── -->
                    <div class="form-section">
                        <div class="section-title"><i class="ph-fill ph-cpu"></i> Controller & IO Module</div>
                        <div class="form-grid grid-cols-4">
                            <div><label class="input-label">CONTROLLER TYPE</label><input type="text" id="nf-ctrl_type"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">CONTROLLER NO</label><input type="text" id="nf-ctrl_no"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">IO MODULE NAME</label><input type="text"
                                    id="nf-io_module_name" class="gnfc-modal-input"></div>
                            <div><label class="input-label">IO MODULE LOCATION</label><input type="text" id="nf-io_loc"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">IO CHANNEL NO</label><input type="text"
                                    id="nf-io_channel_no" class="gnfc-modal-input"></div>
                            <div><label class="input-label">IO MODULE TYPE</label><input type="text" id="nf-io_type"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">ESD SHEET NO</label><input type="text" id="nf-esd"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">iolink</label><input type="text" id="nf-iolink"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">fimmodule</label><input type="text" id="nf-fimmodule"
                                    class="gnfc-modal-input"></div>
                        </div>
                    </div>

                    <div class="dashboard-grid">
                        <!-- ─── Calibration & Range ─── -->
                        <div class="form-section">
                            <div class="section-title"><i class="ph-fill ph-sliders-horizontal"></i> Calibration & Range
                            </div>
                            <div class="form-grid grid-cols-2">
                                <div><label class="input-label">CAL RANGE</label><input type="text" id="nf-cal_range"
                                        class="gnfc-modal-input"></div>
                                <div><label class="input-label">ENG RANGE</label><input type="text" id="nf-eng_range"
                                        class="gnfc-modal-input"></div>
                            </div>
                        </div>
                        <!-- ─── Trip Settings ─── -->
                        <div class="form-section">
                            <div class="section-title"><i class="ph-fill ph-warning-circle"></i> Trip Settings</div>
                            <div class="form-grid grid-cols-2">
                                <div><label class="input-label">TRIP L LL</label><input type="text" id="nf-trip_l"
                                        class="gnfc-modal-input"></div>
                                <div><label class="input-label">TRIP H HH</label><input type="text" id="nf-trip_h"
                                        class="gnfc-modal-input"></div>
                                <div><label class="input-label">FUNCTION L LL</label><input type="text" id="nf-func_l"
                                        class="gnfc-modal-input"></div>
                                <div><label class="input-label">FUNCTION H HH</label><input type="text" id="nf-func_h"
                                        class="gnfc-modal-input"></div>
                            </div>
                        </div>
                    </div>

                    <!-- ─── Specifications ─── -->
                    <div class="form-section">
                        <div class="section-title"><i class="ph-fill ph-wrench"></i> Specifications</div>
                        <div class="form-grid grid-cols-4">
                            <div><label class="input-label">INST TYPE</label>
                                <div class="gnfc-select-group">
                                    <select id="nf-inst_type" class="gnfc-modal-input">
                                        <option>Select Inst type</option>
                                        <option>ANALYZER</option>
                                        <option>SWITCH</option>
                                        <option>TRANSMITTER</option>
                                        <option>CONTROL VALVE</option>
                                        <option>RDV</option>
                                        <option>GUAGE</option>
                                    </select>
                                    <i class="ph-bold ph-caret-down"></i>
                                </div>
                            </div>
                            <div><label class="input-label">MAKE</label><input type="text" id="nf-make"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">model</label><input type="text" id="nf-model"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">srno</label><input type="text" id="nf-srno"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">LOCATION</label><input type="text" id="nf-location"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">LOOP FUNCTION</label><input type="text" id="nf-loop_func"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">DAMPTX</label><input type="text" id="nf-damp_tx"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">DAMPDCS</label><input type="text" id="nf-damp_dcs"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">AFRSET</label><input type="text" id="nf-afrset"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">AIRLOCK</label><input type="text" id="nf-airlock"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">OTHER</label><input type="text" id="nf-damp_other"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">barrier</label><input type="text" id="nf-barrier"
                                    class="gnfc-modal-input"></div>
                        </div>
                    </div>

                    <!-- ─── Primary Element ─── -->
                    <div class="form-section">
                        <div class="section-title"><i class="ph-fill ph-atom"></i> Primary Element</div>
                        <div class="form-grid grid-cols-4">
                            <div><label class="input-label">SPECPRIM</label><input type="text" id="nf-pe_datasheet"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">CALPRIM</label><input type="text" id="nf-pe_calc"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">DRGPRIM</label><input type="text" id="nf-pe_drawing"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">CALIPRIM</label><input type="text" id="nf-pe_calreport"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">INSPPRIM</label><input type="text" id="nf-pe_inspreport"
                                    class="gnfc-modal-input"></div>
                        </div>
                    </div>
                    <!-- ─── Secondary Element ─── -->
                    <div class="form-section">
                        <div class="section-title"><i class="ph-fill ph-stack"></i> Secondary Element</div>
                        <div class="form-grid grid-cols-4">
                            <div><label class="input-label">CALSEC</label><input type="text" id="nf-se_calc"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">DRGSEC</label><input type="text" id="nf-se_drawing"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">INSPSEC</label><input type="text" id="nf-se_inspreport"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">SPEC</label><input type="text" id="nf-se_datasheet"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">ACCESSORY</label><input type="text" id="nf-se_accessory"
                                    class="gnfc-modal-input"></div>
                        </div>
                    </div>
                    <div class="form-section">
                        <div class="section-title"><i class="ph-fill ph-link"></i> Other Links</div>
                        <div class="form-grid grid-cols-3">
                            <div><label class="input-label">LOGIC</label><input type="text" id="nf-logic"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">LOOPSHEET</label><input type="text" id="nf-loop_sheet"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">HHAND</label><input type="text" id="nf-helping"
                                    class="gnfc-modal-input"></div>
                        </div>
                    </div>
                    <!-- ─── Additional Information ─── -->
                    <div class="form-section">
                        <div class="section-title"><i class="ph-fill ph-files"></i> Additional Information</div>
                        <div class="form-grid grid-cols-4">
                            <div>
                                <label class="input-label">bypass</label>
                                <div class="gnfc-select-group">
                                    <select id="nf-bypass" class="gnfc-modal-input">
                                        <option>NO</option>
                                        <option>YES</option>
                                    </select>
                                    <i class="ph-bold ph-caret-down"></i>
                                </div>
                            </div>
                            <div>
                                <label class="input-label">cpcb</label>
                                <div class="gnfc-select-group">
                                    <select id="nf-cpcb" class="gnfc-modal-input">
                                        <option>NO</option>
                                        <option>YES</option>
                                    </select>
                                    <i class="ph-bold ph-caret-down"></i>
                                </div>
                            </div>
                            <div><label class="input-label">LOGBOOK</label><input type="text" id="nf-logbook"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">refno</label><input type="text" id="nf-ref_no"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">mt</label><input type="text" id="nf-meas_tech"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">working</label><input type="text" id="nf-ana_working"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">call tag</label><input type="text" id="nf-call_tag"
                                    class="gnfc-modal-input"></div>
                        </div>
                    </div>
                    <!-- </div> -->

                    <!-- ─── Metadata ─── -->
                    <div class="form-section">
                        <div class="section-title"><i class="ph-fill ph-info"></i> Metadata</div>
                        <div class="form-grid grid-cols-3">
                            <div><label class="input-label">by</label><input type="text" id="nf-by"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">date1</label><input type="date" id="nf-date1"
                                    class="gnfc-modal-input"></div>
                            <div><label class="input-label">ecno</label><input type="text" id="nf-ecno"
                                    class="gnfc-modal-input"></div>
                        </div>
                        <div class="mb-3">
                            <label class="input-label">SPECIAL COMMENT</label>
                            <textarea id="nf-comment" class="gnfc-modal-input textarea-h-80"
                                placeholder="Enter any additional observations..."></textarea>
                        </div>
                    </div>

                    <div class="action-toolbar mt-16px justify-end mb-0px">
                        <button class="toolbar-btn" onclick="window.location.href='boiler_inst_data.html'">
                            <i class="ph-bold ph-x"></i> Cancel
                        </button>
                        <button class="toolbar-btn btn-emerald" id="btn-save-bottom">
                            <i class="ph-bold ph-floppy-disk"></i> Save
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </main>
</body>

</html>
