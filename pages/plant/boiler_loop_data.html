<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loop Data | GNFC</title>
  <link rel="stylesheet" href="../../css/phosphor.css">
  <link rel="stylesheet" href="../../css/theme-vars.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/pages/style.css">
  <link rel="stylesheet" href="../../css/pages/plant.css">
  <link rel="stylesheet" href="../../css/modal-ui.css">
  <link rel="stylesheet" href="../../css/utilities.css">

  <script src="../../js/vendor/jquery-3.7.1.min.js"></script>
  <script src="../../js/theme-control.js"></script>
  <script src="../../js/sidebar.js" defer></script>
  <script src="../../js/header.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>window.activePage = 'plants';</script>
  <style>
    .swal2-container {
      z-index: 10005 !important;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body class="dashboard-body">

  <div class="sidebar-container"></div>

  <main class="main-wrapper">

    <div id="header-container" data-title="Loop Data" data-back="boiler_dashboard.html"></div>

    <div class="dashboard-content dashboard-scroll">

      <!-- ========== VIEW MODE ========== -->
      <div id="view-mode">

        <!-- Action Toolbar -->
        <div class="action-toolbar">
          <!-- Find Loop -->
          <div class="search-field-group" id="loop-search-wrap">
            <label class="input-label">Find Loop</label>
            <div class="autocomplete-container">
              <i class="ph-bold ph-magnifying-glass absolute-icon-left"></i>
              <input type="text" id="loop-search-input" class="input-control pl-40px pr-40px"
                placeholder="Search loop ID or name..." autocomplete="off">
              <button id="loop-dd-btn" class="absolute-icon-right">
                <i class="ph-bold ph-caret-down"></i>
              </button>
              <div id="loop-dropdown-list" class="autocomplete-list hidden"></div>
            </div>
          </div>

          <!-- Area Filter -->
          <div style="min-width: 140px;">
            <label class="input-label">Area</label>
            <div class="select-wrapper">
              <select id="view-area-select" class="input-control" onchange="filterByArea()">
                <option>ALL</option>
                <option>BOILER-1</option>
                <option>BOILER-2</option>
                <option>BOILER-3</option>
                <option>BOILER-4</option>
                <option>BOP</option>
                <option>COMMON</option>
                <option>ASH</option>
                <option>TG-1</option>
                <option>TG-2</option>
              </select>
            </div>
          </div>

          <div class="ui-divider-v"></div>

          <!-- Add New Loop -->
          <button class="toolbar-btn btn-emerald" onclick="showAddMode()">
            <i class="ph-bold ph-plus"></i> Add New Loop
          </button>
        </div>

        <!-- Empty State Card -->
        <div id="loop-empty-state" class="empty-state-card">
          <div class="empty-icon-circle">
            <i class="ph-bold ph-arrows-clockwise"></i>
          </div>
          <div class="empty-text-group">
            <h4 class="empty-title">No Loop Selected</h4>
            <p class="empty-desc">Search or select a Loop from the dropdown to view its data.</p>
          </div>
        </div>

        <div id="loop-data-area" class="hidden">
          <!-- General Info -->
          <div class="form-section">
            <h3 class="section-title"><i class="ph-bold ph-info"></i> General Information</h3>
            <div class="dashboard-grid grid-cols-2">
              <div class="form-group mb-0">
                <label class="input-label">Loop Name</label>
                <input type="text" id="view-loop-name" class="input-control text-blue font-bold" readonly>
              </div>
              <div class="form-group mb-0">
                <label class="input-label">Service</label>
                <input type="text" id="view-loop-service" class="input-control" readonly>
              </div>
              <div class="form-group mb-0">
                <label class="input-label">Loop Schematic</label>
                <input type="text" id="view-loop-schematic" class="input-control" readonly>
              </div>
              <div class="form-group mb-0">
                <label class="input-label">Special Document</label>
                <input type="text" id="view-loop-special-doc" class="input-control" readonly>
              </div>
            </div>
          </div>

          <!-- Hints & Instructions -->
          <div class="dashboard-grid grid-cols-2">
            <div class="form-section">
              <h3 class="section-title"><i class="ph-bold ph-lightbulb"></i> Helpful Hints</h3>
              <textarea id="view-loop-hints" class="input-control" readonly style="min-height: 120px;"></textarea>
            </div>
            <div class="form-section">
              <h3 class="section-title"><i class="ph-bold ph-clipboard-text"></i> Special Instructions</h3>
              <textarea id="view-loop-instructions" class="input-control" readonly
                style="min-height: 120px;"></textarea>
            </div>
          </div>

          <!-- Components Table -->
          <div class="form-section">
            <h3 class="section-title"><i class="ph-bold ph-stack"></i> Loop Components</h3>
            <div class="user-table-wrapper">
              <table class="user-table">
                <thead>
                  <tr>
                    <th class="user-table-center" style="width: 64px;">Sr</th>
                    <th class="user-table-left">Tag No</th>
                    <th class="user-table-left">Description</th>
                    <th class="user-table-center">Type</th>
                    <th class="user-table-center">Make / Model</th>
                  </tr>
                </thead>
                <tbody id="components-body">
                  <!-- Dynamic rows -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
    </div>
  </main>

  <!-- ========== ADD NEW LOOP MODAL ========== -->
  <div id="add-loop-modal" class="gnfc-modal-overlay">
    <div class="gnfc-modal-shell gnfc-modal-shell--xl">
      <div class="gnfc-modal-header">
        <div>
          <h3 class="gnfc-modal-title"><i class="ph-bold ph-plus-circle mr-8px"></i> Add New Loop</h3>
          <p class="gnfc-modal-subtitle">Define a new loop and its associated metadata</p>
        </div>
        <button onclick="hideAddMode()" class="gnfc-modal-close">
          <i class="ph-bold ph-x text-lg"></i>
        </button>
      </div>

      <div class="gnfc-modal-body">
        <div class="dashboard-grid grid-cols-2">
          
          <div class="form-group mb-0">
            <label class="input-label">Loop ID <span class="text-red">*</span></label>
            <input type="text" id="add-loop-id" class="input-control" placeholder="e.g. LS-B1-012">
          </div>
          
          <div class="form-group mb-0">
            <label class="input-label">Area</label>
            <select id="add-area-select" class="input-control">
              <option>BOILER-1</option>
              <option>BOILER-2</option>
              <option>BOILER-3</option>
              <option>BOILER-4</option>
              <option>BOP</option>
              <option>COMMON</option>
              <option>ASH</option>
              <option>TG-1</option>
              <option>TG-2</option>
            </select>
          </div>

          <div class="form-group mb-0 col-span-2">
            <label class="input-label">Loop Name <span class="text-red">*</span></label>
            <input type="text" id="add-loop-name" class="input-control" placeholder="e.g. MAIN STEAM PRESSURE LOOP">
          </div>

          <div class="form-group mb-0 col-span-2">
            <label class="input-label">Service</label>
            <input type="text" id="add-loop-service" class="input-control" placeholder="e.g. STEAM HEADER PRESSURE MONITORING">
          </div>

          <div class="form-group mb-0">
            <label class="input-label">Loop Schematic</label>
            <input type="text" id="add-loop-schematic" class="input-control" placeholder="DWG-BLR-XXX-SCH">
          </div>
          
          <div class="form-group mb-0">
            <label class="input-label">Special Document</label>
            <input type="text" id="add-loop-special-doc" class="input-control" placeholder="SP-DOC-XXX">
          </div>

          <div class="form-group mb-0">
            <label class="input-label">Helpful Hints</label>
            <textarea id="add-loop-hints" class="input-control" style="min-height: 80px;" placeholder="Maintenance tips..."></textarea>
          </div>
          
          <div class="form-group mb-0">
            <label class="input-label">Special Instructions</label>
            <textarea id="add-loop-instructions" class="input-control" style="min-height: 80px;" placeholder="Specific instructions..."></textarea>
          </div>

        </div>
      </div>

      <div class="gnfc-modal-footer">
        <button class="gnfc-modal-btn gnfc-modal-btn-secondary" onclick="hideAddMode()">Cancel</button>
        <button class="gnfc-modal-btn gnfc-modal-btn-primary" onclick="saveLoop()">
          <i class="ph-bold ph-floppy-disk"></i> Save Loop
        </button>
      </div>
    </div>
  </div>

  <script>
    // ── Loop Database ───────────────────────────────────────────────
    const loopDatabase = {
      "LS-10-101": {
        name: "MAIN STEAM PRESSURE LOOP", area: "BOILER-1",
        service: "STEAM HEADER PRESSURE MONITORING & CONTROL",
        schematic: "DWG-BLR-101-SCH", specialDoc: "SP-DOC-101",
        hints: "Check impulse tubing for blockage before calibration.\nEnsure manifold valve positions are correct.",
        instructions: "Use 2oo3 voting for trip functions.\nCalibrate at 0%, 25%, 50%, 75%, 100% of range.",
        components: [
          { tag: "10-PT-101A", desc: "MAIN STEAM HEADER PRESSURE TX-A", type: "TRANSMITTER", make: "YOKOGAWA / EJA530A" },
          { tag: "10-PT-101B", desc: "MAIN STEAM HEADER PRESSURE TX-B", type: "TRANSMITTER", make: "YOKOGAWA / EJA530A" },
          { tag: "10-PT-101C", desc: "MAIN STEAM HEADER PRESSURE TX-C", type: "TRANSMITTER", make: "YOKOGAWA / EJA530A" },
          { tag: "10-PI-101", desc: "MAIN STEAM PRESSURE INDICATOR", type: "GAUGE", make: "WIKA / 232.50" },
        ]
      },
      "LS-FG-101": {
        name: "FUEL GAS CONTROL LOOP", area: "BOILER-2",
        service: "NATURAL GAS FLOW CONTROL TO BURNERS",
        schematic: "DWG-BLR-FG-101", specialDoc: "",
        hints: "Verify gas pressure upstream of CV before testing.\nCheck positioner feedback signal.",
        instructions: "Stroke test CV quarterly.\nVerify tight shut-off during annual shutdown.",
        components: [
          { tag: "XLGDFGV1D", desc: "FUEL GAS CV 1D", type: "CONTROL VALVE", make: "FISHER / DVC6200" },
          { tag: "XLGDFGV1E", desc: "FUEL GAS CV 1E", type: "CONTROL VALVE", make: "FISHER / DVC6200" },
          { tag: "XLGDFGV1F", desc: "FUEL GAS CV 1F", type: "CONTROL VALVE", make: "FISHER / DVC6200" },
        ]
      },
      "LS-C1-008": {
        name: "COMPRESSOR BEARING TEMP LOOP", area: "COMMON",
        service: "BEARING TEMPERATURE MONITORING",
        schematic: "DWG-COMP-008", specialDoc: "SP-COMP-MAINT-008",
        hints: "RTD wiring: 3-wire configuration.\nCheck for ambient temperature drift.",
        instructions: "High alarm: 110°C, Trip: 125°C.\nVerify thermowell integrity annually.",
        components: [
          { tag: "ZT1777385", desc: "COMPRESSOR BEARING TEMP", type: "RTD PT100", make: "EMERSON / 3144P" },
          { tag: "ZT1777393", desc: "COMPRESSOR BEARING TEMP BACKUP", type: "RTD PT100", make: "EMERSON / 3144P" },
        ]
      },
      "LS-B1-007": {
        name: "BOILER-1 FURNACE TEMPERATURE LOOP", area: "BOILER-1",
        service: "FURNACE TEMPERATURE MONITORING & PROTECTION",
        schematic: "DWG-B1-007-SCH", specialDoc: "SP-B1-007",
        hints: "Thermocouple type K — compensating cable must be same type.\nCheck junction box for moisture ingress.",
        instructions: "Trip setpoints: High 980°C Alarm, 1050°C Trip.\nLow setpoints: 500°C Alarm, 400°C Trip.",
        components: [
          { tag: "ZT177707A", desc: "BOILER-1 FURNACE TEMP A", type: "TRANSMITTER", make: "YOKOGAWA / YTA510A" },
          { tag: "ZT177707B", desc: "BOILER-1 FURNACE TEMP B", type: "TRANSMITTER", make: "YOKOGAWA / YTA510A" },
          { tag: "ZT177707C", desc: "BOILER-1 FURNACE TEMP C", type: "TRANSMITTER", make: "YOKOGAWA / YTA510A" },
        ]
      },
      "LS-B1-MSV": {
        name: "BOILER-1 MAIN STEAM STOP VALVE LOOP", area: "BOILER-1",
        service: "EMERGENCY SHUTDOWN OF MAIN STEAM",
        schematic: "DWG-B1-MSV", specialDoc: "SP-ESD-MSV",
        hints: "ESD function — always test in simulation mode first.\nSOV must be energised to open.",
        instructions: "Valve must close within 2 seconds on ESD signal.\nFull stroke test required every 6 months.",
        components: [
          { tag: "XV177901", desc: "BOILER-1 MAIN STEAM STOP VALVE", type: "C/V", make: "SEVERN GLOCON / G5-ESD" },
          { tag: "ZSH177906", desc: "NG BURNER 4 BLOCK VALVE OPEN", type: "SWITCH", make: "MAGO / LS06200" },
        ]
      }
    };

    let allLoopIds = Object.keys(loopDatabase);

    // ── DOM Refs ──────────────────────────────────────────────────
    const $searchInput = $('#loop-search-input');
    const $ddList = $('#loop-dropdown-list');
    const $emptyState = $('#loop-empty-state');
    const $dataArea = $('#loop-data-area');

    // ── Autocomplete Logic ─────────────────────────────────────────
    function renderDropdown(filter, showAll = false) {
      const area = $('#view-area-select').val();
      const f = showAll ? '' : (filter || '').trim().toLowerCase();

      // Find matches using traditional loop
      const filtered = [];
      for (let i = 0; i < allLoopIds.length; i++) {
        const id = allLoopIds[i];
        const d = loopDatabase[id];
        const areaOk = (area === 'ALL') || (d.area === area);
        const textOk = !f || id.toLowerCase().includes(f) || d.name.toLowerCase().includes(f);
        if (areaOk && textOk) filtered.push(id);
      }

      if (filtered.length === 0) {
        $ddList.html('<div class="autocomplete-item" style="opacity:0.5; cursor:default;">No loops found</div>');
      } else {
        let html = '';
        for (let i = 0; i < filtered.length; i++) {
          const id = filtered[i];
          const d = loopDatabase[id];
          const hi = f ? id.replace(new RegExp(`(${f})`, 'gi'), '<b>$1</b>') : id;
          html += `
                        <div class="autocomplete-item" data-id="${id}">
                            <div class="text-blue font-bold text-xs">${hi}</div>
                            <div class="text-sm">${d.name}</div>
                        </div>`;
        }
        $ddList.html(html);

        $ddList.find('.autocomplete-item').on('click', function () {
          selectLoop($(this).data('id'));
        });
      }
    }

    $searchInput.on('input focus', function (e) {
      const isFocus = e.type === 'focus';
      const isSelected = allLoopIds.includes($searchInput.val());
      renderDropdown($searchInput.val(), isFocus && isSelected);
      $ddList.removeClass('hidden');
    });

    $('#loop-dd-btn').on('click', function (e) {
      e.stopPropagation();
      $ddList.toggleClass('hidden');
      if (!$ddList.hasClass('hidden')) renderDropdown($searchInput.val(), true);
    });

    $(document).on('click', function (e) {
      if (!$(e.target).closest('#loop-search-wrap').length) $ddList.addClass('hidden');
    });

    function selectLoop(id) {
      $searchInput.val(id);
      $ddList.addClass('hidden');
      loadLoop(id);
    }

    function filterByArea() {
      if (!$ddList.hasClass('hidden')) renderDropdown($searchInput.val());
    }

    function loadLoop(id) {
      const data = loopDatabase[id];
      if (!data) return;

      $('#view-loop-name').val(data.name);
      $('#view-loop-service').val(data.service);
      $('#view-loop-schematic').val(data.schematic || '—');
      $('#view-loop-special-doc').val(data.specialDoc || '—');
      $('#view-loop-hints').val(data.hints || '');
      $('#view-loop-instructions').val(data.instructions || '');

      const $tbody = $('#components-body');
      if (!data.components || !data.components.length) {
        $tbody.html('<tr><td colspan="5" class="user-table-center font-italic py-6 opacity-50">No components found</td></tr>');
      } else {
        let rows = '';
        for (let i = 0; i < data.components.length; i++) {
          const c = data.components[i];
          rows += `
                    <tr>
                        <td class="user-table-center user-table-secondary user-table-bold">${i + 1}</td>
                        <td class="user-table-left user-table-blue user-table-bold cursor-pointer" 
                            onclick="window.location.href='boiler_inst_data.html?tag=${encodeURIComponent(c.tag)}'">${c.tag}</td>
                        <td class="user-table-left user-table-secondary">${c.desc}</td>
                        <td class="user-table-center user-table-primary">${c.type}</td>
                        <td class="user-table-center user-table-primary">${c.make}</td>
                    </tr>`;
        }
        $tbody.html(rows);
      }

      $emptyState.addClass('hidden');
      $dataArea.removeClass('hidden');
      $('.dashboard-scroll').scrollTop(0);
    }

    // ── Add/Edit Modal Logic ───────────────────────────────────────
    function showAddMode() {
      $('#add-loop-modal .input-control').val('');
      $('#add-area-select').prop('selectedIndex', 0);
      $('#add-loop-modal').addClass('is-open');
      setTimeout(() => $('#add-loop-id').focus(), 150);
    }

    function hideAddMode() {
      $('#add-loop-modal').removeClass('is-open');
    }

    function saveLoop() {
      const loopId = $('#add-loop-id').val().trim();
      const name = $('#add-loop-name').val().trim();

      if (!loopId || !name) {
        Swal.fire({ icon: 'error', title: 'Required Fields', text: 'Loop ID and Name are required.', confirmButtonColor: '#ef4444' });
        return;
      }

      loopDatabase[loopId] = {
        name: name,
        area: $('#add-area-select').val(),
        service: $('#add-loop-service').val(),
        schematic: $('#add-loop-schematic').val(),
        specialDoc: $('#add-loop-special-doc').val(),
        hints: $('#add-loop-hints').val(),
        instructions: $('#add-loop-instructions').val(),
        components: []
      };
      allLoopIds = Object.keys(loopDatabase);

      Swal.fire({
        icon: 'success', title: 'Loop Saved',
        text: `Loop ${loopId} has been added to the database.`,
        confirmButtonColor: '#10b981',
        timer: 2000, timerProgressBar: true
      }).then(() => {
        hideAddMode();
        selectLoop(loopId);
      });
    }

    // ── Init ──────────────────────────────────────────────────────
    $(function () {
      const p = new URLSearchParams(window.location.search);
      const loopId = p.get('loop');
      if (loopId && loopDatabase[loopId]) {
        selectLoop(loopId);
      }
    });
  </script>
</body>

</html>
