    <script>window.activePage = 'plants';</script>

<body class="dashboard-body">
    <div class="sidebar-container"></div>

    <main class="main-wrapper">
        <div id="header-container" data-title="Search Tag" data-back="boiler_inst_data.html"></div>

        <div class="dashboard-content dashboard-scroll">
            <div class="dashboard-container-wide">

                <!-- Search Toolbar -->
                <div class="action-toolbar">
                    <div class="search-field-group flex-1">
                        <label class="input-label">Search Tag / Description</label>
                        <div class="autocomplete-container">
                            <i class="ph-bold ph-magnifying-glass absolute-icon-left"></i>
                            <input type="text" id="search-input" class="input-control pl-40px" placeholder="Enter tag name or description..." autofocus>
                        </div>
                    </div>
                    
                    <div class="ui-divider-v"></div>

                    <button class="toolbar-btn btn-red" onclick="window.location.href='boiler_inst_data.html'">
                        <i class="ph-bold ph-x"></i> Cancel
                    </button>
                </div>

                <!-- Results Table -->
                <!-- <div class="form-section"> -->
                    <!-- <div id="result-count" >
                        Showing 0 record(s)
                    </div> -->
                    <div class="user-table-wrapper" >
                        <table class="user-table" id="results-table">
                            <thead>
                                <tr>
                                    <th class="user-table-center" style="width: 64px;">Sr</th>
                                    <th class="user-table-left" style="width: 15%;">Tag</th>
                                    <th class="user-table-left">Description</th>
                                    <th class="user-table-center" style="width: 15%;">Inst Type</th>
                                    <th class="user-table-left" style="width: 20%;">Function</th>
                                    <th class="user-table-center" style="width: 10%;">History</th>
                                </tr>
                            </thead>
                            <tbody id="results-body">
                                <!-- Dynamic rows -->
                            </tbody>
                        </table>
                    </div>
                <!-- </div> -->

            </div>
        </div>
    </main>

            { tag: "ZT191107", description: "ID FAN BEARING TEMP", inst_type: "RTD PT100", func: "TEMPERATURE", history: "1 job" },
        ];

        function renderTable(data) {
            const $body = $('#results-body');
            const $count = $('#result-count');

            if (data.length === 0) {
                if ($count.length) $count.text('No results found');
                $body.html('<tr><td colspan="6" class="user-table-center py-12 opacity-50 font-italic">No tags found for your search criteria</td></tr>');
                return;
            }

            if ($count.length) $count.text(`Showing ${data.length} record(s)`);
            
            let html = '';
            for (let i = 0; i < data.length; i++) {
                const r = data[i];
                html += `
                <tr class="cursor-pointer" onclick="selectTag('${r.tag}')">
                    <td class="user-table-center user-table-secondary user-table-bold">${i + 1}</td>
                    <td class="user-table-left user-table-blue user-table-bold">${r.tag}</td>
                    <td class="user-table-left user-table-secondary font-medium">${r.description}</td>
                    <td class="user-table-center user-table-primary">${r.inst_type}</td>
                    <td class="user-table-left user-table-secondary">${r.func || '—'}</td>
                    <td class="user-table-center font-bold" style="color:var(--typo-blue);">${r.history ? r.history : '—'}</td>
                </tr>`;
            }
            $body.html(html);
        }

        function performSearch() {
            const query = $('#search-input').val().trim().toLowerCase();
            if (!query) {
                renderTable(tagDatabase);
                return;
            }
            
            const results = [];
            for (let i = 0; i < tagDatabase.length; i++) {
                const t = tagDatabase[i];
                if (t.tag.toLowerCase().indexOf(query) !== -1 || 
                    t.description.toLowerCase().indexOf(query) !== -1 || 
                    t.inst_type.toLowerCase().indexOf(query) !== -1) {
                    results.push(t);
                }
            }
            renderTable(results);
        }

        function selectTag(tagNo) {
            window.location.href = 'boiler_inst_data.html?tag=' + encodeURIComponent(tagNo);
        }

        $(function() {
            $('#search-input').on('keyup', performSearch);
            renderTable(tagDatabase);
        });
    </script>
</body>

</html>
