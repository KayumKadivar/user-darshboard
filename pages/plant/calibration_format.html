    <script>
        $(document).ready(function() {
            // Tag lists based on instrument type
            const tagCatalog = {
                "SWITCH": ["ZSH-177906", "ZSL-191801", "PSH-101", "PSL-102", "TSH-105", "LSL-106"],
                "TRANSMITTER": ["10-PT-101A", "ZT-177707A", "FT-101", "PT-102", "TT-105", "LT-106"],
                "CONTROL VALVE": ["XV-177901", "XLGDFGV1D", "CV-101", "CV-102", "FCV-103", "TCV-104"],
                "SCANNER": ["SCN-301", "SCN-302", "SCN-303", "SCN-304"],
                "VIBRATION": ["VT-401A", "VT-401B", "VE-402A", "VE-402B"]
            };

            // Smart Tag Autocomplete Helper
            function initTagAutocomplete(inputSelector, selectSelector, onMatch) {
                const $input = $(inputSelector);
                const $select = $(selectSelector);
                let snapBackTimeout = null;
                let snapBackInterval = null;
                let isAutoRemoving = false;

                function getAvailableTags() {
                    let tags = [];
                    $select.find('option').each(function () {
                        if ($(this).val()) tags.push($(this).val());
                    });
                    return tags;
                }

                function stopAutoRemove() {
                    clearTimeout(snapBackTimeout);
                    clearInterval(snapBackInterval);
                    isAutoRemoving = false;
                }

                $input.off('input.autocomplete').on('input.autocomplete', function (e) {
                    const tags = getAvailableTags();
                    const cursorStart = this.selectionStart;
                    const cursorEnd = this.selectionEnd;
                    const rawVal = $(this).val();
                    const upperVal = rawVal.toUpperCase();
                    if (rawVal !== upperVal) {
                        $(this).val(upperVal);
                        this.setSelectionRange(cursorStart, cursorEnd);
                    }

                    const inputType = e.originalEvent ? e.originalEvent.inputType : '';
                    const isDeleting = inputType && inputType.startsWith('delete');

                    if (isDeleting) {
                        stopAutoRemove();
                    }

                    let inputVal = $(this).val().toUpperCase();

                    if (isDeleting) {
                        let hasMatch = inputVal.length === 0 || tags.some(tag => tag.toUpperCase().startsWith(inputVal));
                        if (hasMatch) {
                            $(this).removeClass('is-invalid-tag');
                        } else {
                            $(this).addClass('is-invalid-tag');
                        }

                        let exactMatch = tags.find(tag => tag.toUpperCase() === inputVal);
                        $select.val(exactMatch || '');
                        if (onMatch) onMatch(exactMatch || '');
                        return;
                    }

                    let longestValidPrefix = "";
                    for (let i = inputVal.length; i >= 0; i--) {
                        let sub = inputVal.substring(0, i);
                        if (tags.some(tag => tag.toUpperCase().startsWith(sub))) {
                            longestValidPrefix = sub;
                            break;
                        }
                    }

                    if (inputVal.length > longestValidPrefix.length + 3) {
                        inputVal = inputVal.substring(0, longestValidPrefix.length + 3);
                        $(this).val(inputVal);
                    }

                    if (inputVal.length > longestValidPrefix.length) {
                        $(this).addClass('is-invalid-tag');
                        $select.val('');
                        if (onMatch) onMatch('');

                        stopAutoRemove();

                        const self = this;
                        const targetPrefix = longestValidPrefix;
                        snapBackTimeout = setTimeout(() => {
                            isAutoRemoving = true;
                            snapBackInterval = setInterval(() => {
                                let currentVal = $input.val();
                                if (currentVal.length > targetPrefix.length) {
                                    currentVal = currentVal.substring(0, currentVal.length - 1);
                                    $input.val(currentVal);
                                } else {
                                    clearInterval(snapBackInterval);
                                    isAutoRemoving = false;
                                    $input.removeClass('is-invalid-tag');

                                    let exactMatch = tags.find(tag => tag.toUpperCase() === currentVal);
                                    $select.val(exactMatch || '');
                                    if (onMatch) onMatch(exactMatch || '');
                                }
                            }, 150);
                        }, 800);
                    } else {
                        stopAutoRemove();
                        $(this).removeClass('is-invalid-tag');

                        let exactMatch = tags.find(tag => tag.toUpperCase() === inputVal);
                        $select.val(exactMatch || '');
                        if (onMatch) onMatch(exactMatch || '');
                    }
                });

                $select.off('change.autocomplete').on('change.autocomplete', function () {
                    const val = $(this).val();
                    if (val) {
                        $input.val(val).removeClass('is-invalid-tag');
                        stopAutoRemove();
                        if (onMatch) onMatch(val);
                    } else {
                        $input.val('');
                    }
                });
            }

            // Function to populate dropdowns based on Type Of Inst
            function populateTags(type) {
                const tags = tagCatalog[type] || [];
                $('.tag-dropdown').each(function(index) {
                    const $select = $(this);
                    const i = index + 1;
                    const $input = $(`#tag-input-${i}`);
                    
                    $select.empty();
                    $select.append('<option value="">Select Tag</option>');
                    tags.forEach(tag => {
                        $select.append(`<option value="${tag}">${tag}</option>`);
                    });
                    
                    // Clear input next to it
                    $input.val('').removeClass('is-invalid-tag');
                    
                    // Re-bind autocomplete logic
                    initTagAutocomplete(`#tag-input-${i}`, `#tag-select-${i}`);
                });
            }

            // Initial population
            populateTags("SWITCH");

            // Type Of Inst auto-triggers population (no Go button needed)
            $('#type-of-inst').on('change', function() {
                populateTags($(this).val());
            });

            // Technicians assignment mapping
            $('#assigned-to-select').on('change', function() {
                const code = $(this).val();
                $('#assigned-to-code').val(code);
            });

            // Engineers assignment mapping
            $('#engineer-select').on('change', function() {
                const code = $(this).val();
                $('#engineer-code').val(code);
            });

            // Report button actions helper
            function openReport(reportType, relativeUrl) {
                // Get all selected tags
                const selectedTags = [];
                for(let i = 1; i <= 5; i++) {
                    const val = $(`#tag-input-${i}`).val();
                    if(val) selectedTags.push(val);
                }

                if (selectedTags.length === 0) {
                    Swal.fire({
                        icon: 'warning',
                        title: 'No Tag Selected',
                        text: `Please select at least one tag to view the ${reportType} Report.`,
                        confirmButtonColor: '#2563eb'
                    });
                    return;
                }

                // If tags are selected, redirect to report with tags
                const tagParams = selectedTags.map(t => `tag=${encodeURIComponent(t)}`).join('&');
                const tech = $('#assigned-to-select').val();
                const eng = $('#engineer-select').val();
                let extraParams = '';
                if(tech) extraParams += `&tech=${tech}`;
                if(eng) extraParams += `&eng=${eng}`;

                Swal.fire({
                    title: 'Generating Report...',
                    text: `Redirecting to ${reportType} Form with selected tags...`,
                    icon: 'success',
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = `${relativeUrl}?${tagParams}${extraParams}`;
                });
            }

            // Hook up report buttons to correct relative URLs
            $('#btn-sw-report').on('click', () => openReport('Switch Calibration', 'pmmaster/pm_detail_sw.html'));
            $('#btn-tx-report').on('click', () => openReport('Transmitter Calibration', 'pmmaster/pm_detail_tx.html'));
            $('#btn-cv-report').on('click', () => openReport('Control Valve Calibration', 'pmmaster/pm_detail_cv.html'));
            $('#btn-scanner-report').on('click', () => openReport('Scanner Calibration', 'pmmaster/pm_detail_other.html'));
            $('#btn-vib-report').on('click', () => openReport('Vibration Calibration', 'pmmaster/pm_detail_vib.html'));


        });
    </script>
