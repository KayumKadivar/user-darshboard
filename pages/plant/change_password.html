<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | GNFC</title>
    <link rel="stylesheet" href="../../css/phosphor.css">
    <link rel="stylesheet" href="../../css/theme-vars.css">
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/pages/style.css">
    <link rel="stylesheet" href="../../css/pages/plant.css">
    <link rel="stylesheet" href="../../css/utilities.css">
    <link rel="stylesheet" href="../../css/modal-ui.css">

    <style>
    </style>

    <script src="../../js/vendor/jquery-3.7.1.min.js"></script>
    <script src="../../js/theme-control.js"></script>
    <script src="../../js/sidebar.js" defer></script>
    <script src="../../js/header.js" defer></script>
    <script src="../../js/vendor/sweetalert2.all.min.js"></script>

    <script>window.activePage = 'plants';</script>
</head>

<body class="dashboard-body">

    <div class="sidebar-container"></div>


    <main class="main-wrapper">

        <div id="header-container" data-title="Change Password"
            data-breadcrumb="Plant:plant.html,Boiler:boiler_dashboard.html,Change Password:active"
            data-back="boiler_dashboard.html"></div>

        <div class="dashboard-content dashboard-scroll pwd-page-wrapper">
            <div class="pwd-card-modern">
                <!-- Header -->
                <div class="pwd-header-modern">
                    <div class="pwd-icon-wrapper">
                        <i class="ph-bold ph-key"></i>
                    </div>
                    <div>
                        <h2 class="pwd-title">Change Password For Admin</h2>
                        <p class="pwd-subtitle">Update the admin account password securely</p>
                    </div>
                </div>

                <form id="change-password-form">
                    <div class="pwd-form-group-modern">
                        <!-- User -->
                        <div>
                            <label class="pwd-label-modern">
                                <i class="ph ph-user"></i> User
                            </label>
                            <input type="text" id="ec-number" class="gnfc-modal-input pwd-input-modern" value="admin" readonly>
                        </div>

                        <!-- Old Password -->
                        <div>
                            <label class="pwd-label-modern">
                                <i class="ph ph-lock-key"></i> Old Password
                            </label>
                            <input type="password" id="old-password" class="gnfc-modal-input pwd-input-modern" required placeholder="Enter current password...">
                        </div>

                        <!-- New Password -->
                        <div>
                            <label class="pwd-label-modern">
                                <i class="ph ph-lock-key"></i> New Password
                            </label>
                            <input type="password" id="new-password" class="gnfc-modal-input pwd-input-modern" required placeholder="Enter new password...">
                        </div>

                        <!-- Confirm New Password -->
                        <div>
                            <label class="pwd-label-modern">
                                <i class="ph ph-check-circle"></i> Confirm New Password
                            </label>
                            <input type="password" id="confirm-password" class="gnfc-modal-input pwd-input-modern" required placeholder="Re-enter new password...">
                        </div>
                    </div>

                    <!-- Buttons -->
                    <div class="pwd-action-group">
                        <button type="submit" class="pwd-btn-submit-modern">
                            <i class="ph ph-check-circle"></i> Submit
                        </button>
                        <button type="button" id="btn-reset" class="pwd-btn-reset-modern">
                            <i class="ph ph-arrow-counter-clockwise"></i> Reset
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </main>

    <script>
        $(document).ready(function() {
            // Form submission logic
            $('#change-password-form').on('submit', function(e) {
                e.preventDefault();
                
                const oldPwd = $('#old-password').val();
                const newPwd = $('#new-password').val();
                const confirmPwd = $('#confirm-password').val();

                if (!oldPwd || !newPwd || !confirmPwd) {
                    Swal.fire({
                        icon: 'warning',
                        title: 'Incomplete Fields',
                        text: 'Please fill out all password fields.',
                        confirmButtonColor: '#2563eb'
                    });
                    return;
                }

                if (newPwd !== confirmPwd) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Passwords Match Error',
                        text: 'The new password and confirmation password do not match.',
                        confirmButtonColor: '#2563eb'
                    });
                    return;
                }

                // Successful submission simulation
                Swal.fire({
                    icon: 'success',
                    title: 'Password Updated',
                    text: 'Your password has been changed successfully.',
                    confirmButtonColor: '#2563eb'
                }).then(() => {
                    // Redirect back to dashboard
                    window.location.href = 'boiler_dashboard.html';
                });
            });

            // Close button redirects to dashboard
            $('#btn-close').on('click', function() {
                window.location.href = 'boiler_dashboard.html';
            });

            // Reset Confirmation Logic
            $('#btn-reset').on('click', function(e) {
                e.preventDefault(); // Stop default form reset immediately
                Swal.fire({
                    title: 'Reset Form?',
                    text: 'Are you sure you want to clear all fields?',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#d33',
                    cancelButtonColor: '#64748b',
                    confirmButtonText: 'Yes, Reset',
                    cancelButtonText: 'Cancel'
                }).then((result) => {
                    if (result.isConfirmed) {
                        $('#change-password-form')[0].reset();
                    }
                });
            });
        });
    </script>
</body>

</html>
