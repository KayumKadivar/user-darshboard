<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant Units | GNFC</title>

  <link rel="stylesheet" href="../../css/phosphor.css">
  <link rel="stylesheet" href="../../css/theme-vars.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/pages/style.css">
  <link rel="stylesheet" href="../../css/pages/plant.css">
  <link rel="stylesheet" href="../../css/utilities.css">

  <script src="../../js/vendor/jquery-3.7.1.min.js"></script>
  <script src="../../js/theme-control.js"></script>
  <script src="../../js/sidebar.js" defer></script>
  <script src="../../js/header.js" defer></script>

  <script>
    window.activePage = 'plants';
  </script>
</head>

<body class="dashboard-body">

  <div class="sidebar-container"></div>

  <main class="main-wrapper">

    <div id="header-container" data-title="Plant Units" data-breadcrumb="Plant:active" data-back="../../dashboard.html"></div>

    <div class="dashboard-content dashboard-scroll">
      
      <!-- ─── Top Bar ─── -->
      <div class="welcome-section">
        <div class="welcome-text">
          <h2>GNFC Plant Units</h2>
          <p>Select a unit to view details and dashboards</p>
        </div>
        <div class="status-widgets">
          <div class="widget-item">
            <i class="ph ph-factory color-blue"></i>
            <span id="unit-count" class="widget-text">17 Units</span>
          </div>
        </div>
      </div>

      <!-- ─── Unit Grid ─── -->
      <div class="unit-panel">
        <div id="unit-grid" class="unit-grid">
          <a href="#" class="unit-card" aria-label="Open AA">
            <span class="unit-name">AA</span>
            <i class="ph-bold ph-caret-right unit-arrow" aria-hidden="true"></i>
          </a>
          <a href="#" class="unit-card" aria-label="Open AAQM">
            <span class="unit-name">AAQM</span>
            <i class="ph-bold ph-caret-right unit-arrow" aria-hidden="true"></i>
          </a>
          <a href="#" class="unit-card" aria-label="Open AMM">
            <span class="unit-name">AMM</span>
            <i class="ph-bold ph-caret-right unit-arrow" aria-hidden="true"></i>
          </a>
          <a href="#" class="unit-card" aria-label="Open ANIPF">
            <span class="unit-name">ANIPF</span>
            <i class="ph-bold ph-caret-right unit-arrow" aria-hidden="true"></i>
          </a>
          <a href="#" class="unit-card" aria-label="Open ANITDI">
            <span class="unit-name">ANITDI</span>
            <i class="ph-bold ph-caret-right unit-arrow" aria-hidden="true"></i>
          </a>
          <a href="#" class="unit-card" aria-label="Open ASGP">
            <span class="unit-name">ASGP</span>
            <i class="ph-bold ph-caret-right unit-arrow" aria-hidden="true"></i>
          </a>
          <a href="#" class="unit-card" aria-label="Open BAGG">
            <span class="unit-name">BAGG</span>
            <i class="ph-bold ph-caret-right unit-arrow" aria-hidden="true"></i>
          </a>
          <a href="boiler_dashboard.html" class="unit-card" aria-label="Open BOILER">
            <span class="unit-name">BOILER</span>
            <i class="ph-bold ph-caret-right unit-arrow" aria-hidden="true"></i>
          </a>
          <a href="#" class="unit-card" aria-label="Open CMS">
            <span class="unit-name">CMS</span>
            <i class="ph-bold ph-caret-right unit-arrow" aria-hidden="true"></i>
          </a>
          <a href="#" class="unit-card" aria-label="Open CPSU">
            <span class="unit-name">CPSU</span>
            <i class="ph-bold ph-caret-right unit-arrow" aria-hidden="true"></i>
          </a>
          <a href="#" class="unit-card" aria-label="Open DM">
            <span class="unit-name">DM</span>
            <i class="ph-bold ph-caret-right unit-arrow" aria-hidden="true"></i>
          </a>
          <a href="#" class="unit-card" aria-label="Open EA">
            <span class="unit-name">EA</span>
            <i class="ph-bold ph-caret-right unit-arrow" aria-hidden="true"></i>
          </a>
          <a href="#" class="unit-card" aria-label="Open FA">
            <span class="unit-name">FA</span>
            <i class="ph-bold ph-caret-right unit-arrow" aria-hidden="true"></i>
          </a>
          <a href="#" class="unit-card" aria-label="Open INST WS">
            <span class="unit-name">INST WS</span>
            <i class="ph-bold ph-caret-right unit-arrow" aria-hidden="true"></i>
          </a>
          <a href="#" class="unit-card" aria-label="Open M1">
            <span class="unit-name">M1</span>
            <i class="ph-bold ph-caret-right unit-arrow" aria-hidden="true"></i>
          </a>
          <a href="#" class="unit-card" aria-label="Open M2">
            <span class="unit-name">M2</span>
            <i class="ph-bold ph-caret-right unit-arrow" aria-hidden="true"></i>
          </a>
          <a href="#" class="unit-card" aria-label="Open UREA">
            <span class="unit-name">UREA</span>
            <i class="ph-bold ph-caret-right unit-arrow" aria-hidden="true"></i>
          </a>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    $('#unit-count').text(document.querySelectorAll('.unit-card').length + ' Units');

    $(document).ready(function() {
      $('.unit-card').on('click', function(e) {
        const unitName = $(this).find('.unit-name').text().trim();
        
        if (unitName !== 'BOILER') {
          e.preventDefault();
          
          Swal.fire({
            icon: 'error',
            title: 'Access Denied',
            text: `Sorry !! ENG_TESTER, YOU ARE NOT AUTHORIZED TO LOGIN TO ${unitName}`,
            confirmButtonColor: 'var(--brand-primary)',
            confirmButtonText: 'Cancel',
            customClass: {
              confirmButton: 'auth-swal-cancel-btn'
            },
            width: '480px',
            padding: '24px',
            background: '#ffffff',
            confirmButtonColor: '#2563eb',
            confirmButtonText: 'Cancel',
            showClass: {
              popup: 'animate__animated animate__fadeInDown animate__faster'
            },
            hideClass: {
              popup: 'animate__animated animate__fadeOutUp animate__faster'
            }
          });
        }
      });
    });
  </script>

</body>

</html>
