<body class="dashboard-body">

  <main class="main-wrapper">
    <div id="header-container" data-title="PM Master"

      data-back="../boiler_dashboard.html"></div>

    <div class="dashboard-content dashboard-scroll">
      <div class="mx-auto flex flex-col gap-16px" style="width: 100%;">

        <!-- PM Navigation Container -->

        <!-- Search & PM Form Section -->

          <div class="jbd-card-header">
            <h3 class="font-14px fw-700 color-blue text-uppercase  flex items-center gap-8px">

  <!-- PM Update Status Modal -->

        <button class="gnfc-modal-close btn-close-modal">

        </button>
      </div>

      <div class="gnfc-modal-body">
        <div class="form-grid grid-cols-12 gap-16px">
          <div class="col-span-12">
            <label class="gnfc-modal-label">TAG_NO</label>
            <div class="flex gap-12px">
              <input id="status-update-tag-input" type="text" class="gnfc-modal-input flex-1 uppercase"
                placeholder="Type Tag No...">
              <select id="status-update-tag-select" class="gnfc-modal-input flex-1">
                <option value="">Select Tag No</option>
                <option value="1_110VDCEF">1_110VDCEF</option>
                <option value="1_132KVL1L2_OFF">1_132KVL1L2_OFF</option>
                <option value="1_2BLRTRP_EHTC">1_2BLRTRP_EHTC</option>
                <option value="1_2BLRTRP_TP">1_2BLRTRP_TP</option>
                <option value="1AR2510">1AR2510</option>
                <option value="1DPT2591">1DPT2591</option>
                <option value="FT_1401">FT_1401</option>
              </select>
            </div>
          </div>

          <div class="col-span-6">

              <option value="BPB">BPB</option>

      <div class="gnfc-modal-footer">

        </button>
      </div>
    </div>
  </div>

  <script>
    $(document).ready(function () {
      let _selectedTagNo = '';
      const _pmModalMode = 'add';

      // Navigation Triggers (New Page Navigation)
      $('.nav-btn').on('click', function () {
        const url = $(this).data('url');
        if (url) window.location.href = url;
      });

      $('#btn-update-status').on('click', () => $('#pm-update-status-modal').addClass('is-open'));

      $('.btn-close-modal').on('click', function () {
        $(this).closest('.gnfc-modal-overlay').removeClass('is-open');
      });

      // --- Smart Tag Autocomplete Helper ---
      function initTagAutocomplete(inputSelector, selectSelector, onMatch) {
        const $input = $(inputSelector);
        const $select = $(selectSelector);
        let snapBackTimeout = null;
        let snapBackInterval = null;
        let isAutoRemoving = false;

        function getAvailableTags() {
          let tags = [];
          $select.find('option').each(function () {
            if ($(this).val()) tags.push($(this).val());
          });
          return tags;
        }

        function stopAutoRemove() {
          clearTimeout(snapBackTimeout);
          clearInterval(snapBackInterval);
          isAutoRemoving = false;
        }

        const tags = getAvailableTags();

        $input.on('input', function (e) {
          // Immediately convert to uppercase so it never shows lowercase
          const cursorStart = this.selectionStart;
          const cursorEnd = this.selectionEnd;
          const rawVal = $(this).val();
          const upperVal = rawVal.toUpperCase();
          if (rawVal !== upperVal) {
            $(this).val(upperVal);
            this.setSelectionRange(cursorStart, cursorEnd);
          }

          const inputType = e.originalEvent ? e.originalEvent.inputType : '';
          const isDeleting = inputType && inputType.startsWith('delete');

          // If user manually pressed backspace, stop any running auto-remove
          if (isDeleting) {
            stopAutoRemove();
          }

          let inputVal = $(this).val().toUpperCase();

          // --- DELETION (manual backspace): just sync dropdown ---
          if (isDeleting) {
            // Check if remaining text is a valid prefix
            let hasMatch = inputVal.length === 0 || tags.some(tag => tag.toUpperCase().startsWith(inputVal));
            if (hasMatch) {
              $(this).removeClass('is-invalid-tag');
            } else {
              $(this).addClass('is-invalid-tag');
            }

            let exactMatch = tags.find(tag => tag.toUpperCase() === inputVal);
            $select.val(exactMatch || '');
            if (onMatch) onMatch(exactMatch || '');
            return;
          }

          // --- TYPING FORWARD ---

          // 1. Find Longest Valid Prefix
          let longestValidPrefix = "";
          for (let i = inputVal.length; i >= 0; i--) {
            let sub = inputVal.substring(0, i);
            if (tags.some(tag => tag.toUpperCase().startsWith(sub))) {
              longestValidPrefix = sub;
              break;
            }
          }

          // 2. Tolerance: Allow max 3 extra "wrong" characters
          if (inputVal.length > longestValidPrefix.length + 3) {
            inputVal = inputVal.substring(0, longestValidPrefix.length + 3);
            $(this).val(inputVal);
          }

          // 3. Invalid chars detected → show red border, then auto-remove one-by-one
          if (inputVal.length > longestValidPrefix.length) {
            $(this).addClass('is-invalid-tag');
            $select.val('');
            if (onMatch) onMatch('');

            // Stop any previous auto-remove
            stopAutoRemove();

            // After 800ms pause, start removing 1 char at a time (every 150ms)
            const self = this;
            const targetPrefix = longestValidPrefix;
            snapBackTimeout = setTimeout(() => {
              isAutoRemoving = true;
              snapBackInterval = setInterval(() => {
                let currentVal = $input.val();
                if (currentVal.length > targetPrefix.length) {
                  // Remove last character
                  currentVal = currentVal.substring(0, currentVal.length - 1);
                  $input.val(currentVal);
                } else {
                  // Done removing — stop interval and trigger autocomplete
                  clearInterval(snapBackInterval);
                  isAutoRemoving = false;
                  $input.removeClass('is-invalid-tag');

                  // Now trigger suggestion for the valid prefix
                  let val = $input.val().toUpperCase();
                  if (val.length > 0) {
                    let firstMatch = tags.find(tag => tag.toUpperCase().startsWith(val));
                    if (firstMatch) {
                      $input.val(firstMatch);
                      self.setSelectionRange(val.length, firstMatch.length);
                      $select.val(firstMatch);
                      if (onMatch) onMatch(firstMatch);
                    }
                  } else {
                    $select.val('');
                    if (onMatch) onMatch('');
                  }
                }
              }, 150);
            }, 800);

            return;
          }

          // 4. Valid prefix: remove invalid state
          stopAutoRemove();
          $(this).removeClass('is-invalid-tag');

          // 5. Suggestion / Autocomplete logic
          if (inputVal.length > 0) {
            let firstMatch = tags.find(tag => tag.toUpperCase().startsWith(inputVal));
            if (firstMatch) {
              $(this).val(firstMatch);
              this.setSelectionRange(inputVal.length, firstMatch.length);
              $select.val(firstMatch);
              if (onMatch) onMatch(firstMatch);
            }
          } else {
            $select.val('');
            if (onMatch) onMatch('');
          }
        });

        $input.on('keydown', function (e) {
          // If user presses any key during auto-remove, stop it
          if (isAutoRemoving && e.key !== 'Enter') {
            stopAutoRemove();
          }

          if (e.key === 'Enter') {
            stopAutoRemove();
            const currentVal = $(this).val();
            if (currentVal && !$(this).hasClass('is-invalid-tag')) {
              e.preventDefault();
              $(this).val(currentVal);
              this.setSelectionRange(currentVal.length, currentVal.length);

              $(this).addClass('tag-confirmed');
              setTimeout(() => $(this).removeClass('tag-confirmed'), 500);
            }
          }
        });

        $select.on('change', function () {
          stopAutoRemove();
          let val = $(this).val();
          $input.val(val);
          if (onMatch) onMatch(val);
        });
      }

      // Initialize Search Section
      initTagAutocomplete('#pm-search-input', '#pm-tag-select', (val) => {
        _selectedTagNo = val;
      });

      // Initialize Update Status Section
      initTagAutocomplete('#status-update-tag-input', '#status-update-tag-select');

      // Initialize Add PM Modal Section
      initTagAutocomplete('#add-modal-tag-input', '#add-modal-pm-tag-no');

      // Initialize Edit PM Modal Section
      initTagAutocomplete('#edit-modal-tag-input', '#edit-modal-pm-tag-no');

      $('#btn-add-pm').on('click', () => {
        $('#pm-add-modal').addClass('is-open');
      });

      $('#btn-pm-add-save').on('click', function () {
        Swal.fire({
          icon: 'success',
          title: 'Saved!',
          text: 'PM record has been successfully saved.',
          timer: 1500,
          showConfirmButton: false
        }).then(() => {
          $('#pm-add-modal').removeClass('is-open');
        });
      });

      $('#btn-edit-pm').on('click', function () {
        if (!_selectedTagNo) {
          return Swal.fire({
            icon: 'warning',
            title: 'No Tag Selected',
            text: 'Please select a tag from the dropdown or search before editing.',
            confirmButtonColor: '#3085d6'
          });
        }
        $('#edit-modal-pm-tag-no').val(_selectedTagNo);
        $('#edit-modal-tag-input').val(_selectedTagNo);
        $('#pm-edit-modal').addClass('is-open');
      });

      $('#btn-pm-edit-update').on('click', function () {
        Swal.fire({
          icon: 'success',
          title: 'Updated!',
          text: 'PM record has been successfully updated.',
          timer: 1500,
          showConfirmButton: false
        }).then(() => {
          $('#pm-edit-modal').removeClass('is-open');
        });
      });

      $('#btn-delete-pm').on('click', () => {
        if (!_selectedTagNo) {
          return Swal.fire({
            icon: 'warning',
            title: 'No Tag Selected',
            text: 'Please select a tag to perform the delete action.',
            confirmButtonColor: '#3085d6'
          });
        }
        Swal.fire({
          title: 'Delete Tag?',
          text: `Are you sure you want to delete ${_selectedTagNo}?`,
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#d33',
          confirmButtonText: 'Yes, delete it!'
        }).then((result) => {
          if (result.isConfirmed) {
            Swal.fire('Deleted', 'Tag deleted.', 'success');
          }
        });
      });

      $('#btn-submit-status-update').on('click', () => {
        const tag = $('#status-update-tag-input').val();
        if (!tag) return Swal.fire('Error', 'Tag No is required', 'error');
        Swal.fire('Updated', `PM status updated for ${tag}.`, 'success');
        $('#pm-update-status-modal').removeClass('is-open');
      });


      // Global click to close modal
      $(document).on('click', '.gnfc-modal-overlay', function (e) {
        if ($(e.target).hasClass('gnfc-modal-overlay')) {
          $(this).removeClass('is-open');
        }
      });

      // Detail Tab redirection
      $('.detail-tab').on('click', function () {
        const url = $(this).data('url');
        if (url) window.location.href = url;
      });
    });
  </script>
</body>
