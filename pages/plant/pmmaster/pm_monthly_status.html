<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GNFC | PM Monthly Status</title>

  <!-- Project CSS -->
  <link rel="stylesheet" href="../../../css/phosphor.css">
  <link rel="stylesheet" href="../../../css/theme-vars.css">
  <link rel="stylesheet" href="../../../css/utilities.css">
  <link rel="stylesheet" href="../../../css/common.css">
  <link rel="stylesheet" href="../../../css/pages/style.css">

  <!-- Vendor Scripts -->
  <script src="../../../js/vendor/jquery-3.7.1.min.js"></script>
  <script src="../../../js/theme-control.js"></script>
  <script src="../../../js/sidebar.js" defer></script>
  <script src="../../../js/header.js" defer></script>
  <script src="../../../js/pm-nav.js" defer></script>

  <script>window.activePage = 'plants';</script>
</head>

<body class="dashboard-body">
  <div class="sidebar-container"></div>

  <main class="main-wrapper">
    <div id="header-container" data-title="PM Monthly Status"
      data-breadcrumb="Plant:../plant.html,PM Master:pm_master.html,Monthly Status:active"
      data-back="pm_master.html"></div>

    <div class="dashboard-content dashboard-scroll">
      <div class="mx-auto flex flex-col gap-16px" style="width: 100%;">
        
        <!-- PM Navigation Container -->
        <div id="pm-nav-container"></div>
        
        <div class="jbd-card">
          <div class="jbd-card-header">
            <h3 class="font-14px fw-700 color-blue text-uppercase flex items-center gap-8px">
              <i class="ph-bold ph-calendar-check"></i> Instrument Data - PM Monthly Status
            </h3>
          </div>
          <div class="p-16px">
            <div class="flex flex-col gap-16px">
              <div class="flex items-center gap-16px pb-12px border-bottom-dark-border">
                <div class="flex items-center gap-12px">
                  <label class="fw-500">Select Month</label>
                  <div class="jt-select-wrap" style="width: 180px;">
                    <select id="monthly-status-select" class="jt-select cursor-pointer">
                      <option value="ALL">ALL</option>
                      <option value="JAN">January</option>
                      <option value="FEB">February</option>
                      <option value="MAR">March</option>
                      <option value="APR">April</option>
                      <option value="MAY">May</option>
                      <option value="JUN">June</option>
                      <option value="JUL">July</option>
                      <option value="AUG">August</option>
                      <option value="SEP">September</option>
                      <option value="OCT">October</option>
                      <option value="NOV">November</option>
                      <option value="DEC">December</option>
                    </select>
                    <i class="ph-bold ph-caret-down jt-select-caret"></i>
                  </div>
                </div>
              </div>

              <div class="user-table-wrapper">
                <table class="user-table">
                  <thead>
                    <tr>
                      <th class="text-center">TAG_NO</th>
                      <th class="text-center">Type Of Inst</th>
                      <th class="text-center">PM DATE</th>
                      <th class="text-center">TECH</th>
                      <th class="text-center">CRITICALITY</th>
                      <th class="text-center">MODE</th>
                    </tr>
                  </thead>
                  <tbody id="monthly-status-tbody">
                    <tr class="user-table-row">
                      <td class="user-table-cell text-center">FT_1422</td>
                      <td class="user-table-cell text-center">FLOW TRANSMITTER</td>
                      <td class="user-table-cell text-center">25/03/2026</td>
                      <td class="user-table-cell text-center">VVM</td>
                      <td class="user-table-cell text-center">No</td>
                      <td class="user-table-cell text-center">RUNNING</td>
                    </tr>
                    <tr class="user-table-row">
                      <td class="user-table-cell text-center">LSH_1442_05</td>
                      <td class="user-table-cell text-center">LEVEL SWITCH</td>
                      <td class="user-table-cell text-center"></td>
                      <td class="user-table-cell text-center"></td>
                      <td class="user-table-cell text-center">No</td>
                      <td class="user-table-cell text-center">RUNNING</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script>
    $(document).ready(function () {
      // Placeholder for monthly status filter logic
    });
  </script>
</body>

</html>
