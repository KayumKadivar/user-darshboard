<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tag Filter Analysis | GNFC</title>
  <meta name="description" content="GNFC Historical Job Records Filtered by Tag Number">

  <!-- CSS -->
  <link rel="stylesheet" href="../css/phosphor.css">
  <link rel="stylesheet" href="../css/theme-vars.css">
  <link rel="stylesheet" href="../css/utilities.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/modal-ui.css">
  <link rel="stylesheet" href="../css/pages/style.css">

  <!-- JS Vendors -->
  <script src="../js/vendor/jquery-3.7.1.min.js"></script>
  <script src="../js/theme-control.js"></script>
  <script src="../js/sidebar.js" defer></script>
  <script src="../js/header.js" defer></script>
  <script src="../js/plant-nav.js" defer></script>

  <script>
    window.activePage = 'tagwise_filter';
  </script>
</head>

<body class="dashboard-body">

  <!-- Sidebar -->
  <div class="sidebar-container"></div>

  <!-- Main -->
  <main class="main-wrapper">

    <!-- Header -->
    <div id="header-container" data-title="Acetic Acid Logbook" data-back="plant_detail.html"></div>

    <!-- Page Content -->
    <section class="jt-page-content">

      <!-- Plant Navigation -->
      <div id="plant-nav-container"></div>

      <!-- ── FILTER CARD ── -->
      <div class="jt-filter-card" style="margin-bottom: 24px;">
        <div class="jt-filter-header">
          <h3 class="jt-filter-title">
            <i class="ph-bold ph-funnel"></i>
            SEARCH CRITERIA
          </h3>
        </div>
        <div class="jt-filter-body" style="grid-template-columns: 320px auto;">
          
          <!-- Tag Input -->
          <div class="jt-filter-group">
            <label class="jt-filter-label">Tag Number</label>
            <div class="jt-input-icon-wrap" style="position: relative; width: 100%;">
              <i class="ph-bold ph-magnifying-glass" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--typo-label); font-size: 14px; pointer-events: none; z-index: 2;"></i>
              <input type="text" id="tagInput" value="A7801A" class="jt-input jt-mono" placeholder="Enter Tag (e.g. PT-101)" style="padding-left: 36px;">
            </div>
          </div>

          <!-- Actions -->
          <div class="jt-filter-group" style="display: flex; align-items: flex-end; gap: 12px;">
            <button onclick="showReport()" class="jt-btn-primary">
              <i class="ph-bold ph-lightning"></i> APPLY
            </button>
            <button onclick="resetView()" class="jt-btn-reset">
              <i class="ph-bold ph-arrow-counter-clockwise"></i>
            </button>
          </div>

        </div>
      </div>

      <!-- ── RESULTS SECTION ── -->
      <div id="report-container" style="display: none; flex-direction: column; gap: 16px;">

        <div class="jt-report-header">
          <div class="jt-report-title">
            <i class="ph-fill ph-tag"></i>
            <div class="jt-title-stack">
              <h3 class="jt-main-title">Tag-wise History Report</h3>
              <p style="font-size: 13px; color: var(--brand-orange); margin-top: 2px;">
                Searching for Tag: <span id="displayTag" class="jt-mono" style="font-weight: 700;"></span>
              </p>
            </div>
          </div>
        </div>

        <!-- Table Card -->
        <div class="jt-table-card">
          <div class="user-table-wrapper">
            <table class="user-table">
              <thead>
                <tr>
                  <th rowspan="2" class="user-table-center" style="width: 64px;">Sr</th>
                  <th rowspan="2" class="user-table-center" style="width: 80px;">Area</th>
                  <th class="user-table-left" style="width: 140px;">Loop No</th>
                  <th class="user-table-left" style="width: 380px;">Job</th>
                  <th rowspan="2" class="user-table-center" style="width: 80px;">Tech</th>
                  <th style="min-width: 400px;">Description</th>
                  <th rowspan="2" class="user-table-center" style="width: 100px;">Status</th>
                  <th rowspan="2" style="min-width: 160px;">Remarks</th>
                </tr>
                <tr>
                  <th class="user-table-left">Tag No</th>
                  <th class="user-table-left">Type of Job</th>
                </tr>
              </thead>
              <tbody id="reportTableBody">
                <!-- Rows injected via JS -->
              </tbody>
            </table>
          </div>
        </div>

      </div>

    </section>
  </main>

  <script>
    /* Mock Historical Data */
    const historyData = [
      {
        date: '30/01/2026',
        items: [
          { sr: 1, area: '7800', loop: 'N.A.', tag: 'A7801A', job: 'To be checked as reported Cable found full in hanging condition near 7800 sec.', type: 'HOUSE KEEPING', tech1: 'ALS', desc: 'Proper cable dressing done.', tech2: 'ALS', status: 'OVER' }
        ]
      },
      {
        date: '29/01/2026',
        items: [
          { sr: 2, area: 'N.A.', loop: 'N.A.', tag: 'A7801A', job: 'To be checked as reported Cable found full in hanging condition near 7800 sec.', type: 'HOUSE KEEPING', tech1: 'ALS', desc: 'Job is U/P.', tech2: 'ALS', status: 'U/P' }
        ]
      },
      {
        date: '24/01/2026',
        items: [
          { sr: 3, area: '7800', loop: 'N.A.', tag: 'A7801A', job: 'To be checked as reported Cable found full in hanging condition near 7800 sec.', type: 'HOUSE KEEPING', tech1: 'ALS', desc: 'Cable was detached from cable tray. So it is req to dressing it proper.', tech2: 'ALS', status: 'U/P' }
        ]
      },
      {
        date: '02/03/2022',
        items: [
          { sr: 4, area: '7800', loop: 'N.A.', tag: 'A7801A', job: '7800 all sequence valve oil level to be topped up.', type: 'PM', tech1: 'ALS', desc: 'KV7802, 7804, 7805, 7807 oil filling done.', tech2: 'ALS', status: 'OVER' }
        ]
      },
      {
        date: '10/07/2017',
        items: [
          { sr: 5, area: '7800', loop: 'N.A.', tag: 'A7801A', job: '', type: 'PROCESS REQMT', tech1: '', desc: 'TE449 -As per process requirement Element disconnected from its nipple union connections.', tech2: 'GAZ', status: 'OVER' }
        ]
      },
      {
        date: '12/11/2013',
        items: [
          { sr: 6, area: '7800', loop: 'N.A.', tag: 'A7801A', job: '', type: 'N.A.', tech1: '', desc: '-Visited to store and Metso metso make valve PV2303, PV2304, PV2325 valve spare part identified and its list prepared.', tech2: 'GAZ', status: 'OVER' }
        ]
      },
      {
        date: '21/05/2011',
        items: [
          { sr: 7, area: 'N.A.', loop: 'N.A.', tag: 'A7801A', job: '', type: 'PROCESS REQMT', tech1: '', desc: 'As per process req. Pressure measurement of N2 line after NRV done(5.8bar).', tech2: 'ALS', status: 'OVER' }
        ]
      },
      {
        date: '20/05/2011',
        items: [
          { sr: 8, area: 'N.A.', loop: 'N.A.', tag: 'A7801A', job: '', type: 'PROCESS REQMT', tech1: '', desc: 'As per process req. pressure measurement done(70bar) in Nitrogen line in A7801.', tech2: 'ALS', status: 'OVER' }
        ]
      },
      {
        date: '01/10/2009',
        items: [
          { sr: 9, area: '7800', loop: 'N.A.', tag: 'A7801A', job: 'SEC 7800 C/V pm to be done.', type: 'PM', tech1: 'JMD', desc: 'Permit not issued due to startup activity.', tech2: 'JMD', status: 'OVER' }
        ]
      },
      {
        date: '22/06/2007',
        items: [
          { sr: 10, area: 'N.A.', loop: 'N.A.', tag: 'A7801A', job: 'analyzer round to be taken', type: 'PM', tech1: 'JMD', desc: 'Routine analyzer round taken, except sec500/600. Also CO level was found high in sec700 ana. room.', tech2: 'JMD', status: 'OVER' }
        ]
      }
    ];

    function showReport() {
      const tagValue = document.getElementById('tagInput').value;
      if (!tagValue) return;

      document.getElementById('displayTag').innerText = tagValue;
      
      // Ensure the section is visible
      const reportContainer = document.getElementById('report-container');
      reportContainer.style.display = 'flex';
      
      // Keep the search filter card visible (user request)
      document.querySelector('.jt-filter-card').style.display = 'block';
      
      renderTable();
    }

    function resetView() {
      document.getElementById('tagInput').value = '';
      document.getElementById('report-container').style.display = 'none';
      document.querySelector('.jt-filter-card').style.display = 'block';
    }

    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[m];
      });
    }

    function renderTable() {
      const tbody = document.getElementById('reportTableBody');
      let html = '';
      let totalRecords = 0;

      for (let i = 0; i < historyData.length; i++) {
        const group = historyData[i];
        
        // Date Header Row
        html += '<tr class="user-table-date">' +
                  '<td colspan="8" class="user-table-bold" style="background: rgba(87, 148, 242, 0.05); color: var(--brand-primary);">' +
                    '<i class="ph-bold ph-calendar-blank"></i> ' + group.date +
                  '</td>' +
                '</tr>';

        // Data Rows
        for (let j = 0; j < group.items.length; j++) {
          totalRecords++;
          const item = group.items[j];
          const badgeClass = item.status === 'OVER' ? 'ui-badge--success' : 'ui-badge--warning';

          html += '<tr class="user-table-row">' +
            '<td class="user-table-center user-table-secondary user-table-bold">' + item.sr + '</td>' +
            '<td class="user-table-center user-table-bold user-table-primary">' + item.area + '</td>' +
            
            // Loop / Tag Stack
            '<td>' +
              '<div class="user-table-cell-stack">' +
                '<div class="user-table-primary" style="font-weight: 400; font-size: 13px;">' + item.loop + '</div>' +
                '<div class="user-table-secondary user-table-blue">' + escapeHTML(item.tag) + '</div>' +
              '</div>' +
            '</td>' +

            // Job / Type Stack
            '<td>' +
              '<div class="user-table-cell-stack">' +
                '<div class="user-table-primary" style="font-size: 14px; line-height: 1.3;">' + escapeHTML(item.job || '-') + '</div>' +
                '<div class="user-table-secondary user-table-orange" style="font-size: 11px;">' + item.type + '</div>' +
              '</div>' +
            '</td>' +

            '<td class="user-table-center user-table-bold user-table-secondary">' + item.tech1 + '</td>' +
            '<td class="user-table-primary" style="font-size: 15px; line-height: 1.6;">' + escapeHTML(item.desc) + '</td>' +
            
            '<td class="user-table-center">' +
              '<span class="ui-badge ' + badgeClass + '">' + item.status + '</span>' +
            '</td>' +
            
            '<td></td>' +
          '</tr>';
        }
      }

      tbody.innerHTML = html;
    }
  </script>
</body>

</html>
